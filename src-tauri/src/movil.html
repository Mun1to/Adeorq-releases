<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg">
<link rel="apple-touch-icon" href="/icono-180.png">
<title>Adeorq</title>
<!--
  El conserje de Adeorq en el móvil. Lo sirve `src-tauri/src/movil.rs` desde
  el PC, y llega aquí por Tailscale. Todo va dentro de este archivo: la
  política de la página no deja cargar nada de fuera.

  Lo que el móvil hace es HABLAR con el conserje, MIRAR sus sesiones y, desde
  el 2026-10-07 (decisión E3 de Munir), ESCRIBIR en cualquier terminal: la
  lista de las abiertas, la pantalla de una y una caja para mandarle texto o
  una tecla (Intro, Esc, Ctrl+C). Abrir sesiones sigue siendo del conserje.
-->
<style>
  :root {
    --fondo: #0b1220;
    --capa: rgba(255, 255, 255, 0.045);
    --capa-fuerte: rgba(255, 255, 255, 0.08);
    --borde: rgba(150, 170, 210, 0.16);
    --borde-fuerte: rgba(150, 170, 210, 0.3);
    --tinta: #e6ecf7;
    --suave: #95a3bd;
    --acento: #4d9fff;
    --acento-capa: rgba(77, 159, 255, 0.14);
    --sobre-acento: #06101f;
    --vivo: #7ee08a;
    --pregunta: #f5c451;
    --termino: #ff9a3c;
    --cerrada: #95a3bd;
    --grave: #ffd166;
    --grave-capa: rgba(255, 209, 102, 0.1);
    --mal: #ff8a80;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fondo: #f3f6fb;
      --capa: #ffffff;
      --capa-fuerte: #eef2f9;
      --borde: rgba(40, 70, 120, 0.14);
      --borde-fuerte: rgba(40, 70, 120, 0.28);
      --tinta: #16213a;
      --suave: #5a6a86;
      --acento: #1f6fe0;
      --acento-capa: rgba(31, 111, 224, 0.1);
      --sobre-acento: #ffffff;
      --vivo: #15803d;
      --pregunta: #9a6b12;
      --termino: #c2410c;
      --cerrada: #5a6a86;
      --grave: #9a4b06;
      --grave-capa: #fff4e5;
      --mal: #b42318;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* `hidden` esconde SIEMPRE. Cada `display` de una clase le ganaba y salían
     cosas que no tocaban: el recuadro vacío de los avisos y, al contestar una
     decisión, el botón de enviar otra vez. Una regla en vez de un parche por pieza. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  .vista { display: flex; flex-direction: column; height: 100dvh; }
  .barra {
    display: flex; align-items: center; gap: 6px;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
    border-bottom: 1px solid var(--borde);
    background: var(--fondo);
  }
  .barra h1 { font-size: 16px; line-height: 1.3; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra small { display: block; font-size: 12px; font-weight: 400; color: var(--suave); overflow: hidden; text-overflow: ellipsis; }
  .atras {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: none; display: grid; place-items: center; cursor: pointer;
  }
  .avatar {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 12px 4px 4px 12px; background: var(--acento-capa); color: var(--acento);
  }
  .cuerpo { flex: 1; overflow-y: auto; padding: 14px 14px 20px; overscroll-behavior: contain; }

  /* ── Emparejar ── */
  .emparejar { max-width: 420px; margin: 8vh auto 0; padding: 0 20px; display: grid; gap: 14px; }
  .emparejar h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 0; }
  .emparejar p { margin: 0; color: var(--suave); }
  .campo {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--borde-fuerte);
    background: var(--capa); color: var(--tinta); font: inherit; outline: none;
  }
  .campo:focus { border-color: var(--acento); }
  /* Pegada a su campo: el hueco de la rejilla la dejaba a medio camino del código. */
  .etiqueta-campo { font-size: 13px; color: var(--suave); margin: 4px 0 -8px 2px; }
  .codigo { font-size: 30px; letter-spacing: 0.4em; text-align: center; font-variant-numeric: tabular-nums; }

  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--acento); color: var(--sobre-acento); font-weight: 600;
  }
  .boton:disabled { opacity: 0.5; cursor: default; }
  .nota { padding: 10px 12px; border-radius: 12px; font-size: 14px; background: var(--grave-capa); color: var(--grave); }
  .nota b { color: var(--tinta); }
  .nota .mini { margin-left: 8px; }

  /* ── Lista ── */
  .nueva {
    width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    padding: 14px 16px; border-radius: 22px; cursor: pointer; text-align: left; font-weight: 600;
    border: 1px solid var(--borde-fuerte);
    background: var(--capa); box-shadow: 0 2px 14px rgba(0, 0, 0, 0.1);
  }
  .fila {
    width: 100%; display: block; text-align: left; cursor: pointer;
    padding: 11px 8px; margin: 0; border-radius: 12px;
    border: 0; background: none;
  }
  .fila:active, .segunda:active { background: var(--capa-fuerte); }
  /* El rótulo de la lista, solo cuando hay algo que listar. */
  #filas:not(:empty)::before {
    content: "Recientes"; display: block; margin: 14px 8px 4px;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--suave);
  }
  .fila b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila span { font-size: 13px; color: var(--suave); }
  /* La portada: la caja del conserje se lee como la de un chat (lo que dice
     es lo que hay que hacer con ella), y cada terminal es una fila con su
     punto, como en la barra lateral del escritorio. */
  .barra-portada { border-bottom: 0; padding-bottom: 2px; }
  .barra-portada h1 { font-size: 19px; }
  .barra-portada small { font-size: 13px; }
  .nueva-txt { font-weight: 400; color: var(--suave); }
  .segunda small { margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--suave); }
  .segunda small:empty { display: none; }
  .segunda small + .cuenta-dec { margin-left: 8px; }
  .fila-t { display: flex; align-items: center; gap: 11px; }
  .fila-t b { flex: 1; min-width: 0; font-weight: 500; }
  .fila-t span { flex: none; }
  .punto { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cerrada); opacity: 0.6; }
  .punto[data-tono="trabajando"] { background: var(--vivo); opacity: 1; animation: late 1.6s ease-in-out infinite; }
  .punto[data-tono="pregunta"] { background: var(--pregunta); opacity: 1; }
  .punto[data-tono="termino"] { background: var(--termino); opacity: 1; }
  .vacio { color: var(--suave); text-align: center; margin-top: 12vh; padding: 0 20px; }
  /* Pedir (o quitar) los avisos, al pie de la lista. */
  .avisos {
    display: block;
    width: 100%;
    margin: 18px 0 8px;
    padding: 12px 14px;
    border: 1px solid var(--borde);
    border-radius: 14px;
    background: transparent;
    color: var(--suave);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  /* El `display: block` de arriba le ganaba al `hidden`: dentro del panel, o en
     un navegador sin avisos, quedaba al pie un recuadro vacío que no hacía nada. */
  .avisos[hidden] { display: none; }
  .avisos[data-on="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .avisos:disabled { opacity: 0.6; }

  /* ── Hilo ── */
  .turno { display: flex; margin: 18px 0; }
  .turno[data-rol="tu"] { justify-content: flex-end; }
  .burbuja { max-width: 88%; overflow-wrap: anywhere; }
  .turno[data-rol="tu"] .burbuja {
    padding: 10px 15px; border-radius: 20px 20px 6px 20px;
    background: var(--capa-fuerte);
  }
  .burbuja p { margin: 0 0 8px; }
  .burbuja p:last-child, .burbuja ul:last-child, .burbuja ol:last-child { margin-bottom: 0; }
  .burbuja ul, .burbuja ol { margin: 0 0 8px; padding-left: 22px; }
  .burbuja code { font: 0.9em Consolas, "Cascadia Mono", ui-monospace, monospace; background: var(--capa-fuerte); padding: 1px 5px; border-radius: 5px; }
  .burbuja pre { margin: 0 0 8px; padding: 10px; border-radius: 10px; background: var(--capa-fuerte); white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 Consolas, ui-monospace, monospace; }
  .burbuja h3, .burbuja h4 { margin: 14px 0 6px; line-height: 1.3; }
  .burbuja h3 { font-size: 16.5px; }
  .burbuja h4 { font-size: 15px; color: var(--suave); }
  .burbuja > :first-child { margin-top: 0; }
  .burbuja blockquote { margin: 0 0 8px; padding: 2px 0 2px 12px; border-left: 3px solid var(--borde-fuerte); color: var(--suave); }
  .burbuja hr { border: 0; border-top: 1px solid var(--borde); margin: 12px 0; }
  /* Una tabla no se parte: si no cabe, se mueve de lado ELLA, no la página. */
  .tabla { overflow-x: auto; margin: 0 0 8px; border: 1px solid var(--borde); border-radius: 10px; }
  .tabla table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
  /* `normal`, no el `anywhere` de la burbuja: con ese, la tabla se encogía al
     ancho del móvil partiendo «Antes» en «Ante|s». Mejor que se mueva de lado. */
  .tabla th, .tabla td {
    padding: 6px 10px; text-align: left; vertical-align: top; border-top: 1px solid var(--borde);
    overflow-wrap: normal; max-width: 30ch;
  }
  .tabla th, .tabla code { white-space: nowrap; }
  .tabla thead th { border-top: 0; background: var(--capa-fuerte); font-weight: 600; }
  /* Un bloque de código con su «Copiar»: el mensaje de compactación sale así. */
  .bloque pre { padding-top: 34px; }
  /* Pegado arriba mientras el bloque se vea: el de compactación ocupa más de
     una pantalla, y quien lo lee llega al final, no al principio. */
  .acciones { position: sticky; top: 6px; float: right; display: flex; gap: 6px; margin: 6px 6px 0 0; z-index: 1; }
  .acciones button {
    padding: 3px 10px; border-radius: 999px; cursor: pointer;
    font-size: 12.5px; border: 1px solid var(--borde-fuerte); color: var(--suave);
    /* Opaco: al bajar pasa por encima del texto, y con la capa translúcida del
       tema oscuro se leían los dos a la vez. */
    background: var(--fondo); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }
  .acciones .compactar { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .acciones button[data-hecho="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .herramientas { display: block; font-size: 12px; color: var(--suave); font-style: italic; margin-top: 4px; }
  /* Los pasos de un turno, plegados: «13 pasos» y, al abrir, qué hizo cada uno. */
  .pasos { margin-top: 8px; font-size: 13px; color: var(--suave); }
  .pasos summary {
    display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 0;
    cursor: pointer; list-style: none; width: fit-content; max-width: 100%;
  }
  .pasos summary::-webkit-details-marker { display: none; }
  .pasos summary::before { content: "›"; font-size: 15px; line-height: 1; transition: transform 0.15s; }
  .pasos[open] summary::before { transform: rotate(90deg); }
  .pasos summary b { flex: none; font-weight: 600; color: var(--tinta); }
  .pasos summary span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pasos ol { list-style: none; margin: 8px 0 0 6px; padding: 0 0 0 12px; display: grid; gap: 5px; border-left: 2px solid var(--borde); }
  .pasos li { display: flex; gap: 8px; min-width: 0; }
  .pasos li b { flex: none; font-weight: 600; color: var(--tinta); }
  .pasos li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pasos .antes { font-style: italic; }
  .chip-img {
    display: inline-block; padding: 0 8px; margin-right: 4px; border-radius: 999px; font-size: 12.5px;
    border: 1px solid var(--borde-fuerte); color: var(--suave);
  }

  /* Lo que hace una terminal AHORA, al pie del chat: el transcript solo se
     escribe al acabar cada paso, y sin esto el chat parecía parado. */
  .ahora { display: grid; gap: 3px; margin: 18px 0 6px; }
  .ahora-cab { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--suave); }
  .ahora-cab b { font-weight: 600; color: var(--tinta); }
  /* Lo de debajo, alineado con el texto y no con la mascota. */
  .ahora-que, .ahora-det { margin-left: 47px; }
  .ahora-que { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ahora-det { font: 12.5px/1.4 "Cascadia Mono", Consolas, ui-monospace, monospace; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Una pregunta sí va en su caja: lleva botones, y tiene que verse que es para ti. */
  .ahora[data-tipo="pregunta"] {
    padding: 12px; border-radius: 18px; background: var(--capa);
    border: 1px solid color-mix(in srgb, var(--pregunta) 55%, transparent);
  }
  .ahora[data-tipo="pregunta"] .ahora-cab { color: var(--pregunta); font-weight: 600; }
  .ahora[data-tipo="pregunta"] .ahora-que { margin-left: 0; }
  .opciones-menu { display: grid; gap: 6px; margin-top: 6px; }
  .opciones-menu button {
    display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--borde-fuerte); background: none; color: var(--tinta); font: inherit; text-align: left; cursor: pointer;
  }
  .opciones-menu button .num { flex: none; min-width: 1.2em; color: var(--suave); font-variant-numeric: tabular-nums; }
  .opciones-menu button:disabled { opacity: 0.55; cursor: default; }

  /* Una decisión pendiente se ve desde dentro de una terminal: antes solo
     estaba en la lista, y quien entraba directo a una terminal no la veía. */
  .aviso-dec {
    display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); margin: 6px 12px 0; padding: 7px 12px;
    border-radius: 12px; border: 1px solid color-mix(in srgb, var(--pregunta) 55%, transparent);
    background: color-mix(in srgb, var(--pregunta) 12%, transparent); color: var(--tinta); font: inherit; font-size: 13.5px;
    text-align: left; cursor: pointer;
  }
  .aviso-dec svg { flex: none; color: var(--pregunta); }
  .aviso-dec span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aviso-dec b { font-weight: 650; }
  .aviso-dec em { flex: none; font-style: normal; font-weight: 600; color: var(--pregunta); }

  .tarjeta {
    --c: var(--cerrada);
    display: grid; gap: 6px; width: 100%; text-align: left; cursor: pointer;
    margin: 8px 0; padding: 12px 14px; border-radius: 16px;
    border: 1px solid var(--borde); background: var(--capa);
    box-shadow: inset 3px 0 0 var(--c);
  }
  .tarjeta[data-estado="trabajando"] { --c: var(--vivo); }
  .tarjeta[data-estado="pregunta"] { --c: var(--pregunta); }
  .tarjeta[data-estado="termino"] { --c: var(--termino); }
  .tarjeta-cab { display: flex; align-items: baseline; gap: 8px; }
  .tarjeta-cab b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .estado { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c); font-weight: 600; }
  .estado i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .para { font-size: 15px; }
  .porque { font-size: 13px; color: var(--suave); }
  .porque b { color: var(--tinta); font-weight: 600; }

  /* ── Decisiones ──
     Lo que piden los agentes (decisiones.rs). Ninguna opción sale marcada: la
     recomendada lleva su etiqueta y su porqué, pero elegirla es de Munir
     (GOV.UK: «Do not pre-select radio options»). Mismo orden y mismos números
     que puso el agente, que es lo que se dicta («la 2»). */
  .cuenta-dec {
    margin-left: auto; min-width: 24px; padding: 1px 8px; border-radius: 999px; text-align: center;
    background: var(--pregunta); color: var(--sobre-acento); font-size: 13px; font-weight: 700;
  }
  .cuenta-dec[hidden] { display: none; }
  .dec-cab { display: grid; gap: 6px; margin: 0 0 14px; }
  .dec-cab p { margin: 0; color: var(--suave); }
  .dec-hecha { padding: 10px 12px; border-radius: 12px; background: var(--acento-capa); font-size: 14px; }
  /* Si sigue viva o no (Munir, 2026-10-10: «si siguen activas o no»). Es lo
     primero que hay que saber antes de ponerse a contestar: una decisión cuya
     terminal se cerró ya no la espera nadie, y antes se veía igual que la que
     tenía a un agente parado esperándola. */
  .dec-cab .dec-vig {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px;
    border: 1px solid var(--borde); color: var(--suave);
  }
  .dec-vig i { flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: currentColor; }
  .dec-cab .dec-vig[data-v="viva"] {
    color: var(--tinta); border-color: color-mix(in srgb, var(--pregunta) 55%, transparent);
    background: color-mix(in srgb, var(--pregunta) 12%, transparent);
  }
  .dec-vig[data-v="viva"] i { background: var(--pregunta); animation: late 1.6s ease-in-out infinite; }
  .dec-vig[data-v="huerfana"] { border-style: dashed; }
  /* La lista, por montones: las que te esperan, las que ya no espera nadie
     (con una salida para todas de una vez) y las cerradas. */
  .seccion { display: flex; align-items: center; gap: 8px; margin: 18px 4px 2px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--suave); }
  .seccion:first-child { margin-top: 2px; }
  .seccion span { flex: 1; }
  .seccion-nota { margin: 0 4px 4px; font-size: 13px; color: var(--suave); }
  .tarjeta[data-vigencia="viva"] .estado i { animation: late 1.6s ease-in-out infinite; }
  .tarjeta[data-vigencia="huerfana"] { border-style: dashed; background: none; box-shadow: none; }
  .tarjeta[data-vigencia="huerfana"] b, .tarjeta[data-vigencia="contestada"] b, .tarjeta[data-vigencia="descartada"] b { font-weight: 500; }
  .tarjeta[data-vigencia="contestada"], .tarjeta[data-vigencia="descartada"] { background: none; box-shadow: none; margin: 4px 0; padding: 9px 12px; }
  .tarjeta[data-vigencia="contestada"] .estado { color: var(--vivo); }
  .calma { display: flex; align-items: center; gap: 12px; margin: 6px 4px 4px; color: var(--suave); font-size: 14.5px; }
  /* El pie de una decisión: descartarla, discreto, y contestarla, a todo lo ancho. */
  .pie-dec { display: flex; align-items: center; gap: 10px; }
  .pie-dec .enviar-dec { flex: 1; width: auto; }
  .descartar { flex: none; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--borde-fuerte); background: none; color: var(--suave); cursor: pointer; }
  .descartar:disabled { opacity: 0.5; cursor: default; }
  .pregunta-d { border: 1px solid var(--borde); border-radius: 16px; background: var(--capa); padding: 12px 12px 14px; margin: 0 0 14px; min-width: 0; }
  .pregunta-d legend { padding: 0 6px; font-weight: 650; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
  .letra { color: var(--acento); font-variant-numeric: tabular-nums; }
  .pregunta-d > p { margin: 2px 2px 10px; font-size: 14px; color: var(--suave); }
  .opcion {
    display: flex; align-items: flex-start; gap: 10px; min-height: 48px; padding: 11px 12px; margin: 0 0 8px;
    border: 1px solid var(--borde); border-radius: 12px; cursor: pointer;
  }
  .opcion:has(input:checked) { border-color: var(--acento); background: var(--acento-capa); }
  .opcion input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--acento); }
  .opcion .num { flex: none; min-width: 1.2em; color: var(--suave); font-variant-numeric: tabular-nums; }
  .opcion .txt { display: grid; gap: 3px; min-width: 0; }
  .opcion small { color: var(--suave); font-size: 13.5px; }
  .rec {

    .map((q) => `<rect x="${q.x}" y="${q.y}" width="1.02" height="1.02" fill="${q.c}"/>`).join("");
/** `clave` es quién es esta mascota en la página; dos con la misma clave son la misma. */
function mascota(animo, alto = 26, clave = animo) {
  const m = marchaDe(clave, animo);
  return `<svg class="masc" data-animo="${animo}" data-clave="${esc(clave)}" data-v="${m.v}" viewBox="0 0 ${MASCOTA.ANCHO} ${MASCOTA.ALTO}" width="${Math.round((alto * MASCOTA.ANCHO) / MASCOTA.ALTO)}" height="${alto}" aria-hidden="true">${cuadrosHtml(m)}</svg>`;
}
/** Una reacción, delante de lo que estuviera haciendo: «toque», «hola», «enviado». */
function reaccionaMascota(clave, cual) {
  const m = marchas.get(clave);
  if (!m || sinMovimiento()) return;
  m.marcha = MASCOTA.reaccionar(m.marcha, cual);
  m.hasta = 0;
}
/* Un reloj para todas. Solo trabaja si hay alguna en pantalla, y solo repinta
   la que cambia de postura: entre postura y postura pasan de 130 ms a 3 s. */
setInterval(() => {
  const enPantalla = document.getElementsByClassName("masc");
  if (!enPantalla.length || sinMovimiento()) return;
  const ahora = Date.now();
  for (const el of enPantalla) {
    const m = marchaDe(el.dataset.clave, el.dataset.animo);
    if (m.mirada && ahora >= m.miraHasta) { m.mirada = ""; m.v++; }
    if (ahora >= m.hasta) {
      const r = MASCOTA.avanzar(m.marcha, ahora, Math.random);
      m.marcha = r.marcha;
      m.hasta = ahora + r.espera;
      m.v++;
    }
    if (el.dataset.v !== String(m.v)) { el.innerHTML = cuadrosHtml(m); el.dataset.v = String(m.v); }
  }
}, 50);
/* La tocas y da un brinco. Y si tocas en otro sitio, mira hacia allí un
   momento: en el escritorio sigue al ratón, y aquí el ratón es tu dedo. */
document.addEventListener("pointerdown", (ev) => {
  const tocada = ev.target.closest?.(".masc");
  if (tocada) return reaccionaMascota(tocada.dataset.clave, "toque");
  for (const el of document.getElementsByClassName("masc")) {
    const m = marchas.get(el.dataset.clave);
    const caja = el.getBoundingClientRect();
    if (!m || !caja.width) continue;
    const dx = ev.clientX - (caja.left + caja.width / 2);
    const dy = ev.clientY - (caja.top + caja.height / 2);
    const mirada = dy > caja.height && Math.abs(dx) <= caja.width * 2 ? "bajo" : dx < -caja.width ? "izq" : dx > caja.width ? "der" : "";
    if (mirada !== m.mirada) { m.mirada = mirada; m.v++; }
    m.miraHasta = Date.now() + 2500;
  }
}, { passive: true });

/* Cómo se dice el estado de una terminal (los `WorkState` de lib/pty.ts), y
   con qué tono se pinta: el de las tarjetas del conserje. */
const ESTADO_TERMINAL = {
  a_medias: ["trabajando", "trabajando"],
  pregunta: ["te pregunta", "pregunta"],
  ofrece: ["te espera", "pregunta"],
  tuya: ["te toca", "pregunta"],
  lista: ["terminó", "termino"],
  "": ["quieta", "cerrada"],
};
const estadoTerminal = (t) => ESTADO_TERMINAL[t.estado] || ESTADO_TERMINAL[""];

function hace(segundos) {
  const ms = segundos * 1000;
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return "ahora mismo";
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  if (d <= 7) return `hace ${d} d`;
  return new Date(ms).toLocaleDateString("es", { day: "numeric", month: "short" });
}

/* Lo que acaba de llegar entra desde abajo. Un chat se repinta entero cada
   pocos segundos, así que cada cosa recuerda cuándo nació: repintada a media
   entrada sigue por donde iba (el retraso en negativo), y pasada la entrada no
   vuelve a entrar. Lo del primer pintado ya estaba ahí: no entra.
   `de(clave)` se pega dentro de un `class="…"`. */
const ENTRADA_MS = 260;
function entradas() {
  const nacio = new Map();
  let primera = true;
  return {
    de(clave) {
      if (!nacio.has(clave)) nacio.set(clave, primera ? 0 : Date.now());
      const ms = Date.now() - nacio.get(clave);
      return ms < ENTRADA_MS ? ` nuevo" style="animation-delay:-${ms}ms` : "";
    },
    pintado() { primera = false; },
  };
}

const hoja = (ruta) => String(ruta || "").split(/[\\/]/).filter(Boolean).pop() || ruta;
const claveDe = (w) => `${w.arranque ?? 0}:${w.panel}`;
function nombreDe(w) {
  const marca = MARCA[w.cli] || w.cli || "";
  const m = w.modelo ? ` ${w.modelo.charAt(0).toUpperCase()}${w.modelo.slice(1)}` : "";
  return `${marca}${m}`;
}
const nuevoId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

/** Markdown del conserje y de las sesiones, lo justo: párrafos, listas,
    títulos, tablas, citas, negrita y código. Se escapa TODO antes, así que
    nada de lo que diga el modelo es HTML. Los títulos y las tablas están
    porque las respuestas de un Claude Code van llenas: medido el 2026-10-08
    en sus sesiones de esa semana, cientos de `##` y de filas `| … |` que el
    móvil enseñaba tal cual, con las almohadillas y las barras. */
function md(texto) {
  const lineas = esc(texto).split("\n");
  const enLinea = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  let html = "", lista = null, parrafo = [], codigo = null, tabla = null, cita = null;
  const cierraParrafo = () => { if (parrafo.length) { html += `<p>${parrafo.map(enLinea).join("<br>")}</p>`; parrafo = []; } };
  const cierraLista = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const cierraTabla = () => {
    if (!tabla) return;
    const [cab, ...filas] = tabla;
    const celdas = (f, tag) => f.map((c) => `<${tag}>${enLinea(c)}</${tag}>`).join("");
    html += `<div class="tabla"><table><thead><tr>${celdas(cab, "th")}</tr></thead><tbody>${filas.map((f) => `<tr>${celdas(f, "td")}</tr>`).join("")}</tbody></table></div>`;
    tabla = null;
  };
  const cierraCita = () => { if (cita) { html += `<blockquote>${cita.map(enLinea).join("<br>")}</blockquote>`; cita = null; } };
  const cierraTodo = () => { cierraParrafo(); cierraLista(); cierraTabla(); cierraCita(); };
  for (const l of lineas) {
    if (l.trim().startsWith("```")) {
      if (codigo) { html += bloque(codigo); codigo = null; }
      else { cierraTodo(); codigo = []; }
      continue;
    }
    if (codigo) { codigo.push(l); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      cierraParrafo(); cierraLista(); cierraCita();
      // La raya de debajo de la cabecera no es una fila.
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l) && l.includes("-")) continue;
      (tabla ||= []).push(l.trim().slice(1, -1).split("|").map((c) => c.trim()));
      continue;
    }
    cierraTabla();
    const q = l.match(/^\s*&gt;\s?(.*)$/);
    if (q) { cierraParrafo(); cierraLista(); (cita ||= []).push(q[1]); continue; }
    cierraCita();
    const t = l.match(/^\s*(#{1,6})\s+(.*)$/);
    if (t) { cierraParrafo(); cierraLista(); html += t[1].length <= 2 ? `<h3>${enLinea(t[2])}</h3>` : `<h4>${enLinea(t[2])}</h4>`; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { cierraParrafo(); cierraLista(); html += "<hr>"; continue; }
    const m = l.match(/^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/);
    if (m) {
      cierraParrafo();
      const tipo = m[1] ? "ul" : "ol";
      if (lista !== tipo) { cierraLista(); html += `<${tipo}>`; lista = tipo; }
      html += `<li>${enLinea(m[3])}</li>`;
      continue;
    }
    if (!l.trim()) { cierraParrafo(); cierraLista(); continue; }
    cierraLista();
    parrafo.push(l);
  }
  if (codigo) html += bloque(codigo);
  cierraTodo();
  return html;
}

/* Un bloque de código con su «Copiar». En la terminal, el mensaje de
   compactación de un `/fin` lleva además «Compactar con esto», que deja
   `/compact <el bloque>` en la caja: es lo que Munir quería hacer desde el
   móvil el 2026-10-08 y no podía. Solo lo deja escrito; mandarlo es suyo. */
const bloque = (lineas) => {
  const compactar = e.vista === "terminal" && /^#\s*(COMPACTACI[ÓO]N|HANDOFF)\b/i.test(lineas.find((l) => l.trim()) || "");
  return `<div class="bloque"><div class="acciones">${compactar ? `<button class="compactar" type="button">Compactar con esto</button>` : ""}<button class="copiar" type="button">Copiar</button></div><pre>${lineas.join("\n")}</pre></div>`;
};
const textoDelBloque = (b) => b.closest(".bloque")?.querySelector("pre")?.textContent ?? "";

/* El «Copiar» de cualquier bloque, de cualquier vista. El portapapeles solo
   existe en una página segura (la de Tailscale lo es, va por https); si no
   está, se cae al `execCommand` de toda la vida. */
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest?.(".copiar");
  if (!b) return;
  const texto = textoDelBloque(b);
  let hecho = false;
  try { await navigator.clipboard.writeText(texto); hecho = true; } catch (_) {
    const t = document.createElement("textarea");
    t.value = texto;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;opacity:0;resize:none";
    document.body.appendChild(t);
    t.select();
    try { hecho = document.execCommand("copy"); } catch (_) {}
    t.remove();
  }
  b.textContent = hecho ? "Copiado" : "No se pudo";
  b.dataset.hecho = String(hecho);
  setTimeout(() => { b.textContent = "Copiar"; b.dataset.hecho = "false"; }, 1600);
});

// ─── Los adjuntos ───────────────────────────────────────────────────────────
// Munir, 2026-10-08: «que también se puedan adjuntar archivos, imágenes». Se
// suben al PC a trozos (`/api/adjuntar`, cada trozo una petición normal) y al
// mandar se añade su RUTA al texto, que es lo que lee Claude Code.

const TROZO = 45000; // el `TROZO_ADJUNTO` de movil.rs
const LADO_MAXIMO = 2048;

/* Una foto del móvil son 3-8 MB y quien la lee la reduce igual: se achica
   aquí, que por datos sube en segundos en vez de en un minuto. Lo que el
   navegador no sabe abrir (HEIC, un PDF) va tal cual. */
async function achicar(archivo) {
  if (!/^image\/(jpeg|png|webp)$/.test(archivo.type) || !window.createImageBitmap) return archivo;
  try {
    const bmp = await createImageBitmap(archivo);
    const lado = Math.max(bmp.width, bmp.height);
    if (lado <= LADO_MAXIMO && archivo.size <= 2500000) { bmp.close?.(); return archivo; }
    const k = Math.min(1, LADO_MAXIMO / lado);
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.round(bmp.width * k);
    lienzo.height = Math.round(bmp.height * k);
    lienzo.getContext("2d").drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
    bmp.close?.();
    const blob = await new Promise((r) => lienzo.toBlob(r, "image/jpeg", 0.88));
    return blob ? new File([blob], `${archivo.name.replace(/\.[^.]+$/, "") || "foto"}.jpg`, { type: "image/jpeg" }) : archivo;
  } catch (_) {
    return archivo;
  }
}

function aBase64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

async function subir(archivo, progreso) {
  const f = await achicar(archivo);
  const bytes = new Uint8Array(await f.arrayBuffer());
  if (!bytes.length) throw new Error("está vacío");
  const total = Math.ceil(bytes.length / TROZO);
  const id = nuevoId();
  let ruta = null;
  for (let i = 0; i < total; i++) {
    const v = await api("POST", "/api/adjuntar", { id, nombre: f.name, parte: i, total, datos: aBase64(bytes.subarray(i * TROZO, (i + 1) * TROZO)) });
    progreso((i + 1) / total);
    if (v.ruta) ruta = v.ruta;
  }
  if (!ruta) throw new Error("el PC no dijo dónde lo guardó");
  return { ruta, nombre: f.name, imagen: f.type.startsWith("image/") ? URL.createObjectURL(f) : null };
}

/* El clip y la bandeja de una caja. `cambio` avisa para encender o apagar el
   botón de enviar; `rutas()` es lo que se añade al texto al mandarlo. */
function montarAdjuntos(caja, cambio) {
  const input = caja.querySelector('input[type="file"]');
  const bandeja = caja.querySelector(".adjuntos");
  const lista = [];
  const pintarBandeja = () => {
    bandeja.hidden = !lista.length;
    bandeja.innerHTML = lista.map((a, i) => {
      const que = a.error ? `No se ha subido: ${a.error}` : a.ruta ? a.nombre : `${a.nombre} · ${Math.round(a.progreso * 100)} %`;
      return `<span class="adjunto" data-estado="${a.error ? "mal" : a.ruta ? "listo" : "subiendo"}">${a.imagen ? `<img src="${a.imagen}" alt="">` : ICONO.clip}<span class="que">${esc(que)}</span><button type="button" class="quitar" data-i="${i}" aria-label="Quitar ${esc(a.nombre)}">×</button></span>`;
    }).join("");
    bandeja.querySelectorAll(".quitar").forEach((b) => b.addEventListener("click", () => {
      const [a] = lista.splice(Number(b.dataset.i), 1);
      if (a?.imagen) URL.revokeObjectURL(a.imagen);
      pintarBandeja();
    }));
    cambio();
  };
  caja.querySelector(".adjuntar").addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const elegidos = [...input.files];
    input.value = "";
    for (const f of elegidos) {
      const a = { nombre: f.name, ruta: null, imagen: null, progreso: 0, error: null };
      lista.push(a);
      pintarBandeja();
      try {
        Object.assign(a, await subir(f, (p) => { a.progreso = p; pintarBandeja(); }));
      } catch (err) {
        a.error = err.message;
      }
      pintarBandeja();
    }
  });
  return {
    subiendo: () => lista.some((a) => !a.ruta && !a.error),
    // Entre comillas si la ruta lleva espacios (una carpeta de usuario con dos nombres).
    rutas: () => lista.filter((a) => a.ruta).map((a) => (/\s/.test(a.ruta) ? `"${a.ruta}"` : a.ruta)),
    vaciar: () => {
      lista.forEach((a) => a.imagen && URL.revokeObjectURL(a.imagen));
      lista.length = 0;
      pintarBandeja();
    },
  };
}

const CLIP = `<button class="adjuntar" type="button" aria-label="Adjuntar una foto o un archivo">${ICONO.clip}</button><input type="file" multiple hidden>`;
const conRutas = (texto, rutas) => [texto, ...rutas].filter(Boolean).join(" ");

async function api(metodo, ruta, cuerpo) {
  const cabeceras = { Authorization: `Bearer ${clave || ""}` };
  if (cuerpo) cabeceras["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch(ruta, { method: metodo, headers: cabeceras, body: cuerpo ? JSON.stringify(cuerpo) : undefined, cache: "no-store" });
  } catch (_) {
    throw new Error("No llego a tu PC. ¿Está encendido, con Adeorq abierto y Tailscale activo en los dos?");
  }
  const v = await r.json().catch(() => ({}));
  if (r.status === 401) {
    olvidarClave();
    throw new Error(v.error || "Este móvil no está emparejado.");
  }
  if (!r.ok) {
    const err = new Error(v.error || `Algo ha fallado (${r.status}).`);
    err.estado = r.status;
    throw err;
  }
  return v;
}

function olvidarClave() {
  clave = null;
  try { localStorage.removeItem(LLAVE); } catch (_) {}
  alPanel({ tipo: "adeorq:olvidar" });
  ir({ vista: "emparejar" });
}

/* Dentro del panel personal de Munir (decisión del 2026-10-08): ahí esta
   página va en un marco, y el navegador le da un almacén aparte que Brave
   vacía al cerrar la pestaña. Emparejar exige ir al PC, así que sin esto
   habría que volver a casa cada vez. La clave la guarda el panel y se la da
   al abrir; se habla SOLO con esa dirección, la misma que deja `movil.rs` en
   `frame-ancestors` (`PANEL_DE_MUNIR`). */
const PANEL = "https://munito-panel.pages.dev";
const enMarco = window.top !== window.self;
function alPanel(mensaje) {
  if (enMarco) try { window.parent.postMessage(mensaje, PANEL); } catch (_) {}
}
window.addEventListener("message", (ev) => {
  if (ev.origin !== PANEL || ev.source !== window.parent || ev.data?.tipo !== "adeorq:clave") return;
  const llegada = typeof ev.data.clave === "string" && /^[A-Za-z0-9_-]{16,128}$/.test(ev.data.clave) ? ev.data.clave : null;
  if (e.vista !== "esperando") return;
  if (llegada) {
    clave = llegada;
    try { localStorage.setItem(LLAVE, clave); } catch (_) {}
  }
  ir({ vista: clave ? "lista" : "emparejar" });
});

// ─── El estado y quien lo pinta ─────────────────────────────────────────────

let e = { vista: clave ? "lista" : enMarco ? "esperando" : "emparejar" };
let reloj = null;
// En el panel y sin clave propia: se le pide la suya, y si no contesta en un
// momento (no la tiene, o el panel es viejo) se empareja como siempre.
if (e.vista === "esperando") {
  alPanel({ tipo: "adeorq:clave?" });
  setTimeout(() => { if (e.vista === "esperando") ir({ vista: "emparejar" }); }, 1500);
}

// Un toque en un aviso abre la página con `#conv=<id>`: se va a esa
// conversación y se limpia la dirección, que no es para guardarla.
{
  const m = /#conv=([A-Za-z0-9_-]{1,64})/.exec(location.hash);
  if (m && clave) e = { vista: "hilo", id: m[1] };
  // Y un aviso de una terminal («te pregunta») abre su pantalla directamente.
  const mt = /#terminal=(\d{1,6})/.exec(location.hash);
  if (mt && clave) e = { vista: "terminal", panel: Number(mt[1]) };
  // El de una decisión (`ask_decision`), la decisión.
  const md = /#decision=(d[0-9a-f]{1,22})/.exec(location.hash);
  if (md && clave) e = { vista: "decision", id: md[1] };
  if (location.hash) history.replaceState(null, "", location.pathname);
}

// Con la página YA abierta, tocar un aviso no la recarga: el service worker la
// lleva a la dirección nueva y eso es solo un cambio de `#`. Se atiende igual.
window.addEventListener("hashchange", () => {
  const mc = /#conv=([A-Za-z0-9_-]{1,64})/.exec(location.hash);
  const mt = /#terminal=(\d{1,6})/.exec(location.hash);
  const md = /#decision=(d[0-9a-f]{1,22})/.exec(location.hash);
  if (location.hash) history.replaceState(null, "", location.pathname);
  if (!clave) return;
  if (md) ir({ vista: "decision", id: md[1] });
  else if (mt) ir({ vista: "terminal", panel: Number(mt[1]) });
  else if (mc) ir({ vista: "hilo", id: mc[1] });
});

// ─── Los avisos, aunque la página esté cerrada ─────────────────────────────
// El service worker (`/sw.js`) recibe el aviso y lo enseña; aquí solo se pide
// permiso, se suscribe con la clave de esta app y se le manda al PC lo que
// devuelve el navegador (ver `push.rs`).

const hayPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
if (hayPush) navigator.serviceWorker.register("/sw.js").catch(() => {});

function claveAServidor(b64url) {
  const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
function aB64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function suscripcionActual() {
  if (!hayPush) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function pedirAvisos() {
  const reg = await navigator.serviceWorker.ready;
  if ((await Notification.requestPermission()) !== "granted") throw new Error("Sin permiso para avisar.");
  const { clave: publica } = await api("GET", "/api/push/clave");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveAServidor(publica) });
  await api("POST", "/api/push/suscribir", {
    endpoint: sub.endpoint,
    p256dh: aB64url(sub.getKey("p256dh")),
    auth: aB64url(sub.getKey("auth")),
  });
}

async function quitarAvisos() {
  const sub = await suscripcionActual();
  if (sub) await sub.unsubscribe();
  await api("POST", "/api/push/olvidar", {});
}

async function pintarAvisos() {
  const b = document.getElementById("avisos");
  // En un marco el navegador no deja pedir avisos: se ponen abriendo la página aparte.
  if (!b || !hayPush || enMarco) return;
  let puestos = false;
  try { puestos = !!(await suscripcionActual()) && Notification.permission === "granted"; } catch (_) {}
  b.hidden = false;
  b.dataset.on = String(puestos);
  b.textContent = puestos ? "Avisos puestos en este móvil · tocar para quitarlos" : "Avisarme en este móvil cuando una sesión me pregunte o termine";
  b.onclick = async () => {
    b.disabled = true;
    try {
      if (puestos) await quitarAvisos(); else await pedirAvisos();
    } catch (err) {
      b.textContent = `No se pudo: ${err.message}`;
      b.disabled = false;
      return;
    }
    b.disabled = false;
    pintarAvisos();
  };
}

// ─── Llevarla como una app ──────────────────────────────────────────────────
// Chrome, Edge y Brave avisan de que la página se puede instalar: se guarda el
// aviso y la lista enseña el botón. Safari no avisa nunca (allí es Compartir >
// Añadir a la pantalla de inicio), así que en un iPhone no sale nada.
let instalable = null;
window.addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  instalable = ev;
  pintarInstalar();
});
window.addEventListener("appinstalled", () => { instalable = null; pintarInstalar(); });

function pintarInstalar() {
  const b = document.getElementById("instalar");
  if (!b) return;
  b.hidden = !instalable || enMarco;
  b.onclick = async () => {
    const aviso = instalable;
    if (!aviso) return;
    instalable = null;
    aviso.prompt();
    await aviso.userChoice.catch(() => {});
    pintarInstalar();
  };
}

/* El nombre con el que sale en Ajustes > Móvil, para saber luego cuál quitar:
   sistema y navegador, que es lo que distingue el móvil del portátil. */
function nombreSugerido() {
  const ua = navigator.userAgent;
  const sistema = /Android/i.test(ua) ? "Android" : /iPhone/i.test(ua) ? "iPhone" : /iPad/i.test(ua) ? "iPad"
    : /Windows/i.test(ua) ? "Windows" : /Mac OS X/i.test(ua) ? "Mac" : /Linux/i.test(ua) ? "Linux" : "Móvil";
  const navegador = navigator.brave ? "Brave" : /EdgA?\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung"
    : /Firefox\/|FxiOS/.test(ua) ? "Firefox" : /Chrome\/|CriOS/.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "";
  return navegador ? `${sistema} · ${navegador}` : sistema;
}

/* `atras` dice por dónde entra la pantalla nueva: hacia delante por la
   derecha, de vuelta por la izquierda. Volver a la portada siempre es volver. */
function ir(cambio, atras = cambio.vista === "lista") {
  clearTimeout(reloj);
  e = { vista: cambio.vista, ...cambio };
  app.dataset.sentido = atras ? "atras" : "adelante";
  pintar();
}

function sondear(ms, fn) {
  clearTimeout(reloj);
  reloj = setTimeout(async () => {
    if (document.visibilityState === "visible") await fn().catch(() => {});
    sondear(ms, fn);
  }, ms);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && e.vista === "hilo") cargarHilo().catch(() => {});
});

function pintar() {
  if (e.vista === "esperando") { app.innerHTML = `<p class="vacio">Conectando con tu PC…</p>`; return; }
  if (e.vista === "emparejar") return pintarEmparejar();
  if (e.vista === "lista") return pintarLista();
  if (e.vista === "hilo") return pintarHiloEntero();
  if (e.vista === "sesion") return pintarSesion();
  if (e.vista === "terminales") return pintarTerminales();
  if (e.vista === "terminal") return pintarTerminal();
  if (e.vista === "decisiones") return pintarDecisiones();
  if (e.vista === "decision") return pintarDecision();
}

/* El ánimo de la mascota de la portada, que es el de todo tu PC de un vistazo:
   la misma cuenta que hace la campana del escritorio (`animoDe`, lib/campana.ts). */
function animoDeTodo(terminales, esperan) {
  if (esperan || terminales.some((t) => estadoTerminal(t)[1] === "pregunta")) return "espera";
  if (terminales.some((t) => t.estado === "a_medias")) return "trabaja";
  if (terminales.some((t) => t.estado === "lista")) return "lista";
  return terminales.length ? "quieta" : "dormida";
}

/* La portada es una bandeja: arriba lo que te reclama (las decisiones que
   siguen vivas y las terminales que te preguntan), debajo cómo va cada
   terminal, y al final lo hablado con el conserje. Antes había que entrar en
   «Tus terminales» y en «Decisiones» para saber si pasaba algo. */
async function pintarLista() {
  // Vuelve con el ánimo que tenía: si nace quieta y a los dos segundos se
  // entera de que te esperan, repetía el susto cada vez que volvías a la portada.
  const animoPortada = marchas.get("portada")?.animo || "quieta";
  app.innerHTML = `
    <div class="vista">
      <header class="barra barra-portada"><span class="avatar avatar-m" id="masc-portada">${mascota(animoPortada, 34, "portada")}</span><h1>Adeorq<small id="yo">tu PC</small></h1></header>
      <main class="cuerpo">
        <button id="nueva" class="nueva"><span class="avatar">${ICONO.chispa}</span><span class="nueva-txt">Dile al conserje qué hay que hacer</span></button>
        <div id="reclaman"></div>
        <div id="portada-term"></div>
        <button id="decisiones" class="nueva segunda"><span class="avatar">${ICONO.decision}</span>Decisiones<small id="dec-sobran"></small><b class="cuenta-dec" id="cuenta-dec" hidden></b></button>
        <button id="terminales" class="nueva segunda"><span class="avatar">${ICONO.terminal}</span>Todas las terminales</button>
        <div id="filas"></div>
        <button id="avisos" class="avisos" hidden></button>
        <button id="instalar" class="avisos" hidden>Instalar Adeorq como app en este aparato</button>
      </main>
    </div>`;
  document.getElementById("nueva").addEventListener("click", () => ir({ vista: "hilo", id: nuevoId(), nueva: true }));
  document.getElementById("terminales").addEventListener("click", () => ir({ vista: "terminales" }));
  document.getElementById("decisiones").addEventListener("click", () => ir({ vista: "decisiones" }));
  pintarAvisos().catch(() => {});
  pintarInstalar();
  // Lo que te reclama y cómo va cada terminal. Solo se repinta si cambió.
  let pintado = null;
  let animo = animoPortada;
  const mirar = async () => {
    const [vd, vt] = await Promise.all([
      api("GET", "/api/decisiones").catch(() => null),
      api("GET", "/api/terminales").catch((err) => ({ fallo: err.message })),
    ]);
    const reclaman = document.getElementById("reclaman");
    if (!reclaman) return;
    const decisiones = vd?.decisiones || [];
    const esperan = vivas(decisiones);
    const sobran = decisiones.filter((d) => d.vigencia === "huerfana").length;
    const terminales = (vt.terminales || []).slice().sort((a, b) => Number(b.agente) - Number(a.agente) || a.panel - b.panel);
    const preguntan = terminales.filter((t) => estadoTerminal(t)[1] === "pregunta");
    const otras = terminales.filter((t) => !preguntan.includes(t));

    // La cuenta del botón: las que te esperan DE VERDAD. Las que ya no espera
    // nadie se dicen al lado, en pequeño, y no suman.
    const c = document.getElementById("cuenta-dec");
    c.hidden = !esperan.length;
    c.textContent = String(esperan.length);
    c.setAttribute("aria-label", `${esperan.length} te esperan`);
    document.getElementById("dec-sobran").textContent = sobran ? plural(sobran, "1 sin nadie detrás", "{n} sin nadie detrás") : "";

    const nuevo = animoDeTodo(terminales, esperan.length);
    if (nuevo !== animo) {
      animo = nuevo;
      document.getElementById("masc-portada").innerHTML = mascota(animo, 34, "portada");
    }
    const yo = document.getElementById("yo");
    const trabajan = terminales.filter((t) => t.estado === "a_medias").length;
    const teLlaman = esperan.length + preguntan.length;
    yo.textContent = vt.fallo ? "tu PC no contesta"
      : [teLlaman ? plural(teLlaman, "1 cosa te espera", "{n} cosas te esperan") : "",
        trabajan ? plural(trabajan, "1 agente trabajando", "{n} agentes trabajando") : ""].filter(Boolean).join(" · ")
        || (terminales.length ? "todo tranquilo" : "sin terminales abiertas");

    const firma = JSON.stringify([esperan, terminales, vt.fallo || ""]);
    if (firma === pintado) return;
    const primera = pintado === null;
    pintado = firma;
    const filaTerminal = (t) => {
      const [palabra, tono] = estadoTerminal(t);
      return `<button class="fila fila-t" data-panel="${t.panel}"><i class="punto" data-tono="${tono}"></i><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><span>${palabra}</span></button>`;
    };
    reclaman.innerHTML = teLlaman
      ? `<h2 class="seccion"><span>Te esperan</span></h2>${esperan.map(tarjetaDecision).join("")}${preguntan.map((t) => {
        const [palabra] = estadoTerminal(t);
        return `<button class="tarjeta${primera ? "" : " nuevo"}" data-estado="pregunta" data-vigencia="viva" data-panel="${t.panel}">
          <span class="tarjeta-cab"><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><span class="estado"><i></i>${palabra}</span></span>
          <span class="porque">Entra y contéstale desde aquí.</span>
        </button>`;
      }).join("")}`
      : "";
    document.getElementById("portada-term").innerHTML = vt.fallo
      ? `<h2 class="seccion"><span>Terminales</span></h2><p class="seccion-nota">${esc(vt.fallo)}</p>`
      : otras.length
        ? `<h2 class="seccion"><span>Terminales</span></h2>${otras.slice(0, 5).map(filaTerminal).join("")}${otras.length > 5 ? `<p class="seccion-nota">y ${otras.length - 5} más, en «Todas las terminales».</p>` : ""}`
        : "";
    reclaman.querySelectorAll(".tarjeta[data-id]").forEach((b) => b.addEventListener("click", () => ir({ vista: "decision", id: b.dataset.id, volver: "lista" })));
    document.querySelectorAll("#reclaman [data-panel], #portada-term [data-panel]").forEach((b) => b.addEventListener("click", () => ir({ vista: "terminal", panel: Number(b.dataset.panel), volver: "lista" })));
  };
  mirar().catch(() => {});
  const cargar = async () => {
    const lista = await api("GET", "/api/lista");
    const filas = document.getElementById("filas");
    if (!filas) return;
    filas.innerHTML = lista.length
      ? lista.map((f) => `<button class="fila" data-id="${esc(f.id)}"><b>${esc(f.titulo || "Conversación nueva")}</b><span>${esc(hace(f.cuando))}${f.trabajos ? ` · ${f.trabajos === 1 ? "1 sesión" : `${f.trabajos} sesiones`}` : ""}</span></button>`).join("")
      : `<p class="vacio">Todavía no has hablado con el conserje. Empieza con el botón de arriba.</p>`;
    filas.querySelectorAll(".fila").forEach((b) => b.addEventListener("click", () => ir({ vista: "hilo", id: b.dataset.id })));
  };
  try { await cargar(); } catch (err) {
    // Un 401 ya ha cambiado de vista (`olvidarClave`): entonces no hay dónde pintarlo.
    const filas = document.getElementById("filas");
    if (filas) filas.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  // Cada seis segundos: es la bandeja de lo que te reclama, y son tres
  // respuestas pequeñas. La lista de conversaciones va en la misma vuelta.
  sondear(6000, () => Promise.all([cargar(), mirar()]));
}

async function cargarHilo() {
  const v = await api("GET", `/api/conversacion?id=${encodeURIComponent(e.id)}`);
  if (e.vista !== "hilo") return;
  e.conv = v.conversacion;
  e.vivo = v.vivo || {};
  e.enCurso = e.vivo.en_curso || null;
  if (e.pendiente && e.conv.turnos.some((t) => t.rol === "tu" && t.texto === e.pendiente)) {
    if (!e.enCurso || !e.enCurso.pensando) e.pendiente = null;
  }
  pintarHilo();
  pintarCaja();
  // Deprisa mientras piensa o alguna sesión trabaja; despacio si todo está quieto.
  const trabaja = Object.values(e.vivo.estados || {}).some((x) => x === "trabajando");
  sondear(e.enCurso?.pensando || e.pendiente ? 2000 : trabaja ? 4000 : 10000, cargarHilo);
}

function tarjeta(w, ent) {
  const estado = (e.vivo?.estados || {})[claveDe(w)] || "cerrada";
  const porque = w.eligio === "router" ? `<b>Lo eligió el router.</b> ${esc(w.porque)}` : "<b>Elegido por ti: el router estaba apagado.</b>";
  const encargo = w.encargo.length > 180 ? `${w.encargo.slice(0, 180)}…` : w.encargo;
  return `<button class="tarjeta${ent.de(`w${claveDe(w)}`)}" data-estado="${estado}" data-clave="${esc(claveDe(w))}">
    <span class="tarjeta-cab"><b>${esc(hoja(w.carpeta))} · ${esc(nombreDe(w))}</b><span class="estado"><i></i>${PALABRA[estado] || estado}</span></span>
    <span class="para">${esc(encargo)}</span>
    <span class="porque">${porque}</span>
  </button>`;
}

function pintarHilo() {
  const hilo = document.getElementById("hilo");
  if (!hilo) return;
  const conv = e.conv;
  const titulo = document.getElementById("titulo");
  if (conv) {
    const vivas = conv.trabajos.filter((w) => !w.soltado && (e.vivo?.estados || {})[claveDe(w)] && (e.vivo.estados[claveDe(w)] !== "cerrada")).length;
    titulo.innerHTML = `${esc(conv.titulo || "Conserje")}<small>${vivas === 0 ? "nada en marcha" : vivas === 1 ? "1 sesión en marcha" : `${vivas} sesiones en marcha`} · ${conv.router ? "el router elige el de cada sesión" : "el router está apagado"}</small>`;
  }
  const abajo = hilo.scrollHeight - hilo.scrollTop - hilo.clientHeight < 60;
  let html = "";
  if (conv && !conv.turnos.length && !e.pendiente) {
    html += `<p class="vacio">Dime qué hay que hacer. Lo parto en trabajos y abro una sesión para cada uno en tu PC; aquí verás cómo va cada una.</p>`;
  }
  const colocadas = new Set();
  // Lo que llega desde el último pintado entra desde abajo. Lo tuyo se
  // reconoce por su texto: así el mensaje que acabas de mandar (pendiente) y
  // el mismo ya apuntado por el PC son uno, y no entra dos veces.
  const ent = (e.ent ||= entradas());
  const claveDeTurno = (t) => (t.rol === "tu" ? `tu:${t.texto}` : `c${t.n}`);
  for (const t of conv?.turnos || []) {
    html += `<div class="turno${ent.de(claveDeTurno(t))}" data-rol="${t.rol === "tu" ? "tu" : "agente"}"><div class="burbuja">${md(t.texto)}</div></div>`;
    if (t.rol === "conserje") {
      for (const w of conv.trabajos.filter((x) => x.turno === t.n)) { html += tarjeta(w, ent); colocadas.add(claveDe(w)); }
    }
  }
  for (const w of (conv?.trabajos || []).filter((x) => !colocadas.has(claveDe(x)))) html += tarjeta(w, ent);
  if (e.pendiente && !(conv?.turnos || []).some((t) => t.rol === "tu" && t.texto === e.pendiente)) {
    html += `<div class="turno${ent.de(`tu:${e.pendiente}`)}" data-rol="tu"><div class="burbuja">${md(e.pendiente)}</div></div>`;
  }
  // Solo cuenta como «ya estaba» lo pintado con la conversación delante.
  if (conv) ent.pintado();
  if (e.enCurso?.pensando || (e.pendiente && !e.enCurso)) {
    html += `<p class="pensando">${mascota("trabaja", 24, "hilo")}${esc(e.enCurso?.paso || "Pensando…")}</p>`;
  }
  if (e.enCurso?.aviso && !e.enCurso.pensando) {
    html += `<p class="nota"><b>Esto no lo he hecho:</b> ${esc(e.enCurso.aviso)}</p>`;
  }
  if (e.enCurso?.error && !e.enCurso.pensando) {
    html += `<p class="nota"><b>No he podido contestar.</b> ${esc(e.enCurso.error)}<button class="mini" id="reintentar">Reintentar</button></p>`;
  }
  if (e.fallo) html += `<p class="nota">${esc(e.fallo)}</p>`;
  if (e.vivo?.error) html += `<p class="nota">No sé cómo va cada sesión: ${esc(e.vivo.error)}</p>`;
  hilo.innerHTML = html;
  hilo.querySelectorAll(".tarjeta").forEach((b) => b.addEventListener("click", () => abrirSesion(b.dataset.clave)));
  const re = document.getElementById("reintentar");
  if (re) re.addEventListener("click", () => enviar(e.enCurso.texto));
  if (abajo) hilo.scrollTop = hilo.scrollHeight;
}

function pintarCaja() {
  const caja = document.getElementById("caja");
  if (!caja) return;
  const texto = document.getElementById("texto");
  const pensando = !!e.enCurso?.pensando;
  caja.dataset.mejorado = String(e.antes != null);
  document.getElementById("aviso-mejora").hidden = e.antes == null;
  const enviarB = document.getElementById("enviar");
  enviarB.innerHTML = pensando ? ICONO.parar : ICONO.subir;
  enviarB.setAttribute("aria-label", pensando ? "Parar" : "Enviar");
  enviarB.disabled = !pensando && ((!texto.value.trim() && !e.adj?.rutas().length) || !!e.adj?.subiendo());
  const mejorarB = document.getElementById("mejorar");
  mejorarB.innerHTML = e.antes != null ? `${ICONO.deshacer}<span>Deshacer</span>` : `${ICONO.chispa}<span>${e.mejorando ? "Mejorando…" : "Mejorar"}</span>`;
  mejorarB.disabled = !!e.mejorando || (e.antes == null && !texto.value.trim());
  const cerebro = document.getElementById("cerebro");
  const elegido = ["haiku", "sonnet", "opus"].includes(e.conv?.cerebro) ? e.conv.cerebro : "sonnet";
  if (document.activeElement !== cerebro) cerebro.value = elegido;
  const routerB = document.getElementById("router");
  const on = e.conv ? e.conv.router : true;
  routerB.dataset.on = String(on);
  routerB.innerHTML = `${ICONO.diana}<span>${on ? "Router: automático" : "Router: apagado"}</span>`;
  // Con el router apagado, qué modelo llevan las sesiones: el fijado en la
  // conversación (en el PC o aquí), y si no Sonnet.
  const fijoCaja = document.getElementById("fijo-caja");
  const fijo = document.getElementById("fijo");
  fijoCaja.hidden = on;
  const fijado = ["haiku", "sonnet", "opus"].includes(e.conv?.fijo) ? e.conv.fijo : "sonnet";
  if (document.activeElement !== fijo) fijo.value = fijado;
}

function mostrarFallo(mensaje) {
  e.fallo = mensaje;
  pintarHilo();
}

async function enviar(repetir) {
  const texto = document.getElementById("texto");
  const escrito = (repetir ?? texto.value).trim();
  const txt = repetir === undefined ? conRutas(escrito, e.adj?.rutas() || []) : escrito;
  if (!txt || (repetir === undefined && e.adj?.subiendo())) return;
  if (repetir === undefined) { texto.value = ""; e.antes = null; e.crecer?.(); e.adj?.vaciar(); }
  e.pendiente = txt;
  e.fallo = null;
  e.enCurso = { pensando: true, paso: "Mandándolo a tu PC…" };
  pintarHilo();
  reaccionaMascota("hilo", "enviado");
  pintarCaja();
  try {
    await api("POST", "/api/enviar", { id: e.id, texto: txt });
  } catch (err) {
    e.enCurso = null;
    e.pendiente = null;
    if (repetir === undefined) { texto.value = txt; e.crecer?.(); }
    mostrarFallo(err.message);
    pintarCaja();
    return;
  }
  cargarHilo().catch((err) => mostrarFallo(err.message));
}

async function parar() {
  await api("POST", "/api/parar", { id: e.id }).catch(() => {});
  cargarHilo().catch(() => {});
}

async function mejorar() {
  const texto = document.getElementById("texto");
  if (e.antes != null) {
    texto.value = e.antes;
    e.antes = null;
    e.crecer?.();
    pintarCaja();
    return;
  }
  const original = texto.value;
  if (!original.trim()) return;
  e.mejorando = true;
  pintarCaja();
  try {
    const v = await api("POST", "/api/mejorar", { texto: original });
    texto.value = v.texto;
    e.antes = original;
    e.crecer?.();
  } catch (err) {
    mostrarFallo(err.message);
  } finally {
    e.mejorando = false;
    pintarCaja();
  }
}

async function elegirCerebro(cerebro) {
  try {
    await api("POST", "/api/cerebro", { id: e.id, cerebro });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

async function elegirFijo(modelo) {
  try {
    await api("POST", "/api/fijo", { id: e.id, modelo });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

async function alternarRouter() {
  const on = e.conv ? e.conv.router : true;
  try {
    await api("POST", "/api/router", { id: e.id, encendido: !on });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

// ─── Las terminales (decisión E3) ───────────────────────────────────────────
// Munir, 2026-10-07: texto libre desde el móvil a cualquier terminal, sabiendo
