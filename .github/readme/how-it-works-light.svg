<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="Download it and open it.: There is no account to create and no key to paste. Tell it where your projects live.: Every folder in there becomes a project in the sidebar, with the sessions you already had in each one. Click a project.: A session of your usual CLI opens in a real terminal, in that folder (Claude Code, out of the box). Click another project and you have two."><g transform="translate(134 8) scale(2.1667)"><g fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></g></g><text x="160" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">Download it and open it.</text><text x="160" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">There is no account to create and</text><text x="160" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">no key to paste.</text><path d="M206 34 H432" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M425 28 L434 34 L425 40" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(454 8) scale(2.1667)"><path fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g><text x="480" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">Tell it where your</text><text x="480" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">projects live.</text><text x="480" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">Every folder in there becomes a</text><text x="480" y="189" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">project in the sidebar, with the</text><text x="480" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">sessions you already had in each</text><text x="480" y="239" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#59636e">one.</text><path d="M526 34 H752" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M745 28 L754 34 L745 40" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(774 8) scale(2.1667)"><path fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M14 4.1L12 6M5.1 8l-2.9-.8M6 12l-1.9 2M7.2 2.2L8 5.1m1.037 4.59a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/></g><text x="800" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#1f2328">Click a project.</text><text x="800" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17