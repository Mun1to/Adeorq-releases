<svg xmlns="http://www.w3.org/2000/svg" width="520" height="541" viewBox="0 0 520 541" role="img" aria-label="Download it and open it.: There is no account to create and no key to paste. Tell it where your projects live.: Every folder in there becomes a project in the sidebar, with the sessions you already had in each one. Click a project.: A session of your usual CLI opens in a real terminal, in that folder (Claude Code, out of the box). Click another project and you have two."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Download it and open it.</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">There is no account to create and no</text><text x="80" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">key to paste.</text><path d="M32 68 V140" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 132 L32 140 L38 132" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 152) scale(2)"><path fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g><text x="80" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Tell it where your projects</text><text x