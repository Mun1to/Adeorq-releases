<!-- ============================================================================
     LA DEMOSTRACIÓN DE LA PORTADA

     No es una maqueta que imita a la app: es la app, congelada. La ventana, cada
     vista, cada sección y lo que dicen las terminales salen del DOM de la app de
     verdad, abierta sobre un taller de demostración (Sam y sus seis proyectos) y
     volcada por `scripts/laboratorio/capturas/volcar.mjs`. Lo empaqueta
     `scripts/hacer-demo.mjs`, y sus tres archivos están GENERADOS:

       app.css          las hojas de estilo de la app
       datos-es.html    la ventana y sus vistas, en español
       datos-en.html    lo mismo en inglés (con ?lang=en)

     A mano solo van esta página, `demo.css` (el marco y los avisos) y `vivo.js`
     (lo que hace que se pueda pulsar). La portada la mete en un <iframe> de
     1920 x 1080 que encoge ella; abierta suelta, se encoge sola para caber.
     ============================================================================ -->
