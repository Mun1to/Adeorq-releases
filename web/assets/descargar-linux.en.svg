<svg xmlns="http://www.w3.org/2000/svg" width="330" height="74" viewBox="0 0 330 74" role="img" aria-label="Download Adeorq for Linux">
  <!--
    The twin of the Windows button, same drawing and same box so the two sit
    level in the README. Only the colour changes: blue is the house colour and
    belongs to the main download, this one takes the app's blue-grey glass so it
    reads as "the other one" rather than as a disabled button.
  -->
  <defs>
    <linearGradient id="cuerpoLnx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6B84"/>
      <stop offset="1" stop-color="#33415B"/>
    </linearGradient>
    <linearGradient id="brilloLnx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="328" height="72" rx="15" fill="url(#cuerpoLnx)"/>
  <rect x="1.5" y="1.5" width="327" height="34" rx="14" fill="url(#brilloLnx)"/>
  <rect x="1" y="1" width="328" height="72" rx="15" fill="none" stroke="#A8BBD8" stroke-opacity="0.45"/>

  <!-- La flecha de bajar, idéntica a la del otro botón. -->
  <g transform="translate(40, 27)" stroke="#F7FBFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8 0 V13"/>
    <path d="M2.6 8 L8 13.4 L13.4 8"/>
    <path d="M0.6 18 H15.4"/>
  </g>

  <text x="74" y="34" font-family="Segoe UI Variable Text,Segoe UI,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="650" fill="#FFFFFF">Download Adeorq</text>
  <text x="74" y="53" font-family="Segoe UI Variable Text,Segoe UI,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.82">Linux · AppImage and .deb</text>
</svg>
