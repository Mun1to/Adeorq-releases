<svg xmlns="http://www.w3.org/2000/svg" width="520" height="570" viewBox="0 0 520 570" role="img" aria-label="Descárgala y ábrela.: No hay cuenta que crear ni clave que pegar. Dile dónde viven tus proyectos.: Cada carpeta de ahí dentro pasa a ser un proyecto en la barra lateral, con las sesiones que ya tenías en cada uno. Haz clic en un proyecto.: Se abre una sesión de tu CLI de siempre en una terminal de verdad, en esa carpeta (Claude Code, de fábrica). Haz clic en otro y ya tienes dos."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Descárgala y ábrela.</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">No hay cuenta que crear ni clave que</text><text x="80" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">pegar.</text><path d="M32 68 V140" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 132 L32 140 L38 132" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 152) scale(2)"><path fill="none" stroke="#1C66DE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g><text x="80" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Dile dónde viven tus</text><text x="80" y=