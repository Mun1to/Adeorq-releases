if" font-size="17" fill="#9198a1">Se abre una sesión de tu CLI de</text><text x="800" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">siempre en una terminal de verdad,</text><text x="800" y="184" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">en esa carpeta (Claude Code, de</text><text x="800" y="209" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">fábrica).</text></svg>