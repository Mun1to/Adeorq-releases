// ─── Decisiones ─────────────────────────────────────────────────────────────
// Lo que un agente le pregunta a Munir con `ask_decision` (decisiones.rs). Se
// contesta aquí, desde cualquier aparato emparejado, y la respuesta vuelve a la
// terminal que preguntó.

/* Cómo se dice cada vigencia (`Vigencia`, en decisiones.rs) y con qué tono se
   pinta. «Viva» es que la terminal que preguntó sigue abierta y espera;
   «huérfana», que está sin contestar pero ya no hay nadie detrás. */
const VIGENCIA = {
  viva: ["te espera", "pregunta"],
  huerfana: ["sin nadie detrás", "cerrada"],
  contestada: ["contestada", "cerrada"],
  descartada: ["descartada", "cerrada"],
};
const vivas = (lista) => (lista || []).filter((d) => d.vigencia === "viva");
const plural = (n, una, varias) => (n === 1 ? una : varias.replace("{n}", n));

/** De quién es y si sigue ahí, en una línea. */
function quienEspera(d) {
  if (d.vigencia === "viva") return d.panel ? `panel ${d.panel}, abierto` : "";
  if (d.vigencia === "huerfana") return d.panel ? `su terminal se cerró` : "de otro arranque de Adeorq";
  return d.panel ? `panel ${d.panel}` : "";
}

function tarjetaDecision(d) {
  const [palabra, tono] = VIGENCIA[d.vigencia] || VIGENCIA.huerfana;
  const n = plural(d.preguntas, "1 pregunta", "{n} preguntas");
  const cerrada = d.vigencia === "contestada" || d.vigencia === "descartada";
  const cuando = hace((cerrada ? d.cerrada ?? d.creada : d.creada) / 1000);
  return `<button class="tarjeta" data-estado="${tono}" data-vigencia="${d.vigencia}" data-id="${esc(d.id)}">
    <span class="tarjeta-cab"><b>${esc(d.titulo)}</b><span class="estado"><i></i>${palabra}</span></span>
    <span class="porque">${esc([d.proyecto, quienEspera(d), cerrada ? "" : n, cuando].filter(Boolean).join(" · "))}</span>
  </button>`;
}

async function descartarDecision(id) {
  const r = await api("POST", "/api/decision/descartar", { id });
  try { localStorage.removeItem(borradorDe(id)); } catch (_) {}
  return r;
}

async function pintarDecisiones() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="Volver">${ICONO.atras}</button>
        <h1>Decisiones<small id="sub-dec">lo que te preguntan tus agentes</small></h1>
      </header>
      <main class="cuerpo" id="decisiones"></main>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir(e.volverPanel ? { vista: "terminal", panel: e.volverPanel } : { vista: "lista" }, true));
  // Solo se repinta si algo cambió: rehacerla cada cinco segundos reiniciaba
  // el latido de las vivas y te quitaba el toque a medio pulsar.
  let pintado = null;
  const cargar = async () => {
    const v = await api("GET", "/api/decisiones");
    const aqui = document.getElementById("decisiones");
    if (!aqui) return;
    const lista = v.decisiones || [];
    const esperan = vivas(lista);
    const huerfanas = lista.filter((d) => d.vigencia === "huerfana");
    const cerradas = lista.filter((d) => d.vigencia === "contestada" || d.vigencia === "descartada");
    const sub = document.getElementById("sub-dec");
    if (sub) {
      sub.textContent = !lista.length ? "lo que te preguntan tus agentes"
        : [esperan.length ? plural(esperan.length, "1 te espera", "{n} te esperan") : "ninguna te espera",
          huerfanas.length ? plural(huerfanas.length, "1 sin nadie detrás", "{n} sin nadie detrás") : ""].filter(Boolean).join(" · ");
    }
    let html = "";
    if (!lista.length) {
      html = `<p class="vacio">No hay ninguna decisión. Cuando un agente te pregunte algo, sale aquí.</p>`;
    } else {
      html += esperan.length
        ? `<h2 class="seccion"><span>Te esperan</span></h2>${esperan.map(tarjetaDecision).join("")}`
        : `<p class="calma">${mascota("quieta", 26, "decisiones")}Nada te espera ahora mismo.</p>`;
      if (huerfanas.length) {
        html += `<h2 class="seccion"><span>Ya no las espera nadie</span><button class="mini" id="limpiar">${plural(huerfanas.length, "Descartar", "Descartar las {n}")}</button></h2>
          <p class="seccion-nota">La terminal que preguntó se cerró. Contestarlas no le llega a nadie.</p>${huerfanas.map(tarjetaDecision).join("")}`;
      }
      if (cerradas.length) html += `<h2 class="seccion"><span>Cerradas</span></h2>${cerradas.map(tarjetaDecision).join("")}`;
    }
    // Por lo que dice la lista y no por el HTML, que lleva dentro a la mascota
    // y esa cambia de postura sola.
    const firma = JSON.stringify(lista);
    if (firma === pintado) return;
    pintado = firma;
    aqui.innerHTML = html;
    aqui.querySelectorAll(".tarjeta").forEach((b) => b.addEventListener("click", () => ir({ vista: "decision", id: b.dataset.id, volverPanel: e.volverPanel })));
    const limpiar = document.getElementById("limpiar");
    if (limpiar) limpiar.addEventListener("click", async () => {
      limpiar.disabled = true;
      limpiar.textContent = "Descartando…";
      // Una a una: son pocas, y así la que falle no se lleva a las demás.
      for (const d of huerfanas) await descartarDecision(d.id).catch(() => {});
      pintado = null;
      cargar().catch(() => {});
    });
  };
  try { await cargar(); } catch (err) {
    const aqui = document.getElementById("decisiones");
    if (aqui) aqui.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  sondear(5000, cargar);
}

/* Lo marcado y lo escrito se guarda solo mientras no se manda: cerrar la
   página a medias no lo pierde. */
const borradorDe = (id) => `adeorq-decision-${id}`;
function leerBorrador(id) {
  try { return JSON.parse(localStorage.getItem(borradorDe(id)) || "{}"); } catch (_) { return {}; }
}
function guardarBorrador(id, b) {
  try { localStorage.setItem(borradorDe(id), JSON.stringify(b)); } catch (_) {}
}

async function pintarDecision() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="Volver a las decisiones">${ICONO.atras}</button>
        <h1 id="titulo">Decisión<small>cargando…</small></h1>
      </header>
      <main class="cuerpo" id="decision"></main>
      <footer class="caja" id="pie-dec" hidden>
        <p class="estado-envio" id="estado-envio" role="status" aria-live="polite"></p>
        <div class="pie-dec">
          <button class="descartar" id="descartar-dec">Descartar</button>
          <button class="boton enviar-dec" id="enviar-dec" disabled>Enviar respuesta</button>
        </div>
      </footer>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir(e.volverPanel ? { vista: "terminal", panel: e.volverPanel } : { vista: e.volver === "lista" ? "lista" : "decisiones" }, true));
  let d;
  try {
    d = await api("GET", `/api/decision?id=${encodeURIComponent(e.id)}`);
  } catch (err) {
    document.getElementById("decision").innerHTML = `<p class="nota">${esc(err.message)}</p>`;
    return;
  }
  const contestada = Boolean(d.respuesta);
  // Descartada: se enseña como quedó, y ya no se contesta.
  const cerrada = contestada || d.vigencia === "descartada";
  const borrador = cerrada ? {} : leerBorrador(d.id);
  const elegida = (q) => contestada ? d.respuesta.elecciones[q.id]?.opcion : borrador[q.id]?.opcion;
  const escrita = (q) => contestada ? d.respuesta.elecciones[q.id]?.texto : borrador[q.id]?.texto;
  const de = [d.proyecto, d.panel ? `panel ${d.panel}` : ""].filter(Boolean).join(" · ");
  document.getElementById("titulo").innerHTML = `${esc(d.titulo)}<small>${esc([de, hace(d.creada / 1000)].filter(Boolean).join(" · "))}</small>`;

  // Lo primero, si alguien la espera todavía.
  const vig = d.vigencia === "viva"
    ? `<p class="dec-vig" data-v="viva"><i></i><span><b>Te espera.</b> ${d.panel ? `El panel ${d.panel} sigue abierto: tu respuesta se teclea allí.` : "El agente la leerá en cuanto la pida."}</span></p>`
    : d.vigencia === "huerfana"
      ? `<p class="dec-vig" data-v="huerfana"><span><b>Ya no la espera nadie.</b> La terminal que preguntó se cerró. Si la contestas se guarda, pero no se teclea en ningún sitio; lo normal es descartarla.</span></p>`
      : d.vigencia === "descartada"
        ? `<p class="dec-vig" data-v="descartada"><span><b>Descartada</b> ${hace((d.descartada ?? d.creada) / 1000)}, sin contestar.</span></p>`
        : "";
  const hecha = contestada
    ? `<p class="dec-hecha">Contestada desde ${esc(d.respuesta.desde)}, ${hace(d.respuesta.cuando / 1000)}. ${d.respuesta.entregada ? `Se tecleó en el panel ${d.panel}.` : "El agente la lee cuando la pide."}</p>`
    : "";
  document.getElementById("decision").innerHTML = `
    <div class="dec-cab">${vig}${hecha}${d.contexto ? `<p>${esc(d.contexto)}</p>` : ""}</div>
    ${d.preguntas.map((q) => `
      <fieldset class="pregunta-d" data-q="${esc(q.id)}"${cerrada ? " disabled" : ""}>
        <legend><span class="letra">${esc(q.id)}</span>${esc(q.titulo)}</legend>
        ${q.contexto ? `<p>${esc(q.contexto)}</p>` : ""}
        ${q.opciones.map((o, i) => `
          <label class="opcion">
            <input type="radio" name="q-${esc(q.id)}" value="${i + 1}"${elegida(q) === i + 1 ? " checked" : ""}>
            <span class="num">${i + 1}</span>
            <span class="txt"><b>${esc(o.texto)}</b>${o.recomendada ? `<em class="rec">Recomendada</em>` : ""}${o.detalle ? `<small>${esc(o.detalle)}</small>` : ""}</span>
          </label>`).join("")}
        ${cerrada && !escrita(q) ? "" : `
        <div class="o">o</div>
        <textarea class="libre" data-q="${esc(q.id)}" rows="2" placeholder="Otra cosa, con tus palabras" aria-label="Otra cosa para la pregunta ${esc(q.id)}, con tus palabras">${esc(escrita(q) || "")}</textarea>`}
      </fieldset>`).join("")}`;
  if (cerrada) return;

  const pie = document.getElementById("pie-dec");
  const boton = document.getElementById("enviar-dec");
  const estado = document.getElementById("estado-envio");
  pie.hidden = false;
  // Repintar la misma pantalla (al contestar o al descartar) no es llegar a otra.
  const repintar = async (dicho) => {
    app.dataset.sentido = "igual";
    await pintarDecision();
    const est = document.getElementById("estado-envio");
    const f = document.getElementById("pie-dec");
    if (!f || !est) return;
    f.hidden = false;
    f.querySelector(".pie-dec").hidden = true;
    est.textContent = dicho;
  };
  /* Descartar: deja de contar entre las que te esperan. A una terminal que
     seguía esperándola se le dice, para que el agente no se quede parado. */
  const descartarB = document.getElementById("descartar-dec");
  descartarB.addEventListener("click", async () => {
    if (cuenta) parar();
    descartarB.disabled = true;
    boton.disabled = true;
    try {
      const r = await descartarDecision(d.id);
      await repintar(r.avisada ? `Descartada. Se le ha dicho al panel ${r.panel} que no espere respuesta.` : "Descartada.");
    } catch (err) {
      descartarB.disabled = false;
      estado.textContent = err.estado === 409 ? "Ya estaba contestada desde otro sitio." : `No se ha descartado: ${err.message}`;
      repasar();
    }
  });
  const leerForm = () => {
    const el = {};
    for (const q of d.preguntas) {
      const marcada = document.querySelector(`input[name="q-${CSS.escape(q.id)}"]:checked`);
      const texto = document.querySelector(`.libre[data-q="${CSS.escape(q.id)}"]`)?.value.trim();
      el[q.id] = { opcion: marcada ? Number(marcada.value) : undefined, texto: texto || undefined };
    }
    return el;
  };
  const completa = (el) => d.preguntas.every((q) => el[q.id].opcion || el[q.id].texto);
  const faltan = (el) => d.preguntas.filter((q) => !el[q.id].opcion && !el[q.id].texto).map((q) => q.id);
  const repasar = () => {
    const el = leerForm();
    guardarBorrador(d.id, el);
    boton.disabled = !completa(el);
    const f = faltan(el);
    if (!cuenta) {
      estado.textContent = !f.length ? ""
        : f.length === 1 ? `Falta la pregunta ${f[0]}.`
        : `Faltan las preguntas ${f.slice(0, -1).join(", ")} y ${f.at(-1)}.`;
    }
  };
  document.getElementById("decision").addEventListener("input", repasar);
  document.getElementById("decision").addEventListener("change", repasar);

  /* Se manda a los cinco segundos, con «Deshacer» mientras tanto: un toque de
     más no le llega al agente (Material, «display an Undo action»). */
  let cuenta = null;
  const parar = () => { clearInterval(cuenta); cuenta = null; boton.textContent = "Enviar respuesta"; repasar(); };
  boton.addEventListener("click", () => {
    if (cuenta) { parar(); estado.textContent = "No se ha mandado."; return; }
    const el = leerForm();
    if (!completa(el)) return;
    let quedan = 5;
    boton.textContent = `Deshacer (${quedan})`;
    estado.textContent = `Se manda en ${quedan} s.`;
    cuenta = setInterval(async () => {
      quedan -= 1;
      if (quedan > 0) { boton.textContent = `Deshacer (${quedan})`; estado.textContent = `Se manda en ${quedan} s.`; return; }
      clearInterval(cuenta);
      cuenta = null;
      boton.disabled = true;
      boton.textContent = "Mandando…";
      try {
        const r = await api("POST", "/api/decision/responder", { id: d.id, elecciones: el });
        try { localStorage.removeItem(borradorDe(d.id)); } catch (_) {}
        await repintar(r.entregada ? `Enviada. Se ha tecleado en el panel ${r.panel}.` : "Enviada. El agente la leerá cuando la pida.");
      } catch (err) {
        boton.textContent = "Enviar respuesta";
        boton.disabled = false;
        // Ya contestada (desde otro aparato): se enseña cómo quedó, y lo tuyo
        // sigue en el borrador por si lo quieres copiar.
        estado.textContent = err.estado === 409 ? "Ya estaba contestada desde otro sitio. Lo que escribiste sigue guardado aquí." : `No se ha mandado: ${err.message}`;
      }
    }, 1000);
  });
  repasar();
}

/* El modo de Claude Code, leído de su propia pantalla: la línea de abajo dice
   «auto mode on», «plan mode on» o «accept edits on» (y nada en el normal).
   Shift+Tab pasa al siguiente; desde el PC es una tecla, desde el móvil no
   había forma, y el modo auto se para ante lo que su clasificador no deja
   (publicar, tocar ajustes) hasta que alguien cambia de modo. */
function modoDe(v) {
  const filas = v.filas || [];
  for (let i = filas.length - 1; i >= 0 && i >= filas.length - 12; i--) {
    const m = /(auto mode|plan mode|accept edits|bypass permissions) on/i.exec(filas[i]);
    if (m) return { "auto mode": "auto", "plan mode": "plan", "accept edits": "aceptar ediciones", "bypass permissions": "sin permisos" }[m[1].toLowerCase()];
  }
  // En el modo normal Claude Code no pinta nada: no se sabe, y no se inventa.
  return null;
}

/* Lo que está haciendo una terminal de agente AHORA, leído de su pantalla.
   Munir, 2026-10-09, desde el móvil: «¿qué pasa?», con el chat parado en lo
   último dicho mientras el agente trabajaba, porque el transcript solo se
   escribe al acabar cada paso. Claude Code lo pinta así:
     ● Listing 1 directory, calling adeorq 2 times, running 1 shell command…
       ⎿  $ curl -s -m 5 http://127.0.0.1:3013/
     · Gallivanting… (26s · ↓ 1.7k tokens)
   y Codex, «• Working (12s • esc to interrupt)». Lo que no se reconoce no se
   inventa: queda «Trabajando» y nada más. */
const GIRO = /^\s*[·✻✳✢✶✽*•◦]\s+\S[^(]*\((\d[^)·•]*)/;
function ahoraDe(v) {
  const filas = (v.filas || []).map((f) => f.replace(/\s+$/, ""));
  if (["pregunta", "ofrece", "tuya"].includes(v.estado)) {
    const m = menuDe(filas);
    // Sin menú que pulsar sigue siendo tu turno: se dice, y contestas en la caja.
    return m ? { tipo: "pregunta", ...m } : { tipo: "espera", que: estadoTerminal(v)[0] };
  }
  // Ni trabaja ni te pregunta: acabó, o está quieta. Antes aquí no se pintaba
  // nada y el pie del chat se quedaba mudo justo cuando había terminado.
  if (v.estado === "lista") return { tipo: "termino" };
  if (v.estado !== "a_medias") return { tipo: "quieta" };
  const desde = Math.max(0, filas.length - 40);
  let giro = filas.length;
  for (let i = filas.length - 1; i >= desde; i--) if (GIRO.test(filas[i])) { giro = i; break; }
  const tiempo = giro < filas.length ? GIRO.exec(filas[giro])[1].trim() : "";
  let que = "";
  let det = "";
  for (let j = giro - 1; j >= desde; j--) {
    const m = /^\s*[●⏺]\s+(.+)$/.exec(filas[j]);
    if (!m) continue;
    // La línea sigue en las de debajo si el panel del PC era más estrecho.
    const partes = [m[1]];
    let k = j + 1;
    for (; k < giro && partes.length < 3 && /^ {2,}\S/.test(filas[k]) && !/^\s*⎿/.test(filas[k]); k++) partes.push(filas[k].trim());
    // Solo si es un paso en marcha («…» al final) o una herramienta, «Bash(…)»:
    // un párrafo suyo ya terminado está en el chat, y aquí parecería la tarea.
    const linea = partes.join(" ");
    if (/…$/.test(linea) || /^[\w.-]+(?: - [\w.-]+ \(MCP\))?\(/.test(linea)) {
      que = linea;
      const d = /^\s*⎿\s+(.+)$/.exec(filas[k] || "");
      det = d ? d[1] : "";
    }
    break;
  }
  return { tipo: "trabajando", que, det, tiempo };
}

/* Una pregunta con opciones numeradas al pie de la pantalla («Do you want to
   proceed? ❯ 1. Yes  2. No…»). Solo se busca cuando la terminal ya está en
   «te pregunta», que si no, cualquier lista numerada de un mensaje lo parecía. */
function menuDe(filas) {
  const abajo = filas.slice(-24).map((f) => f.replace(/^\s*[│┃|]\s?/, "").replace(/\s?[│┃|]\s*$/, ""));
  let opciones = [];
  let primera = -1;
  abajo.forEach((f, k) => {
    const m = /^\s*([❯›>]\s*)?(\d{1,2})[.)]\s+(.+?)\s*$/.exec(f);
    if (!m) return;
    const n = Number(m[2]);
    if (n === 1) { opciones = []; primera = k; }
    if (n === opciones.length + 1) opciones.push({ n, texto: m[3], sel: Boolean(m[1]) });
  });
  if (opciones.length < 2) return null;
  let pregunta = "";
  for (let k = primera - 1; k >= 0; k--) {
    const t = abajo[k].trim();
    if (t && !/^[─━═╭╮╰╯\s]+$/.test(t)) { pregunta = t; break; }
  }
  return { pregunta, opciones };
}

/* El pie del chat: la mascota y lo que pasa ahora. Siempre está, porque es
   quien dice en qué anda la terminal: teclea si trabaja, te llama si te
   pregunta, celebra si acabó y parpadea (o se estira) si no pasa nada. Es UNA
   mascota, la de clave «ahora»: al cambiar de estado no nace otra, cambia de
   ánimo, y por eso se le ve la entrada de cada uno. */
const ANIMO_AHORA = { trabajando: "trabaja", pregunta: "espera", espera: "espera", termino: "lista", quieta: "quieta", cerrada: "dormida" };
function ahoraHtml(a) {
  if (!a) return "";
  const m = mascota(ANIMO_AHORA[a.tipo] || "quieta", 26, "ahora");
  if (a.tipo === "pregunta") {
    return `<div class="ahora-cab">${m}Te pregunta</div>${a.pregunta ? `<div class="ahora-que">${esc(a.pregunta)}</div>` : ""}
      <div class="opciones-menu">${a.opciones.map((o) => `<button data-num="${o.n}"><span class="num">${o.n}</span><span>${esc(o.texto)}</span></button>`).join("")}</div>`;
  }
  if (a.tipo === "espera") return `<div class="ahora-cab">${m}<span><b>Es tu turno:</b> ${esc(a.que)}. Contéstale abajo.</span></div>`;
  if (a.tipo === "termino") return `<div class="ahora-cab">${m}<span><b>Ha terminado.</b> Si quieres que siga, díselo abajo.</span></div>`;
  if (a.tipo === "quieta") return `<div class="ahora-cab">${m}<span>Quieta, esperando a que le digas algo.</span></div>`;
  if (a.tipo === "cerrada") return `<div class="ahora-cab">${m}<span>${esc(a.que)}</span></div>`;
  return `<div class="ahora-cab">${m}Trabajando${a.tiempo ? ` · ${esc(a.tiempo)}` : ""}</div>${a.que ? `<div class="ahora-que">${esc(a.que)}</div>` : ""}${a.det ? `<div class="ahora-det">${esc(a.det)}</div>` : ""}`;
}

/* Una fila de la pantalla, legible en el móvil. Los ⏵ y ⏸ de Claude Code no
   están en la letra del móvil y salían como cajitas; y sus rayas de lado a
   lado, más anchas que el móvil, se partían en dos filas. */
const GLIFOS = { "⏵": "›", "⏸": "‖", "⏺": "●" };
function filaHtml(f) {
  const t = String(f).replace(/[⏵⏸⏺]/g, (c) => GLIFOS[c]);
  if (/^\s*[─━═]{3,}\s*$/.test(t)) return `<span class="l regla" aria-hidden="true"></span>`;
  const m = /^\s*[─━═]{3,}\s+(.+?)\s+[─━═]+\S?\s*$/.exec(t);
  if (m) return `<span class="l regla-titulo">${esc(m[1])}</span>`;
  return `<span class="l">${esc(t)}</span>`;
}

/* Munir, 2026-10-08: «no veo mucho historial de la terminal», y sin verlo no
   podía copiar el mensaje de compactación. La pantalla de un Claude Code a
   pantalla completa no tiene historial ninguno (lo que no cabe, no está en el
   búfer), así que en una terminal de agente se abre por defecto lo que se ha
   dicho, leído de su transcript, y la pantalla queda en la otra pestaña. */
function pintarTerminal() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="Volver a las terminales">${ICONO.atras}</button>
        <h1 id="titulo">Terminal ${e.panel}<small id="sub">cargando…</small></h1>
        <nav class="pestanas" id="pestanas" hidden>
          <button class="pastilla" data-cara="conversa">Chat</button>
          <button class="pastilla" data-cara="pantalla">Pantalla</button>
        </nav>
      </header>
      <button class="aviso-dec" id="aviso-dec" hidden></button>
      <main class="cuerpo" id="conversa" hidden><div id="turnos"></div><div class="ahora" id="ahora" hidden></div></main>
      <main class="cuerpo" id="marco">
        <p class="nota-pantalla" id="nota-pantalla" hidden>Aquí solo cabe lo que se ve ahora en el PC. Todo lo hablado está en el <button data-ir-chat>Chat</button>.</p>
        <pre class="pantalla" id="pantalla"></pre>
      </main>
      <footer class="caja" id="caja">
        <button class="bajar" id="bajar" hidden aria-label="Ir al final">${ICONO.bajar}</button>
        <p class="nota fallo" id="fallo" hidden></p>
        <div class="adjuntos" hidden></div>
        <div class="fila-caja">
          ${CLIP}
          <textarea id="texto" rows="1" placeholder="Escríbele a esta terminal" aria-label="Texto para la terminal"></textarea>
          <button class="enviar" id="enviar" aria-label="Enviar" disabled>${ICONO.subir}</button>
        </div>
        <div class="pastillas teclas">
          <button class="pastilla" data-tecla="intro">Intro</button>
          <button class="pastilla" data-tecla="esc">Esc</button>
          <button class="pastilla" data-tecla="ctrl+c">Ctrl+C</button>
          <button class="pastilla" data-tecla="shift+tab" id="modo" title="Shift+Tab: pasa al siguiente modo de Claude Code">Cambiar modo</button>
          <button class="pastilla" data-tecla="arriba" aria-label="Flecha arriba">↑</button>
          <button class="pastilla" data-tecla="abajo" aria-label="Flecha abajo">↓</button>
        </div>
      </footer>
    </div>`;
  // Se vuelve a donde se entró: a la portada, o a la lista de todas.
  document.getElementById("atras").addEventListener("click", () => ir({ vista: e.volver === "lista" ? "lista" : "terminales" }, true));
  const texto = document.getElementById("texto");
  const enviarB = document.getElementById("enviar");
  const crecer = () => { texto.style.height = "auto"; texto.style.height = `${Math.min(texto.scrollHeight, 160)}px`; };
  // Se manda con texto, con adjuntos o con las dos cosas; mientras sube uno, no.
  const listo = () => { enviarB.disabled = (!texto.value.trim() && !adj.rutas().length) || adj.subiendo(); };
  const adj = montarAdjuntos(document.getElementById("caja"), () => listo());
  texto.addEventListener("input", () => { crecer(); listo(); });
  // Lo que no se pudo mandar se queda a la vista hasta que algo salga bien:
  // antes iba al subtítulo, que la vuelta siguiente del sondeo reescribía.
  const fallo = (m) => { const f = document.getElementById("fallo"); if (f) { f.textContent = m; f.hidden = false; } };
  const salioBien = () => { const f = document.getElementById("fallo"); if (f) f.hidden = true; };
  // Lo último pintado en cada cara. Solo se repinta lo que cambió: rehacerlo
  // cada 3 s le quitaba la selección a quien estaba copiando un trozo.
  const pintado = { pantalla: null, conversa: null };
  const ent = entradas();
  const pegadoAbajo = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  let ultima = null;
  // Al entrar, la mascota te saluda una vez (si no te está llamando ya).
  let saludada = false;
  const cara = () => (e.cara === "pantalla" || !ultima?.conversa ? "pantalla" : "conversa");
  const visible = () => document.getElementById(cara() === "pantalla" ? "marco" : "conversa");
  // «Ir al final», solo cuando has subido: lo que llega mientras lees el
  // historial se pinta debajo y sin esto no se sabría.
  const bajar = document.getElementById("bajar");
  const mirarBajar = () => { const el = visible(); if (el && bajar) bajar.hidden = pegadoAbajo(el); };
  ["marco", "conversa"].forEach((id) => document.getElementById(id).addEventListener("scroll", mirarBajar, { passive: true }));
  bajar.addEventListener("click", () => { const el = visible(); if (el) el.scrollTop = el.scrollHeight; mirarBajar(); });
  const cargar = () => {
    if (vueltas++ % 4 === 0) mirarDecisiones().catch(() => {});
    return leer().then(mirarBajar, (err) => {
      // Una terminal cerrada en el PC deja de contestar: se dice arriba en vez
      // de dejar la última pantalla como si siguiera viva. Y en el chat, la
      // mascota se duerme: ahí ya no hay nadie.
      const s = document.getElementById("sub");
      if (s) s.textContent = err.message;
      if (ultima?.conversa) pintarAhora({ tipo: "cerrada", que: err.message });
    });
  };
  const leer = async () => {
    const v = await api("GET", `/api/terminal?panel=${e.panel}`);
    const marco = document.getElementById("marco");
    const conversa = document.getElementById("conversa");
    if (!marco || !conversa) return;
    ultima = { ...v, conversa: Boolean(v.agente && v.sesion && v.carpeta) };
    const modo = modoDe(v);
    const bModo = document.getElementById("modo");
    if (bModo) bModo.textContent = modo ? `Modo: ${modo} ⇄` : "Cambiar modo";
    const [palabra] = estadoTerminal(v);
    document.getElementById("titulo").innerHTML = `${esc(v.nombre)}<small id="sub">${esc(hoja(v.carpeta))} · ${palabra}</small>`;
    const ahora = cara();
    document.getElementById("pestanas").hidden = !ultima.conversa;
    document.querySelectorAll(".pestanas .pastilla").forEach((b) => { b.dataset.on = String(b.dataset.cara === ahora); });
    marco.hidden = ahora !== "pantalla";
    conversa.hidden = ahora !== "conversa";

    if (ahora === "pantalla") {
      // En una de agente la pantalla no tiene historial (Claude Code pinta la
      // suya entera): se dice, con el camino al chat, que es donde está.
      document.getElementById("nota-pantalla").hidden = !ultima.conversa;
      const filas = v.filas?.length ? v.filas : ["(la pantalla está vacía)"];
      const texto = filas.join("\n");
      if (texto !== pintado.pantalla) {
        const abajo = pintado.pantalla === null || pegadoAbajo(marco);
        document.getElementById("pantalla").innerHTML = filas.map(filaHtml).join("");
        pintado.pantalla = texto;
        if (abajo) marco.scrollTop = marco.scrollHeight;
      }
      return;
    }
    // Lo de ahora antes que el transcript: se ve aunque este tarde o falle.
    const seguia = pegadoAbajo(conversa);
    const a = ahoraDe(v);
    pintarAhora(a);
    if (!saludada) {
      saludada = true;
      if (a?.tipo === "quieta" || a?.tipo === "trabajando") reaccionaMascota("ahora", "hola");
    }
    if (seguia) conversa.scrollTop = conversa.scrollHeight;
    const lista = document.getElementById("turnos");
    let r;
    try {
      // `si`: la firma de lo pintado. Si no cambió, el PC contesta solo «igual».
      r = await api("GET", `/api/sesion?cwd=${encodeURIComponent(v.carpeta)}&id=${encodeURIComponent(v.sesion)}&si=${encodeURIComponent(pintado.conversa ?? "")}`);
    } catch (err) {
      // Codex, Gemini y compañía no escriben en `~/.claude`: ahí solo queda la pantalla.
      if (pintado.conversa !== err.message) lista.innerHTML = `<p class="vacio">No encuentro lo que ha dicho esta sesión (${esc(err.message)}). Lo que se ve está en «Pantalla».</p>`;
      pintado.conversa = err.message;
      return;
    }
    if (r.igual || !document.getElementById("turnos")) return;
    const abajo = pintado.conversa === null || pegadoAbajo(conversa);
    // Repintar cerraba los pasos que tenías abiertos: se recuerdan por su hora.
    const abiertos = new Set([...lista.querySelectorAll("details.pasos[open]")].map((d) => d.dataset.k));
    lista.innerHTML = r.turnos.length ? turnosHtml(r.turnos, ent) : `<p class="vacio">Esta sesión todavía no ha dicho nada.</p>`;
    lista.querySelectorAll("details.pasos").forEach((d) => { if (abiertos.has(d.dataset.k)) d.open = true; });
    pintado.conversa = r.firma;
    if (abajo) conversa.scrollTop = conversa.scrollHeight;
  };
  // Se compara lo que DICE y no el HTML, que lleva dentro a la mascota y esa
  // cambia de postura sola: comparando el HTML se rehacía en cada vuelta y los
  // botones de una pregunta nacían de nuevo bajo el dedo.
  let ahoraPintado = null;
  const pintarAhora = (a) => {
    const el = document.getElementById("ahora");
    const dice = JSON.stringify(a);
    if (!el || dice === ahoraPintado) return;
    ahoraPintado = dice;
    const cambiaDeTipo = el.dataset.tipo !== (a?.tipo || "");
    el.hidden = !a;
    el.dataset.tipo = a?.tipo || "";
    el.innerHTML = ahoraHtml(a);
    // Solo al cambiar de estado llega desde abajo: que «26s» pase a «27s» no es llegar.
    if (cambiaDeTipo && a) { el.classList.remove("cambia"); void el.offsetWidth; el.classList.add("cambia"); }
  };
  // Las opciones de una pregunta mandan su número, que `mandar_texto` (pty.rs)
  // teclea como tecla suelta, sin Intro, porque así lo esperan esos menús.
  const ahoraEl = document.getElementById("ahora");
  ahoraEl.addEventListener("mousedown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
  ahoraEl.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-num]");
    if (!b) return;
    const botones = [...ahoraEl.querySelectorAll("button[data-num]")];
    botones.forEach((x) => { x.disabled = true; });
    try {
      await api("POST", "/api/terminal/escribir", { panel: e.panel, texto: b.dataset.num });
      salioBien();
      reaccionaMascota("ahora", "enviado");
      enSeguida();
    } catch (err) {
      fallo(`No se ha mandado: ${err.message}`);
      botones.forEach((x) => { x.disabled = false; });
    }
  });
  document.querySelector("[data-ir-chat]").addEventListener("click", () => {
    e.cara = "conversa";
    pintado.conversa = null;
    cargar();
  });
  // Las decisiones pendientes, cada cuatro vueltas (12 s): no cambian a menudo.
  let vueltas = 0;
  const mirarDecisiones = async () => {
    const v = await api("GET", "/api/decisiones");
    const b = document.getElementById("aviso-dec");
    if (!b) return;
    // Solo las que siguen vivas: una decisión cuya terminal se cerró no es
    // motivo para ponerte un aviso encima del chat de otra.
    const pend = vivas(v.decisiones);
    b.hidden = !pend.length;
    if (!pend.length) return;
    // La de ESTA terminal va primero: es la que tiene a este agente parado.
    pend.sort((x, y) => Number(y.panel === e.panel) - Number(x.panel === e.panel));
    const suya = pend[0].panel === e.panel;
    b.innerHTML = `${ICONO.decision}<span><b>${pend.length === 1 ? (suya ? "Esta terminal espera tu decisión" : "Una decisión te espera") : `${pend.length} decisiones te esperan`}</b> · ${esc(pend[0].titulo)}</span><em>Contestar</em>`;
    b.onclick = () => ir(pend.length === 1 ? { vista: "decision", id: pend[0].id, volverPanel: e.panel } : { vista: "decisiones", volverPanel: e.panel });
  };
  document.querySelectorAll(".pestanas .pastilla").forEach((b) => b.addEventListener("click", () => {
    e.cara = b.dataset.cara;
    // Al volver a una cara, se repinta y se baja al final, como al entrar.
    pintado[e.cara] = null;
    cargar();
  }));
  // Tras escribir, la pantalla tarda un instante en reflejarlo: se vuelve a
  // pedir en seguida en vez de esperar a la vuelta siguiente del sondeo.
  const enSeguida = () => setTimeout(cargar, 700);
  enviarB.addEventListener("click", async () => {
    const txt = conRutas(texto.value.trim(), adj.rutas());
    if (!txt || adj.subiendo()) return;
    enviarB.disabled = true;
    try {
      await api("POST", "/api/terminal/escribir", { panel: e.panel, texto: txt });
      texto.value = "";
      adj.vaciar();
      crecer();
      salioBien();
      reaccionaMascota("ahora", "enviado");
      enSeguida();
    } catch (err) {
      fallo(`No se ha mandado: ${err.message}`);
      listo();
    }
  });
  // Pulsar una tecla no le quita el foco a la caja ni se lo da al botón: así no
  // cambia nada de sitio a mitad del toque, y si estabas escribiendo, el
  // teclado sigue fuera.
  document.querySelectorAll(".pastilla[data-tecla]").forEach((b) => b.addEventListener("mousedown", (ev) => ev.preventDefault()));
  document.querySelectorAll(".pastilla[data-tecla]").forEach((b) => b.addEventListener("click", async () => {
    try {
      await api("POST", "/api/terminal/tecla", { panel: e.panel, tecla: b.dataset.tecla });
      salioBien();
      enSeguida();
    } catch (err) {
      fallo(`No se ha mandado: ${err.message}`);
    }
  }));
  cargar();
  sondear(3000, cargar);
}

/* «Compactar con esto»: el bloque, con la orden delante, en la caja de la
   terminal. `mandar_texto` (pty.rs) teclea la orden y pega el resto, así que
   le llega a Claude Code como orden y no como un mensaje. */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest?.(".compactar");
  const caja = document.getElementById("texto");
  if (!b || !caja || e.vista !== "terminal") return;
  caja.value = `/compact ${textoDelBloque(b).trim()}`;
  caja.dispatchEvent(new Event("input"));
  caja.scrollTop = 0;
  b.textContent = "En la caja: dale a enviar";
  b.dataset.hecho = "true";
  setTimeout(() => { b.textContent = "Compactar con esto"; b.dataset.hecho = "false"; }, 2400);
});

// ─── Una sesión, para leerla ────────────────────────────────────────────────

/** Las herramientas de un turno, contadas: uno de una sesión de verdad usa
    cientos, y en fila salía un párrafo de «Read · Read · Bash · Read…». */
function resumenHerramientas(lista) {
  const n = new Map();
  for (const h of lista) {
    const k = h.startsWith("mcp__") ? h.split("__")[1] : h;
    n.set(k, (n.get(k) || 0) + 1);
  }
  return [...n].map(([k, v]) => (v > 1 ? `${k} ×${v}` : k)).join(" · ");
}

/** Los turnos de un transcript (`session_messages`), como burbujas. Con `ent`,
    los que llegan desde el último pintado entran desde abajo; un turno se
    reconoce por su hora (o por cómo empieza, si no la trae), no por su sitio
    en la lista, que son «los últimos 80» y se corre con cada turno nuevo. */
const turnosHtml = (turnos, ent) => {
  const html = turnos.map((t) => {
    // «[Image #1]» es como Claude Code apunta una imagen pegada: aquí, una etiqueta.
    const texto = md(t.texto).replace(/\[Image #(\d+)\]/g, '<span class="chip-img">imagen $1</span>');
    const llega = ent ? ent.de(`${t.rol}|${t.hora || t.texto.slice(0, 48)}`) : "";
    return `<div class="turno${llega}" data-rol="${t.rol === "tu" ? "tu" : "agente"}"><div class="burbuja">${texto}${pasosHtml(t)}</div></div>`;
  }).join("");
  ent?.pintado();
  return html;
};

/** Los pasos de un turno, plegados: cuántos, de qué, y al abrir qué hizo cada
    uno (`pasos`, de sessions.rs; los últimos 30 del turno). */
function pasosHtml(t) {
  const n = t.herramientas?.length || 0;
  if (!n) return "";
  const resumen = esc(resumenHerramientas(t.herramientas));
  if (!t.pasos?.length) return `<span class="herramientas">${resumen}</span>`;
  const antes = n - t.pasos.length;
  const filas = t.pasos.map((p) => `<li><b>${esc(p.nombre)}</b>${p.detalle ? `<span>${esc(p.detalle)}</span>` : ""}</li>`).join("");
  return `<details class="pasos" data-k="${esc(t.hora)}"><summary><b>${n === 1 ? "1 paso" : `${n} pasos`}</b><span>${resumen}</span></summary>
    <ol>${antes > 0 ? `<li class="antes">y ${antes} antes</li>` : ""}${filas}</ol></details>`;
}

function abrirSesion(cl) {
  const w = (e.conv?.trabajos || []).find((x) => claveDe(x) === cl);
  if (!w) return;
  const sid = (e.vivo?.sesiones || {})[cl] || w.sesion;
  ir({ vista: "sesion", w, sid, volver: { id: e.id } });
}

function pintarSesion() {
  const w = e.w;
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="Volver al conserje">${ICONO.atras}</button>
        <h1>${esc(hoja(w.carpeta))}<small>${esc(nombreDe(w))} · ${esc(w.encargo)}</small></h1>
      </header>
      <main class="cuerpo" id="sesion"></main>
      <p class="solo-lectura">Solo para leer. Si quieres decirle algo, díselo al conserje.</p>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir({ vista: "hilo", id: e.volver.id }, true));
  const cuerpo = document.getElementById("sesion");
  if (!e.sid) {
    cuerpo.innerHTML = `<p class="vacio">Esta sesión todavía no ha escrito nada. En cuanto empiece, aparece aquí.</p>`;
    return;
  }
  const cargar = async () => {
    const turnos = await api("GET", `/api/sesion?cwd=${encodeURIComponent(w.carpeta)}&id=${encodeURIComponent(e.sid)}`);
    const aqui = document.getElementById("sesion");
    if (!aqui) return;
    const abajo = aqui.scrollHeight - aqui.scrollTop - aqui.clientHeight < 60;
    aqui.innerHTML = turnos.length ? turnosHtml(turnos) : `<p class="vacio">Todavía no hay nada que leer.</p>`;
    if (abajo) aqui.scrollTop = aqui.scrollHeight;
  };
  cargar().catch((err) => { cuerpo.innerHTML = `<p class="nota">${esc(err.message)}</p>`; });
  sondear(5000, cargar);
}

pintar();
</script>
