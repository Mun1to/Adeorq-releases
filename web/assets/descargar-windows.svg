<svg xmlns="http://www.w3.org/2000/svg" width="330" height="74" viewBox="0 0 330 74" role="img" aria-label="Descargar Adeorq para Windows">
  <!--
    El botón de descarga del README.
    En un README de GitHub no hay CSS, así que un botón de verdad solo puede ser
    una imagen. Se dibuja con los dos azules de la casa (azul claro y oscuro de
    styles/base.css) para que sea el botón de Adeorq y no un badge cualquiera.
    El texto va en fuentes del sistema en cascada: en Windows sale en Segoe UI,
    y donde no la haya, en la sans que toque.
    OJO: en un comentario XML no puede aparecer un guion doble. Un «(dos guiones)azul»
    aquí dentro tuvo el botón ROTO en GitHub del 8 al 17 de agosto de 2026: el SVG
    entero deja de parsear y el navegador enseña el alt. Lo vigila scripts/svg-check.mjs.
  -->
  <defs>
    <linearGradient id="cuerpoWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D9FFF"/>
      <stop offset="1" stop-color="#1C66DE"/>
    </linearGradient>
    <linearGradient id="brilloWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="328" height="72" rx="15" fill="url(#cuerpoWin)"/>
  <!-- El filo encendido de arriba, como los botones de la app. -->
  <rect x="1.5" y="1.5" width="327" height="34" rx="14" fill="url(#brilloWin)"/>
  <rect x="1" y="1" width="328" height="72" rx="15" fill="none" stroke="#8FC0FF" stroke-opacity="0.55"/>

  <!-- La flecha de bajar -->
  <g transform="translate(40, 27)" stroke="#F7FBFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8 0 V13"/>
    <path d="M2.6 8 L8 13.4 L13.4 8"/>
    <path d="M0.6 18 H15.4"/>
  </g>

  <text x="74" y="34" font-family="Segoe UI Variable Text,Segoe UI,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="650" fill="#FFFFFF">Descargar Adeorq</text>
  <text x="74" y="53" font-family="Segoe UI Variable Text,Segoe UI,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.82">Windows 10 y 11 · instalador .exe</text>
</svg>
