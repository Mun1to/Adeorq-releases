  montarBotonCajon();
  const texto = document.getElementById("texto");
  const crecer = () => { texto.style.height = "auto"; texto.style.height = `${Math.min(texto.scrollHeight, 160)}px`; };
  texto.addEventListener("input", () => {

    e.antes = null;
    pintarCaja();
  });
  document.getElementById("enviar").addEventListener("click", () => (e.enCurso?.pensando ? parar() : enviar()));
  document.getElementById("mejorar").addEventListener("click", mejorar);
  document.getElementById("router").addEventListener("click", alternarRouter);
  document.getElementById("cerebro").addEventListener("change", (ev) => elegirCerebro(ev.target.value));
  document.getElementById("fijo").addEventListener("change", (ev) => elegirFijo(ev.target.value));
  e.crecer = crecer;
  e.adj = montarAdjuntos(document.getElementById("caja"), () => pintarCaja());
  pintarHilo();
  pintarCaja();
  // Lo escrito en la portada sale nada más llegar: la conversación se abre con
  // tu mensaje ya de camino.
  if (e.alEntrar) {
    const primero = e.alEntrar;
    e.alEntrar = null;
    enviar(primero);
    return;
  }
  cargarHilo().catch((err) => mostrarFallo(err.message));
}

async function cargarHilo() {
  const v = await api("GET", `/api/conversacion?id=${encodeURIComponent(e.id)}`);
  if (e.vista !== "hilo") return;
  e.conv = v.conversacion;
  e.vivo = v.vivo || {};
  e.enCurso = e.vivo.en_curso || null;
  if (e.pendiente && e.conv.turnos.some((t) => t.rol === "tu" && t.texto === e.pendiente)) {
    if (!e.enCurso || !e.enCurso.pensando) e.pendiente = null;
  }
  pintarHilo();
  pintarCaja();
  // Deprisa mientras piensa o alguna sesión trabaja; despacio si todo está quieto.
  const trabaja = Object.values(e.vivo.estados || {}).some((x) => x === "trabajando");
  sondear(e.enCurso?.pensando || e.pendiente ? 2000 : trabaja ? 4000 : 10000, cargarHilo);
}

function tarjeta(w, ent) {
  const estado = (e.vivo?.estados || {})[claveDe(w)] || "cerrada";
  const porque = w.eligio === "router" ? `<b>${tr("Lo eligió el router.")}</b> ${esc(w.porque)}` : `<b>${tr("Elegido por ti: el router estaba apagado.")}</b>`;
  const encargo = w.encargo.length > 180 ? `${w.encargo.slice(0, 180)}…` : w.encargo;
  return `<button class="tarjeta${ent.de(`w${claveDe(w)}`)}" data-estado="${estado}" data-clave="${esc(claveDe(w))}">
    <span class="tarjeta-cab"><b>${esc(hoja(w.carpeta))} · ${esc(nombreDe(w))}</b><span class="estado"><i></i>${PALABRA[estado] || estado}</span></span>
    <span class="para">${esc(encargo)}</span>
    <span class="porque">${porque}</span>
  </button>`;
}

function pintarHilo() {
  const hilo = document.getElementById("hilo");
  if (!hilo) return;
  const conv = e.conv;
  const titulo = document.getElementById("titulo");
  if (conv) {
    const vivas = conv.trabajos.filter((w) => !w.soltado && (e.vivo?.estados || {})[claveDe(w)] && (e.vivo.estados[claveDe(w)] !== "cerrada")).length;
    titulo.innerHTML = `${esc(conv.titulo || tr("Conserje"))}<small>${vivas === 0 ? tr("nada en marcha") : vivas === 1 ? tr("1 sesión en marcha") : tr("{n} sesiones en marcha", { n: vivas })} · ${conv.router ? tr("el router elige el de cada sesión") : tr("el router está apagado")}</small>`;
  }
  const abajo = hilo.scrollHeight - hilo.scrollTop - hilo.clientHeight < 60;
  let html = "";
  if (conv && !conv.turnos.length && !e.pendiente) {
    html += `<p class="vacio">${tr("Dime qué hay que hacer. Lo parto en trabajos y abro una sesión para cada uno en tu PC; aquí verás cómo va cada una.")}</p>`;
  }
  const colocadas = new Set();
  // Lo que llega desde el último pintado entra desde abajo. Lo tuyo se
  // reconoce por su texto: así el mensaje que acabas de mandar (pendiente) y
  // el mismo ya apuntado por el PC son uno, y no entra dos veces.
  const ent = (e.ent ||= entradas());
  const claveDeTurno = (t) => (t.rol === "tu" ? `tu:${t.texto}` : `c${t.n}`);
  for (const t of conv?.turnos || []) {
    html += `<div class="turno${ent.de(claveDeTurno(t))}" data-rol="${t.rol === "tu" ? "tu" : "agente"}"><div class="burbuja">${md(t.texto)}</div></div>`;
    if (t.rol === "conserje") {
      for (const w of conv.trabajos.filter((x) => x.turno === t.n)) { html += tarjeta(w, ent); colocadas.add(claveDe(w)); }
    }
  }
  for (const w of (conv?.trabajos || []).filter((x) => !colocadas.has(claveDe(x)))) html += tarjeta(w, ent);
  if (e.pendiente && !(conv?.turnos || []).some((t) => t.rol === "tu" && t.texto === e.pendiente)) {
    html += `<div class="turno${ent.de(`tu:${e.pendiente}`)}" data-rol="tu"><div class="burbuja">${md(e.pendiente)}</div></div>`;
  }
  // Solo cuenta como «ya estaba» lo pintado con la conversación delante.
  if (conv) ent.pintado();
  if (e.enCurso?.pensando || (e.pendiente && !e.enCurso)) {
    html += `<p class="pensando">${mascota("trabaja", 24, "hilo")}${esc(delPc(e.enCurso?.paso) || tr("Pensando…"))}</p>`;
  }
  if (e.enCurso?.aviso && !e.enCurso.pensando) {
    html += `<p class="nota"><b>${tr("Esto no lo he hecho:")}</b> ${esc(delPc(e.enCurso.aviso))}</p>`;
  }
  if (e.enCurso?.error && !e.enCurso.pensando) {
    html += `<p class="nota"><b>${tr("No he podido contestar.")}</b> ${esc(delPc(e.enCurso.error))}<button class="mini" id="reintentar">${tr("Reintentar")}</button></p>`;
  }
  if (e.fallo) html += `<p class="nota">${esc(e.fallo)}</p>`;
  if (e.vivo?.error) html += `<p class="nota">${esc(tr("No sé cómo va cada sesión: {e}", { e: delPc(e.vivo.error) }))}</p>`;
  hilo.innerHTML = html;
  hilo.querySelectorAll(".tarjeta").forEach((b) => b.addEventListener("click", () => abrirSesion(b.dataset.clave)));
  const re = document.getElementById("reintentar");
  if (re) re.addEventListener("click", () => enviar(e.enCurso.texto));
  if (abajo) hilo.scrollTop = hilo.scrollHeight;
}

function pintarCaja() {
  const caja = document.getElementById("caja");
  if (!caja) return;
  const texto = document.getElementById("texto");
  const pensando = !!e.enCurso?.pensando;
  caja.dataset.mejorado = String(e.antes != null);
  document.getElementById("aviso-mejora").hidden = e.antes == null;
  const enviarB = document.getElementById("enviar");
  enviarB.innerHTML = pensando ? ICONO.parar : ICONO.subir;
  enviarB.setAttribute("aria-label", pensando ? tr("Parar") : tr("Enviar"));
  enviarB.disabled = !pensando && ((!texto.value.trim() && !e.adj?.rutas().length) || !!e.adj?.subiendo());
  const mejorarB = document.getElementById("mejorar");
  mejorarB.innerHTML = e.antes != null ? `${ICONO.deshacer}<span>${tr("Deshacer")}</span>` : `${ICONO.chispa}<span>${e.mejorando ? tr("Mejorando…") : tr("Mejorar")}</span>`;
  mejorarB.disabled = !!e.mejorando || (e.antes == null && !texto.value.trim());
  const cerebro = document.getElementById("cerebro");
  const elegido = ["haiku", "sonnet", "opus"].includes(e.conv?.cerebro) ? e.conv.cerebro : "sonnet";
  if (document.activeElement !== cerebro) cerebro.value = elegido;
  const routerB = document.getElementById("router");
  const on = e.conv ? e.conv.router : true;
  routerB.dataset.on = String(on);
  routerB.innerHTML = `${ICONO.diana}<span>${on ? tr("Router: automático") : tr("Router: apagado")}</span>`;
  // Con el router apagado, qué modelo llevan las sesiones: el fijado en la
  // conversación (en el PC o aquí), y si no Sonnet.
  const fijoCaja = document.getElementById("fijo-caja");
  const fijo = document.getElementById("fijo");
  fijoCaja.hidden = on;
  const fijado = ["haiku", "sonnet", "opus"].includes(e.conv?.fijo) ? e.conv.fijo : "sonnet";
  if (document.activeElement !== fijo) fijo.value = fijado;
}

function mostrarFallo(mensaje) {
  e.fallo = mensaje;
  pintarHilo();
}

async function enviar(repetir) {
  const texto = document.getElementById("texto");
  const escrito = (repetir ?? texto.value).trim();
  const txt = repetir === undefined ? conRutas(escrito, e.adj?.rutas() || []) : escrito;
  if (!txt || (repetir === undefined && e.adj?.subiendo())) return;
  if (repetir === undefined) { texto.value = ""; e.antes = null; e.crecer?.(); e.adj?.vaciar(); }
  e.pendiente = txt;
  e.fallo = null;
  e.enCurso = { pensando: true, paso: tr("Mandándolo a tu PC…") };
  pintarHilo();
  reaccionaMascota("hilo", "enviado");
  pintarCaja();
  try {
    await api("POST", "/api/enviar", { id: e.id, texto: txt });
  } catch (err) {
    e.enCurso = null;
    e.pendiente = null;
    if (repetir === undefined) { texto.value = txt; e.crecer?.(); }
    mostrarFallo(err.message);
    pintarCaja();
    return;
  }
  cargarHilo().catch((err) => mostrarFallo(err.message));
}

async function parar() {
  await api("POST", "/api/parar", { id: e.id }).catch(() => {});
  cargarHilo().catch(() => {});
}

async function mejorar() {
  const texto = document.getElementById("texto");
  if (e.antes != null) {
    texto.value = e.antes;
    e.antes = null;
    e.crecer?.();
    pintarCaja();
    return;
  }
  const original = texto.value;
  if (!original.trim()) return;
  e.mejorando = true;
  pintarCaja();
  try {
    const v = await api("POST", "/api/mejorar", { texto: original });
    texto.value = v.texto;
    e.antes = original;
    e.crecer?.();
  } catch (err) {
    mostrarFallo(err.message);
  } finally {
    e.mejorando = false;
    pintarCaja();
  }
}

async function elegirCerebro(cerebro) {
  try {
    await api("POST", "/api/cerebro", { id: e.id, cerebro });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

async function elegirFijo(modelo) {
  try {
    await api("POST", "/api/fijo", { id: e.id, modelo });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

async function alternarRouter() {
  const on = e.conv ? e.conv.router : true;
  try {
    await api("POST", "/api/router", { id: e.id, encendido: !on });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

// ─── Decisiones ─────────────────────────────────────────────────────────────
// Lo que un agente le pregunta a Munir con `ask_decision` (decisiones.rs). Se
// contesta aquí, desde cualquier aparato emparejado, y la respuesta vuelve a la
// terminal que preguntó.

/* Cómo se dice cada vigencia (`Vigencia`, en decisiones.rs) y con qué tono se
   pinta. «Viva» es que la terminal que preguntó sigue abierta y espera;
   «huérfana», que está sin contestar pero ya no hay nadie detrás; «hablada»,
   que le escribiste a su terminal en vez de contestarla aquí. */
const VIGENCIA = {
  viva: [tr("te espera"), "pregunta"],
  huerfana: [tr("sin nadie detrás"), "cerrada"],
  hablada: [tr("hablada"), "cerrada"],
  contestada: [tr("contestada"), "cerrada"],
  descartada: [tr("descartada"), "cerrada"],
};
const vivas = (lista) => (lista || []).filter((d) => d.vigencia === "viva");
/** `una` y `varias` llegan ya traducidas; `varias` lleva su `{n}`. */
const plural = (n, una, varias) => (n === 1 ? una : varias.replace("{n}", n));

/** De quién es y si sigue ahí, en una línea. */
function quienEspera(d) {
  if (d.vigencia === "viva") return d.panel ? tr("panel {n}, abierto", { n: d.panel }) : "";
  if (d.vigencia === "huerfana") return d.panel ? tr("su terminal se cerró") : tr("de otro arranque de Adeorq");
  if (d.vigencia === "hablada") return d.panel ? tr("le escribiste al panel {n}", { n: d.panel }) : "";
  return d.panel ? tr("panel {n}", { n: d.panel }) : "";
}

function tarjetaDecision(d) {
  const [palabra, tono] = VIGENCIA[d.vigencia] || VIGENCIA.huerfana;
  const n = plural(d.preguntas, tr("1 pregunta"), tr("{n} preguntas"));
  const cerrada = d.vigencia !== "viva" && d.vigencia !== "huerfana";
  const cuando = hace((cerrada ? d.cerrada ?? d.creada : d.creada) / 1000);
  return `<button class="tarjeta" data-estado="${tono}" data-vigencia="${d.vigencia}" data-id="${esc(d.id)}">
    <span class="tarjeta-cab"><b>${esc(d.titulo)}</b><span class="estado"><i></i>${palabra}</span></span>
    <span class="porque">${esc([d.proyecto, quienEspera(d), cerrada ? "" : n, cuando].filter(Boolean).join(" · "))}</span>
  </button>`;
}

async function descartarDecision(id) {
  const r = await api("POST", "/api/decision/descartar", { id });
  try { localStorage.removeItem(borradorDe(id)); } catch (_) {}
  return r;
}

async function pintarDecisiones() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        ${e.volverPanel ? `<button class="atras" id="atras" aria-label="${tr("Volver")}">${ICONO.atras}</button>` : botonCajon()}
        <h1>${tr("Decisiones")}<small id="sub-dec">${tr("lo que te preguntan tus agentes")}</small></h1>
      </header>
      <main class="cuerpo" id="decisiones"></main>
    </div>`;
  // Si llegaste desde una terminal, la flecha te devuelve a ella; si no, el menú.
  document.getElementById("atras")?.addEventListener("click", () => ir({ vista: "terminal", panel: e.volverPanel, arranque: e.volverArranque }, true));
  montarBotonCajon();
  // Solo se repinta si algo cambió: rehacerla cada cinco segundos reiniciaba
  // el latido de las vivas y te quitaba el toque a medio pulsar.
  let pintado = null;
  const cargar = async () => {
    const v = await api("GET", "/api/decisiones");
    const aqui = document.getElementById("decisiones");
    if (!aqui) return;
    const lista = v.decisiones || [];
    const esperan = vivas(lista);
    // Todo lo que ya no te espera va junto y se limpia solo (a la semana se
    // borra): antes las que nadie esperaba tenían montón y botón propios, y
    // había que vaciarlo a mano.
    const anteriores = lista.filter((d) => d.vigencia !== "viva")
      .sort((a, b) => (b.cerrada ?? b.creada) - (a.cerrada ?? a.creada));
    const sub = document.getElementById("sub-dec");
    if (sub) {
      sub.textContent = !lista.length ? tr("lo que te preguntan tus agentes")
        : esperan.length ? plural(esperan.length, tr("1 te espera"), tr("{n} te esperan")) : tr("ninguna te espera");
    }
    let html = "";
    if (!lista.length) {
      html = `<p class="vacio">${tr("No hay ninguna decisión. Cuando un agente te pregunte algo, sale aquí.")}</p>`;
    } else {
      html += esperan.length
        ? `<h2 class="seccion"><span>${tr("Te esperan")}</span></h2>${esperan.map(tarjetaDecision).join("")}`
        : `<p class="calma">${mascota("quieta", 26, "decisiones")}${tr("Nada te espera ahora mismo.")}</p>`;
      if (anteriores.length) {
        html += `<h2 class="seccion"><span>${tr("Anteriores")}</span></h2>
          <p class="seccion-nota">${tr("Ya no te esperan. A la semana se borran solas.")}</p>${anteriores.map(tarjetaDecision).join("")}`;
      }
    }
    // Por lo que dice la lista y no por el HTML, que lleva dentro a la mascota
    // y esa cambia de postura sola.
    const firma = JSON.stringify(lista);
    if (firma === pintado) return;
    pintado = firma;
    aqui.innerHTML = html;
    aqui.querySelectorAll(".tarjeta").forEach((b) => b.addEventListener("click", () => ir({ vista: "decision", id: b.dataset.id, volverPanel: e.volverPanel, volverArranque: e.volverArranque })));
  };
  try { await cargar(); } catch (err) {
    const aqui = document.getElementById("decisiones");
    if (aqui) aqui.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  sondear(5000, cargar);
}

/* Lo marcado y lo escrito se guarda solo mientras no se manda: cerrar la
   página a medias no lo pierde. */
const borradorDe = (id) => `adeorq-decision-${id}`;
function leerBorrador(id) {
  try { return JSON.parse(localStorage.getItem(borradorDe(id)) || "{}"); } catch (_) { return {}; }
}
function guardarBorrador(id, b) {
  try { localStorage.setItem(borradorDe(id), JSON.stringify(b)); } catch (_) {}
}

async function pintarDecision() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="${tr("Volver a las decisiones")}">${ICONO.atras}</button>
        <h1 id="titulo">${tr("Decisión")}<small>${tr("cargando…")}</small></h1>
      </header>
      <main class="cuerpo" id="decision"></main>
      <footer class="caja" id="pie-dec" hidden>
        <p class="estado-envio" id="estado-envio" role="status" aria-live="polite"></p>
        <div class="pie-dec">
          <button class="descartar" id="descartar-dec">${tr("Descartar")}</button>
          <button class="boton enviar-dec" id="enviar-dec" disabled>${tr("Enviar respuesta")}</button>
        </div>
      </footer>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir(e.volverPanel ? { vista: "terminal", panel: e.volverPanel, arranque: e.volverArranque } : { vista: e.volver === "lista" ? "lista" : "decisiones" }, true));
  let d;
  try {
    d = await api("GET", `/api/decision?id=${encodeURIComponent(e.id)}`);
  } catch (err) {
    document.getElementById("decision").innerHTML = `<p class="nota">${esc(err.message)}</p>`;
    return;
  }
  const contestada = Boolean(d.respuesta);
  // Descartada: se enseña como quedó, y ya no se contesta.
  const cerrada = contestada || d.vigencia === "descartada";
  const borrador = cerrada ? {} : leerBorrador(d.id);
  const elegida = (q) => contestada ? d.respuesta.elecciones[q.id]?.opcion : borrador[q.id]?.opcion;
  const escrita = (q) => contestada ? d.respuesta.elecciones[q.id]?.texto : borrador[q.id]?.texto;
  const de = [d.proyecto, d.panel ? tr("panel {n}", { n: d.panel }) : ""].filter(Boolean).join(" · ");
  document.getElementById("titulo").innerHTML = `${esc(d.titulo)}<small>${esc([de, hace(d.creada / 1000)].filter(Boolean).join(" · "))}</small>`;

  // Lo primero, si alguien la espera todavía.
  const vig = d.vigencia === "viva"
    ? `<p class="dec-vig" data-v="viva"><i></i><span><b>${tr("Te espera.")}</b> ${d.panel ? tr("El panel {n} sigue abierto: tu respuesta se teclea allí.", { n: d.panel }) : tr("El agente la leerá en cuanto la pida.")}</span></p>`
    : d.vigencia === "huerfana"
      ? `<p class="dec-vig" data-v="huerfana"><span><b>${tr("Ya no la espera nadie.")}</b> ${tr("La terminal que preguntó se cerró. Si la contestas se guarda, pero no se teclea en ningún sitio.")}</span></p>`
      : d.vigencia === "hablada"
        ? `<p class="dec-vig" data-v="huerfana"><span><b>${tr("La hablaste con el agente.")}</b> ${d.panel ? tr("Le escribiste al panel {n} después de que preguntara. Si no era eso, aún puedes contestarla aquí.", { n: d.panel }) : tr("Si no era eso, aún puedes contestarla aquí.")}</span></p>`
      : d.vigencia === "descartada"
        ? `<p class="dec-vig" data-v="descartada"><span><b>${tr("Descartada")}</b> ${tr("{cuando}, sin contestar.", { cuando: hace((d.descartada ?? d.creada) / 1000) })}</span></p>`
        : "";
  const hecha = contestada
    ? `<p class="dec-hecha">${tr("Contestada desde {desde}, {cuando}.", { desde: esc(delPc(d.respuesta.desde)), cuando: hace(d.respuesta.cuando / 1000) })} ${d.respuesta.entregada ? tr("Se tecleó en el panel {n}.", { n: d.panel }) : tr("El agente la lee cuando la pide.")}</p>`
    : "";
  document.getElementById("decision").innerHTML = `
    <div class="dec-cab">${vig}${hecha}${d.contexto ? `<p>${esc(d.contexto)}</p>` : ""}</div>
    ${d.preguntas.map((q) => `
      <fieldset class="pregunta-d" data-q="${esc(q.id)}"${cerrada ? " disabled" : ""}>
        <legend><span class="letra">${esc(q.id)}</span>${esc(q.titulo)}</legend>
        ${q.contexto ? `<p>${esc(q.contexto)}</p>` : ""}
        ${q.opciones.map((o, i) => `
          <label class="opcion">
            <input type="radio" name="q-${esc(q.id)}" value="${i + 1}"${elegida(q) === i + 1 ? " checked" : ""}>
            <span class="num">${i + 1}</span>
            <span class="txt"><b>${esc(o.texto)}</b>${o.recomendada ? `<em class="rec">${tr("Recomendada")}</em>` : ""}${o.detalle ? `<small>${esc(o.detalle)}</small>` : ""}</span>
          </label>`).join("")}
        ${cerrada && !escrita(q) ? "" : `
        <div class="o">${tr("o")}</div>
        <textarea class="libre" data-q="${esc(q.id)}" rows="2" placeholder="${tr("Otra cosa, con tus palabras")}" aria-label="${tr("Otra cosa para la pregunta {q}, con tus palabras", { q: esc(q.id) })}">${esc(escrita(q) || "")}</textarea>`}
      </fieldset>`).join("")}`;
  if (cerrada) return;

  const pie = document.getElementById("pie-dec");
  const boton = document.getElementById("enviar-dec");
  const estado = document.getElementById("estado-envio");
  pie.hidden = false;
  // Repintar la misma pantalla (al contestar o al descartar) no es llegar a otra.
  const repintar = async (dicho) => {
    app.dataset.sentido = "igual";
    await pintarDecision();
    const est = document.getElementById("estado-envio");
    const f = document.getElementById("pie-dec");
    if (!f || !est) return;
    f.hidden = false;
    f.querySelector(".pie-dec").hidden = true;
    est.textContent = dicho;
  };
  /* Descartar: deja de contar entre las que te esperan. A una terminal que
     seguía esperándola se le dice, para que el agente no se quede parado. */
  const descartarB = document.getElementById("descartar-dec");
  descartarB.addEventListener("click", async () => {
    if (cuenta) parar();
    descartarB.disabled = true;
    boton.disabled = true;
    try {
      const r = await descartarDecision(d.id);
      await repintar(r.avisada ? tr("Descartada. Se le ha dicho al panel {n} que no espere respuesta.", { n: r.panel }) : tr("Descartada."));
    } catch (err) {
      descartarB.disabled = false;
      estado.textContent = err.estado === 409 ? tr("Ya estaba contestada desde otro sitio.") : tr("No se ha descartado: {e}", { e: err.message });
      repasar();
    }
  });
  const leerForm = () => {
    const el = {};
    for (const q of d.preguntas) {
      const marcada = document.querySelector(`input[name="q-${CSS.escape(q.id)}"]:checked`);
      const texto = document.querySelector(`.libre[data-q="${CSS.escape(q.id)}"]`)?.value.trim();
      el[q.id] = { opcion: marcada ? Number(marcada.value) : undefined, texto: texto || undefined };
    }
    return el;
  };
  const completa = (el) => d.preguntas.every((q) => el[q.id].opcion || el[q.id].texto);
  const faltan = (el) => d.preguntas.filter((q) => !el[q.id].opcion && !el[q.id].texto).map((q) => q.id);
  const repasar = () => {
    const el = leerForm();
    guardarBorrador(d.id, el);
    boton.disabled = !completa(el);
    const f = faltan(el);
    if (!cuenta) {
      estado.textContent = !f.length ? ""
        : f.length === 1 ? tr("Falta la pregunta {q}.", { q: f[0] })
        : tr("Faltan las preguntas {lista} y {ultima}.", { lista: f.slice(0, -1).join(", "), ultima: f.at(-1) });
    }
  };
  document.getElementById("decision").addEventListener("input", repasar);
  document.getElementById("decision").addEventListener("change", repasar);

  /* Se manda a los cinco segundos, con «Deshacer» mientras tanto: un toque de
     más no le llega al agente (Material, «display an Undo action»). */
  let cuenta = null;
  const parar = () => { clearInterval(cuenta); cuenta = null; boton.textContent = tr("Enviar respuesta"); repasar(); };
  boton.addEventListener("click", () => {
    if (cuenta) { parar(); estado.textContent = tr("No se ha mandado."); return; }
    const el = leerForm();
    if (!completa(el)) return;
    let quedan = 5;
    boton.textContent = tr("Deshacer ({n})", { n: quedan });
    estado.textContent = tr("Se manda en {n} s.", { n: quedan });
    cuenta = setInterval(async () => {
      quedan -= 1;
      if (quedan > 0) { boton.textContent = tr("Deshacer ({n})", { n: quedan }); estado.textContent = tr("Se manda en {n} s.", { n: quedan }); return; }
      clearInterval(cuenta);
      cuenta = null;
      boton.disabled = true;
      boton.textContent = tr("Mandando…");
      try {
        const r = await api("POST", "/api/decision/responder", { id: d.id, elecciones: el });
        try { localStorage.removeItem(borradorDe(d.id)); } catch (_) {}
        await repintar(r.entregada ? tr("Enviada. Se ha tecleado en el panel {n}.", { n: r.panel }) : tr("Enviada. El agente la leerá cuando la pida."));
      } catch (err) {
        boton.textContent = tr("Enviar respuesta");
        boton.disabled = false;
        // Ya contestada (desde otro aparato): se enseña cómo quedó, y lo tuyo
        // sigue en el borrador por si lo quieres copiar.
        estado.textContent = err.estado === 409 ? tr("Ya estaba contestada desde otro sitio. Lo que escribiste sigue guardado aquí.") : tr("No se ha mandado: {e}", { e: err.message });
      }
    }, 1000);
  });
  repasar();
}

/* El modo de Claude Code, leído de su propia pantalla: la línea de abajo dice
   «auto mode on», «plan mode on» o «accept edits on» (y nada en el normal).
   Shift+Tab pasa al siguiente; desde el PC es una tecla, desde el móvil no
   había forma, y el modo auto se para ante lo que su clasificador no deja
   (publicar, tocar ajustes) hasta que alguien cambia de modo. */
function modoDe(v) {
  const filas = v.filas || [];
  for (let i = filas.length - 1; i >= 0 && i >= filas.length - 12; i--) {
    const m = /(auto mode|plan mode|accept edits|bypass permissions) on/i.exec(filas[i]);
    if (m) return { "auto mode": "auto", "plan mode": "plan", "accept edits": tr("aceptar ediciones"), "bypass permissions": tr("sin permisos") }[m[1].toLowerCase()];
  }
  // En el modo normal Claude Code no pinta nada: no se sabe, y no se inventa.
  return null;
}

/* Lo que está haciendo una terminal de agente AHORA, leído de su pantalla.
   Munir, 2026-10-09, desde el móvil: «¿qué pasa?», con el chat parado en lo
   último dicho mientras el agente trabajaba, porque el transcript solo se
   escribe al acabar cada paso. Claude Code lo pinta así:
     ● Listing 1 directory, calling adeorq 2 times, running 1 shell command…
       ⎿  $ curl -s -m 5 http://127.0.0.1:3013/
     · Gallivanting… (26s · ↓ 1.7k tokens)
   y Codex, «• Working (12s • esc to interrupt)». Lo que no se reconoce no se
   inventa: queda «Trabajando» y nada más. */
const GIRO = /^\s*[·✻✳✢✶✽*•◦]\s+\S[^(]*\((\d[^)·•]*)/;
function ahoraDe(v) {
  const filas = (v.filas || []).map((f) => f.replace(/\s+$/, ""));
  if (["pregunta", "ofrece"].includes(v.estado)) {
    const m = menuDe(filas);
    // Sin menú que pulsar sigue siendo tu turno: se dice, y contestas en la caja.
    return m ? { tipo: "pregunta", ...m } : { tipo: "espera", que: estadoTerminal(v)[0] };
  }
  // Ni trabaja ni te pregunta: acabó, o está quieta. Antes aquí no se pintaba
  // nada y el pie del chat se quedaba mudo justo cuando había terminado.
  if (v.estado === "lista") return { tipo: "termino" };
  if (v.estado !== "a_medias") return { tipo: "quieta" };
  const desde = Math.max(0, filas.length - 40);
  let giro = filas.length;
  for (let i = filas.length - 1; i >= desde; i--) if (GIRO.test(filas[i])) { giro = i; break; }
  const tiempo = giro < filas.length ? GIRO.exec(filas[giro])[1].trim() : "";
  let que = "";
  let det = "";
  for (let j = giro - 1; j >= desde; j--) {
    const m = /^\s*[●⏺]\s+(.+)$/.exec(filas[j]);
    if (!m) continue;
    // La línea sigue en las de debajo si el panel del PC era más estrecho.
    const partes = [m[1]];
    let k = j + 1;
    for (; k < giro && partes.length < 3 && /^ {2,}\S/.test(filas[k]) && !/^\s*⎿/.test(filas[k]); k++) partes.push(filas[k].trim());
    // Solo si es un paso en marcha («…» al final) o una herramienta, «Bash(…)»:
    // un párrafo suyo ya terminado está en el chat, y aquí parecería la tarea.
    const linea = partes.join(" ");
    if (/…$/.test(linea) || /^[\w.-]+(?: - [\w.-]+ \(MCP\))?\(/.test(linea)) {
      que = linea;
      const d = /^\s*⎿\s+(.+)$/.exec(filas[k] || "");
      det = d ? d[1] : "";
    }
    break;
  }
  return { tipo: "trabajando", que, det, tiempo };
}

/* Una pregunta con opciones numeradas al pie de la pantalla («Do you want to
   proceed? ❯ 1. Yes  2. No…»). Solo se busca cuando la terminal ya está en
   «te pregunta», que si no, cualquier lista numerada de un mensaje lo parecía. */
function menuDe(filas) {
  const abajo = filas.slice(-24).map((f) => f.replace(/^\s*[│┃|]\s?/, "").replace(/\s?[│┃|]\s*$/, ""));
  let opciones = [];
  let primera = -1;
  abajo.forEach((f, k) => {
    const m = /^\s*([❯›>]\s*)?(\d{1,2})[.)]\s+(.+?)\s*$/.exec(f);
    if (!m) return;
    const n = Number(m[2]);
    if (n === 1) { opciones = []; primera = k; }
    if (n === opciones.length + 1) opciones.push({ n, texto: m[3], sel: Boolean(m[1]) });
  });
  if (opciones.length < 2) return null;
  let pregunta = "";
  for (let k = primera - 1; k >= 0; k--) {
    const t = abajo[k].trim();
    if (t && !/^[─━═╭╮╰╯\s]+$/.test(t)) { pregunta = t; break; }
  }
  return { pregunta, opciones };
}

/* El pie del chat: la mascota y lo que pasa ahora. Siempre está, porque es
   quien dice en qué anda la terminal: teclea si trabaja, te llama si te
   pregunta, celebra si acabó y parpadea (o se estira) si no pasa nada. Es UNA
   mascota, la de clave «ahora»: al cambiar de estado no nace otra, cambia de
   ánimo, y por eso se le ve la entrada de cada uno. */
const ANIMO_AHORA = { trabajando: "trabaja", pregunta: "espera", espera: "espera", termino: "lista", quieta: "quieta", cerrada: "dormida" };
function ahoraHtml(a) {
  if (!a) return "";
  const m = mascota(ANIMO_AHORA[a.tipo] || "quieta", 26, "ahora");
  if (a.tipo === "pregunta") {
    return `<div class="ahora-cab">${m}${tr("Te pregunta")}</div>${a.pregunta ? `<div class="ahora-que">${esc(a.pregunta)}</div>` : ""}
      <div class="opciones-menu">${a.opciones.map((o) => `<button data-num="${o.n}"><span class="num">${o.n}</span><span>${esc(o.texto)}</span></button>`).join("")}</div>`;
  }
  if (a.tipo === "espera") return `<div class="ahora-cab">${m}<span><b>${tr("Es tu turno:")}</b> ${tr("{que}. Contéstale abajo.", { que: esc(a.que) })}</span></div>`;
  if (a.tipo === "termino") return `<div class="ahora-cab">${m}<span><b>${tr("Ha terminado.")}</b> ${tr("Si quieres que siga, díselo abajo.")}</span></div>`;
  if (a.tipo === "quieta") return `<div class="ahora-cab">${m}<span>${tr("Quieta, esperando a que le digas algo.")}</span></div>`;
  if (a.tipo === "cerrada") return `<div class="ahora-cab">${m}<span>${esc(a.que)}</span></div>`;
  return `<div class="ahora-cab">${m}${tr("Trabajando")}${a.tiempo ? ` · ${esc(a.tiempo)}` : ""}</div>${a.que ? `<div class="ahora-que">${esc(a.que)}</div>` : ""}${a.det ? `<div class="ahora-det">${esc(a.det)}</div>` : ""}`;
}

/* Una fila de la pantalla, legible en el móvil. Los ⏵ y ⏸ de Claude Code no
   están en la letra del móvil y salían como cajitas; y sus rayas de lado a
   lado, más anchas que el móvil, se partían en dos filas. */
const GLIFOS = { "⏵": "›", "⏸": "‖", "⏺": "●" };
function filaHtml(f) {
  const t = String(f).replace(/[⏵⏸⏺]/g, (c) => GLIFOS[c]);
  if (/^\s*[─━═]{3,}\s*$/.test(t)) return `<span class="l regla" aria-hidden="true"></span>`;
  const m = /^\s*[─━═]{3,}\s+(.+?)\s+[─━═]+\S?\s*$/.exec(t);
  if (m) return `<span class="l regla-titulo">${esc(m[1])}</span>`;
  return `<span class="l">${esc(t)}</span>`;
}

/* Munir, 2026-10-08: «no veo mucho historial de la terminal», y sin verlo no
   podía copiar el mensaje de compactación. La pantalla de un Claude Code a
   pantalla completa no tiene historial ninguno (lo que no cabe, no está en el
   búfer), así que en una terminal de agente se abre por defecto lo que se ha
   dicho, leído de su transcript, y la pantalla queda en la otra pestaña. */
function pintarTerminal() {
  // Las teclas (Intro, Esc, Ctrl+C, el modo, las flechas) van plegadas tras un
  // botón de la caja: se usan de vez en cuando y ocupaban una fila siempre. El
  // aparato recuerda si las dejaste fuera.
  let teclasFuera = false;
  try { teclasFuera = localStorage.getItem("adeorq-movil-teclas") === "1"; } catch (_) {}
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        ${botonCajon()}
        <h1 id="titulo">Terminal ${e.panel}<small id="sub">${tr("cargando…")}</small></h1>
        <nav class="pestanas" id="pestanas" hidden>
          <button class="pastilla" data-cara="conversa">Chat</button>
          <button class="pastilla" data-cara="pantalla">${tr("Pantalla")}</button>
        </nav>
      </header>
      <button class="aviso-dec" id="aviso-dec" hidden></button>
      <main class="cuerpo" id="conversa" hidden><div id="turnos"></div><div class="ahora" id="ahora" hidden></div></main>
      <main class="cuerpo" id="marco">
        <p class="nota-pantalla" id="nota-pantalla" hidden>${tr("Aquí solo cabe lo que se ve ahora en el PC. Todo lo hablado está en el {chat}.", { chat: "<button data-ir-chat>Chat</button>" })}</p>
        <pre class="pantalla" id="pantalla"></pre>
      </main>
      <footer class="caja" id="caja">
        <button class="bajar" id="bajar" hidden aria-label="${tr("Ir al final")}">${ICONO.bajar}</button>
        <p class="nota fallo" id="fallo" hidden></p>
        <div class="adjuntos" hidden></div>
        <div class="fila-caja">
          <textarea id="texto" rows="1" placeholder="${tr("Escríbele a esta terminal")}" aria-label="${tr("Texto para la terminal")}"></textarea>
          <div class="pastillas teclas" id="teclas"${teclasFuera ? "" : " hidden"}>
            <button class="pastilla" data-tecla="intro">${tr("Intro")}</button>
            <button class="pastilla" data-tecla="esc">Esc</button>
            <button class="pastilla" data-tecla="ctrl+c">Ctrl+C</button>
            <button class="pastilla" data-tecla="shift+tab" id="modo" title="${tr("Shift+Tab: pasa al siguiente modo de Claude Code")}">${tr("Cambiar modo")}</button>
            <button class="pastilla" data-tecla="arriba" aria-label="${tr("Flecha arriba")}">↑</button>
            <button class="pastilla" data-tecla="abajo" aria-label="${tr("Flecha abajo")}">↓</button>
          </div>
          <div class="mandos">
            ${CLIP}
            <button class="abrir-teclas" id="abrir-teclas" type="button" aria-controls="teclas" aria-expanded="${teclasFuera}" aria-label="${tr("Teclas: Intro, Esc, Ctrl+C y cambiar de modo")}">${ICONO.teclas}</button>
            <span class="hueco"></span>
            <button class="enviar" id="enviar" aria-label="${tr("Enviar")}" disabled>${ICONO.subir}</button>
          </div>
        </div>
      </footer>
    </div>`;
  montarBotonCajon();
  // Como los botones de tecla, este no coge el foco: si estabas escribiendo,
  // el teclado sigue fuera y nada se mueve de sitio a mitad del toque.
  const abrirTeclas = document.getElementById("abrir-teclas");
  abrirTeclas.addEventListener("mousedown", (ev) => ev.preventDefault());
  abrirTeclas.addEventListener("click", () => {
    const fila = document.getElementById("teclas");
    fila.hidden = !fila.hidden;
    abrirTeclas.setAttribute("aria-expanded", String(!fila.hidden));
    try { localStorage.setItem("adeorq-movil-teclas", fila.hidden ? "0" : "1"); } catch (_) {}
  });
  const texto = document.getElementById("texto");
  const enviarB = document.getElementById("enviar");
  const crecer = () => { texto.style.height = "auto"; texto.style.height = `${Math.min(texto.scrollHeight, 160)}px`; };
  // Se manda con texto, con adjuntos o con las dos cosas; mientras sube uno, no.
  const listo = () => { enviarB.disabled = (!texto.value.trim() && !adj.rutas().length) || adj.subiendo(); };
  const adj = montarAdjuntos(document.getElementById("caja"), () => listo());
  texto.addEventListener("input", () => { crecer(); listo(); });
  // Lo que no se pudo mandar se queda a la vista hasta que algo salga bien:
  // antes iba al subtítulo, que la vuelta siguiente del sondeo reescribía.
  const fallo = (m) => { const f = document.getElementById("fallo"); if (f) { f.textContent = m; f.hidden = false; } };
  const salioBien = () => { const f = document.getElementById("fallo"); if (f) f.hidden = true; };
  // Lo último pintado en cada cara. Solo se repinta lo que cambió: rehacerlo
  // cada 3 s le quitaba la selección a quien estaba copiando un trozo.
  const pintado = { pantalla: null, conversa: null };
  const ent = entradas();
  const pegadoAbajo = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  let ultima = null;
  // Al entrar, la mascota te saluda una vez (si no te está llamando ya).
  let saludada = false;
  const cara = () => (e.cara === "pantalla" || !ultima?.conversa ? "pantalla" : "conversa");
  const visible = () => document.getElementById(cara() === "pantalla" ? "marco" : "conversa");
  // «Ir al final», solo cuando has subido: lo que llega mientras lees el
  // historial se pinta debajo y sin esto no se sabría.
  const bajar = document.getElementById("bajar");
  const mirarBajar = () => { const el = visible(); if (el && bajar) bajar.hidden = pegadoAbajo(el); };
  ["marco", "conversa"].forEach((id) => document.getElementById(id).addEventListener("scroll", mirarBajar, { passive: true }));
  bajar.addEventListener("click", () => { const el = visible(); if (el) el.scrollTop = el.scrollHeight; mirarBajar(); });
  const cargar = () => {
    if (vueltas++ % 4 === 0) mirarDecisiones().catch(() => {});
    return leer().then(mirarBajar, (err) => {
      // Una terminal cerrada en el PC deja de contestar: se dice arriba en vez
      // de dejar la última pantalla como si siguiera viva. Y en el chat, la
      // mascota se duerme: ahí ya no hay nadie.
      const s = document.getElementById("sub");
      if (s) s.textContent = err.message;
      if (ultima?.conversa) pintarAhora({ tipo: "cerrada", que: err.message });
    });
  };
  const leer = async () => {
    const v = await api("GET", `/api/terminal?panel=${e.panel}&arranque=${e.arranque}`);
    const marco = document.getElementById("marco");
    const conversa = document.getElementById("conversa");
    if (!marco || !conversa) return;
    ultima = { ...v, conversa: Boolean(v.agente && v.sesion && v.carpeta) };
    const modo = modoDe(v);
    const bModo = document.getElementById("modo");
    if (bModo) bModo.textContent = modo ? tr("Modo: {m} ⇄", { m: modo }) : tr("Cambiar modo");
    const [palabra] = estadoTerminal(v);
    // El modo se dice también arriba: con las teclas plegadas, su botón no se ve.
    document.getElementById("titulo").innerHTML = `${esc(v.nombre)}<small id="sub">${esc(hoja(v.carpeta))} · ${palabra}${modo ? ` · ${tr("modo {m}", { m: esc(modo) })}` : ""}</small>`;
    const ahora = cara();
    document.getElementById("pestanas").hidden = !ultima.conversa;
    document.querySelectorAll(".pestanas .pastilla").forEach((b) => { b.dataset.on = String(b.dataset.cara === ahora); });
    marco.hidden = ahora !== "pantalla";
    conversa.hidden = ahora !== "conversa";

    if (ahora === "pantalla") {
      // En una de agente la pantalla no tiene historial (Claude Code pinta la
      // suya entera): se dice, con el camino al chat, que es donde está.
      document.getElementById("nota-pantalla").hidden = !ultima.conversa;
      const filas = v.filas?.length ? v.filas : [tr("(la pantalla está vacía)")];
      const texto = filas.join("\n");
      if (texto !== pintado.pantalla) {
        const abajo = pintado.pantalla === null || pegadoAbajo(marco);
        document.getElementById("pantalla").innerHTML = filas.map(filaHtml).join("");
        pintado.pantalla = texto;
        if (abajo) marco.scrollTop = marco.scrollHeight;
      }
      return;
    }
    // Lo de ahora antes que el transcript: se ve aunque este tarde o falle.
    const seguia = pegadoAbajo(conversa);
    const a = ahoraDe(v);
    pintarAhora(a);
    if (!saludada) {
      saludada = true;
      if (a?.tipo === "quieta" || a?.tipo === "trabajando") reaccionaMascota("ahora", "hola");
    }
    if (seguia) conversa.scrollTop = conversa.scrollHeight;
    const lista = document.getElementById("turnos");
    let r;
    try {
      // `si`: la firma de lo pintado. Si no cambió, el PC contesta solo «igual».
      r = await api("GET", `/api/sesion?cwd=${encodeURIComponent(v.carpeta)}&id=${encodeURIComponent(v.sesion)}&si=${encodeURIComponent(pintado.conversa ?? "")}`);
    } catch (err) {
      // Codex, Gemini y compañía no escriben en `~/.claude`: ahí solo queda la pantalla.
      if (pintado.conversa !== err.message) lista.innerHTML = `<p class="vacio">${tr("No encuentro lo que ha dicho esta sesión ({e}). Lo que se ve está en «Pantalla».", { e: esc(err.message) })}</p>`;
      pintado.conversa = err.message;
      return;
    }
    if (r.igual || !document.getElementById("turnos")) return;
    const abajo = pintado.conversa === null || pegadoAbajo(conversa);
    // Repintar cerraba los pasos que tenías abiertos: se recuerdan por su hora.
    const abiertos = new Set([...lista.querySelectorAll("details.pasos[open]")].map((d) => d.dataset.k));
    lista.innerHTML = r.turnos.length ? turnosHtml(r.turnos, ent) : `<p class="vacio">${tr("Esta sesión todavía no ha dicho nada.")}</p>`;
    lista.querySelectorAll("details.pasos").forEach((d) => { if (abiertos.has(d.dataset.k)) d.open = true; });
    pintado.conversa = r.firma;
    if (abajo) conversa.scrollTop = conversa.scrollHeight;
  };
  // Se compara lo que DICE y no el HTML, que lleva dentro a la mascota y esa
  // cambia de postura sola: comparando el HTML se rehacía en cada vuelta y los
  // botones de una pregunta nacían de nuevo bajo el dedo.
  let ahoraPintado = null;
  const pintarAhora = (a) => {
    const el = document.getElementById("ahora");
    const dice = JSON.stringify(a);
    if (!el || dice === ahoraPintado) return;
    ahoraPintado = dice;
    const cambiaDeTipo = el.dataset.tipo !== (a?.tipo || "");
    el.hidden = !a;
    el.dataset.tipo = a?.tipo || "";
    el.innerHTML = ahoraHtml(a);
    // Si te pregunta, la pregunta sube a la caja de escribir, encima del texto:
    // es donde está tu dedo, y contestar es un toque. Si no, vuelve al pie del
    // chat. Es el MISMO elemento: lo que tiene enganchado se va con él.
    const fila = document.querySelector("#caja .fila-caja");
    if (a?.tipo === "pregunta" && fila && el.parentElement !== fila) fila.prepend(el);
    else if (a?.tipo !== "pregunta" && el.parentElement !== document.getElementById("conversa")) document.getElementById("conversa")?.append(el);
    // Solo al cambiar de estado llega desde abajo: que «26s» pase a «27s» no es llegar.
    if (cambiaDeTipo && a) { el.classList.remove("cambia"); void el.offsetWidth; el.classList.add("cambia"); }
  };
  // Las opciones de una pregunta mandan su número, que `mandar_texto` (pty.rs)
  // teclea como tecla suelta, sin Intro, porque así lo esperan esos menús.
  const ahoraEl = document.getElementById("ahora");
  ahoraEl.addEventListener("mousedown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
  ahoraEl.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-num]");
    if (!b) return;
    const botones = [...ahoraEl.querySelectorAll("button[data-num]")];
    botones.forEach((x) => { x.disabled = true; });
    try {
      await api("POST", "/api/terminal/escribir", { panel: e.panel, arranque: e.arranque, texto: b.dataset.num });
      salioBien();
      reaccionaMascota("ahora", "enviado");
      enSeguida();
    } catch (err) {
      fallo(tr("No se ha mandado: {e}", { e: err.message }));
      botones.forEach((x) => { x.disabled = false; });
    }
  });
  document.querySelector("[data-ir-chat]").addEventListener("click", () => {
    e.cara = "conversa";
    pintado.conversa = null;
    cargar();
  });
  // Las decisiones pendientes, cada cuatro vueltas (12 s): no cambian a menudo.
  let vueltas = 0;
  const mirarDecisiones = async () => {
    const v = await api("GET", "/api/decisiones");
    const b = document.getElementById("aviso-dec");
    if (!b) return;
    // Solo las que siguen vivas: una decisión cuya terminal se cerró no es
    // motivo para ponerte un aviso encima del chat de otra.
    const pend = vivas(v.decisiones);
    b.hidden = !pend.length;
    if (!pend.length) return;
    // La de ESTA terminal va primero: es la que tiene a este agente parado.
    pend.sort((x, y) => Number(y.panel === e.panel) - Number(x.panel === e.panel));
    const suya = pend[0].panel === e.panel;
    b.innerHTML = `${ICONO.decision}<span><b>${pend.length === 1 ? (suya ? tr("Esta terminal espera tu decisión") : tr("Una decisión te espera")) : tr("{n} decisiones te esperan", { n: pend.length })}</b> · ${esc(pend[0].titulo)}</span><em>${tr("Contestar")}</em>`;
    b.onclick = () => ir(pend.length === 1 ? { vista: "decision", id: pend[0].id, volverPanel: e.panel, volverArranque: e.arranque } : { vista: "decisiones", volverPanel: e.panel, volverArranque: e.arranque });
  };
  document.querySelectorAll(".pestanas .pastilla").forEach((b) => b.addEventListener("click", () => {
    e.cara = b.dataset.cara;
    // Al volver a una cara, se repinta y se baja al final, como al entrar.
    pintado[e.cara] = null;
    cargar();
  }));
  // Tras escribir, la pantalla tarda un instante en reflejarlo: se vuelve a
  // pedir en seguida en vez de esperar a la vuelta siguiente del sondeo.
  const enSeguida = () => setTimeout(cargar, 700);
  enviarB.addEventListener("click", async () => {
    const txt = conRutas(texto.value.trim(), adj.rutas());
    if (!txt || adj.subiendo()) return;
    enviarB.disabled = true;
    try {
      await api("POST", "/api/terminal/escribir", { panel: e.panel, arranque: e.arranque, texto: txt });
      texto.value = "";
      adj.vaciar();
      crecer();
      salioBien();
      reaccionaMascota("ahora", "enviado");
      enSeguida();
    } catch (err) {
      fallo(tr("No se ha mandado: {e}", { e: err.message }));
      listo();
    }
  });
  // Pulsar una tecla no le quita el foco a la caja ni se lo da al botón: así no
  // cambia nada de sitio a mitad del toque, y si estabas escribiendo, el
  // teclado sigue fuera.
  document.querySelectorAll(".pastilla[data-tecla]").forEach((b) => b.addEventListener("mousedown", (ev) => ev.preventDefault()));
  document.querySelectorAll(".pastilla[data-tecla]").forEach((b) => b.addEventListener("click", async () => {
    try {
      await api("POST", "/api/terminal/tecla", { panel: e.panel, arranque: e.arranque, tecla: b.dataset.tecla });
      salioBien();
      enSeguida();
    } catch (err) {
      fallo(tr("No se ha mandado: {e}", { e: err.message }));
    }
  }));
  cargar();
  sondear(3000, cargar);
}

/* «Compactar con esto»: el bloque, con la orden delante, en la caja de la
   terminal. `mandar_texto` (pty.rs) teclea la orden y pega el resto, así que
   le llega a Claude Code como orden y no como un mensaje. */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest?.(".compactar");
  const caja = document.getElementById("texto");
  if (!b || !caja || e.vista !== "terminal") return;
  caja.value = `/compact ${textoDelBloque(b).trim()}`;
  caja.dispatchEvent(new Event("input"));
  caja.scrollTop = 0;
  b.textContent = tr("En la caja: dale a enviar");
  b.dataset.hecho = "true";
  setTimeout(() => { b.textContent = tr("Compactar con esto"); b.dataset.hecho = "false"; }, 2400);
});

// ─── Una sesión, para leerla ────────────────────────────────────────────────

/** Las herramientas de un turno, contadas: uno de una sesión de verdad usa
    cientos, y en fila salía un párrafo de «Read · Read · Bash · Read…». */
function resumenHerramientas(lista) {
  const n = new Map();
  for (const h of lista) {
    const k = h.startsWith("mcp__") ? h.split("__")[1] : h;
    n.set(k, (n.get(k) || 0) + 1);
  }
  return [...n].map(([k, v]) => (v > 1 ? `${k} ×${v}` : k)).join(" · ");
}

/** Los turnos de un transcript (`session_messages`), como burbujas. Con `ent`,
    los que llegan desde el último pintado entran desde abajo; un turno se
    reconoce por su hora (o por cómo empieza, si no la trae), no por su sitio
    en la lista, que son «los últimos 80» y se corre con cada turno nuevo. */
const turnosHtml = (turnos, ent) => {
  const html = turnos.map((t) => {
    // «[Image #1]» es como Claude Code apunta una imagen pegada: aquí, una etiqueta.
    const texto = md(t.texto).replace(/\[Image #(\d+)\]/g, (_, n) => `<span class="chip-img">${tr("imagen {n}", { n })}</span>`);
    const llega = ent ? ent.de(`${t.rol}|${t.hora || t.texto.slice(0, 48)}`) : "";
    return `<div class="turno${llega}" data-rol="${t.rol === "tu" ? "tu" : "agente"}"><div class="burbuja">${texto}${pasosHtml(t)}</div></div>`;
  }).join("");
  ent?.pintado();
  return html;
};

/** Los pasos de un turno, plegados: cuántos, de qué, y al abrir qué hizo cada
    uno (`pasos`, de sessions.rs; los últimos 30 del turno). */
function pasosHtml(t) {
  const n = t.herramientas?.length || 0;
  if (!n) return "";
  const resumen = esc(resumenHerramientas(t.herramientas));
  if (!t.pasos?.length) return `<span class="herramientas">${resumen}</span>`;
  const antes = n - t.pasos.length;
  const filas = t.pasos.map((p) => `<li><b>${esc(p.nombre)}</b>${p.detalle ? `<span>${esc(p.detalle)}</span>` : ""}</li>`).join("");
  return `<details class="pasos" data-k="${esc(t.hora)}"><summary><b>${n === 1 ? tr("1 paso") : tr("{n} pasos", { n })}</b><span>${resumen}</span></summary>
    <ol>${antes > 0 ? `<li class="antes">${tr("y {n} antes", { n: antes })}</li>` : ""}${filas}</ol></details>`;
}

function abrirSesion(cl) {
  const w = (e.conv?.trabajos || []).find((x) => claveDe(x) === cl);
  if (!w) return;
  const sid = (e.vivo?.sesiones || {})[cl] || w.sesion;
  ir({ vista: "sesion", w, sid, volver: { id: e.id } });
}

function pintarSesion() {
  const w = e.w;
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="${tr("Volver al conserje")}">${ICONO.atras}</button>
        <h1>${esc(hoja(w.carpeta))}<small>${esc(nombreDe(w))} · ${esc(w.encargo)}</small></h1>
      </header>
      <main class="cuerpo" id="sesion"></main>
      <p class="solo-lectura">${tr("Solo para leer. Si quieres decirle algo, díselo al conserje.")}</p>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir({ vista: "hilo", id: e.volver.id }, true));
  const cuerpo = document.getElementById("sesion");
  if (!e.sid) {
    cuerpo.innerHTML = `<p class="vacio">${tr("Esta sesión todavía no ha escrito nada. En cuanto empiece, aparece aquí.")}</p>`;
    return;
  }
  const cargar = async () => {
    const turnos = await api("GET", `/api/sesion?cwd=${encodeURIComponent(w.carpeta)}&id=${encodeURIComponent(e.sid)}`);
    const aqui = document.getElementById("sesion");
    if (!aqui) return;
    const abajo = aqui.scrollHeight - aqui.scrollTop - aqui.clientHeight < 60;
    aqui.innerHTML = turnos.length ? turnosHtml(turnos) : `<p class="vacio">${tr("Todavía no hay nada que leer.")}</p>`;
    if (abajo) aqui.scrollTop = aqui.scrollHeight;
  };
  cargar().catch((err) => { cuerpo.innerHTML = `<p class="nota">${esc(err.message)}</p>`; });
  sondear(5000, cargar);
}

pintar();
</script>
