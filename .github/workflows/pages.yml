# GitHub Pages, que ahora solo REDIRIGE a adeorq.com.
#
# Hasta el 2026-08-21 esto construía y publicaba la web entera en
# `mun1to.github.io/Adeorq-releases`. Ya no: la web vive en Cloudflare Pages,
# servida en el dominio propio, y la despliega `.github/workflows/web.yml`.
#
# Por qué redirigir en vez de apagar Pages: la dirección de GitHub lleva meses
# publicada y puede estar enlazada en cualquier sitio. Apagarla deja 404 donde
# antes había una web; redirigir la mantiene útil y de paso le dice al buscador
# cuál es la buena, con el `canonical`.
#
# El día que nadie llegue por ahí, esto se borra entero y se desactiva Pages en
# los ajustes del repositorio público.

name: Pages (redirección)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages solo existe en el repositorio público. Este archivo viaja en los dos.
    if: github.repository == 'Mun1to/Adeorq-releases'
    runs-on: ubuntu-latest
    steps:
      - name: Escribir la redirección
        run: |
          mkdir -p sitio
          cat > sitio/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <title>Adeorq</title>
          <link rel="canonical" href="https://adeorq.com/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://adeorq.com/">
          <style>
            :root { color-scheme: dark }
            body { margin:0; min-height:100vh; display:grid; place-items:center;
                   background:#05080e; color:#b7c7e0;
                   font:16px/1.6 "Segoe UI", system-ui, sans-serif; text-align:center }
            a { color:#4d9fff }
          </style>
          </head>
          <body>
            <p>La web de Adeorq está ahora en <a href="https://adeorq.com/">adeorq.com</a>.</p>
            <script>location.replace('https://adeorq.com/' + location.hash);</script>
          </body>
          </html>
          HTML
          # La misma página para cualquier ruta antigua: sin esto, un enlace a
          # /Adeorq-releases/guia.html se queda en un 404 de GitHub.
          cp sitio/index.html sitio/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
