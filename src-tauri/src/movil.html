      const pc = leerGuardado(GUARDADO_PC);
      // Al quitarlo se empieza desde como lo tienes en el PC, no de cero.
      guardarAjustes(t.checked ? { cristal: "pc" } : { cristal: "propio", ve: entre(pc.opacidad, 60, 5, 100), desenfoque: entre(pc.desenfoque, 0, 0, 24) });
      return pintarlo();
    }
    if (t.dataset.ajuste === "caja") {
      guardarAjustes({ caja: t.checked });
      return;
    }
    if (t.dataset.seccion) {
      const a = misAjustes();
      const s = t.dataset.seccion;
      guardarAjustes({ ocultas: t.checked ? a.ocultas.filter((x) => x !== s) : [...new Set([...a.ocultas, s])] });
      return pintarlo();
    }
    if (t.dataset.aviso && yo?.avisos) {
      const nuevos = { ...yo.avisos };
      if (t.dataset.aviso === "sonido") nuevos.silencio = !t.checked;
      else nuevos[t.dataset.aviso] = t.checked;
      t.disabled = true;
      try {
        yo.avisos = (await api("POST", "/api/avisos", nuevos)).avisos;
        fallo = "";
      } catch (err) {
        fallo = err.message;
      }
      return pintarlo();
    }
  });

  clearTimeout(reloj);
  pintarlo();
  traerDelPc().then(pintarlo).catch(() => {});
  api("GET", "/api/yo").then((v) => { yo = v; pintarlo(); }).catch((err) => { fallo = err.message; pintarlo(); });
}

// ─── Decisiones ─────────────────────────────────────────────────────────────
// Lo que un agente le pregunta a Munir con `ask_decision` (decisiones.rs). Se
// contesta aquí, desde cualquier aparato emparejado, y la respuesta vuelve a la
// terminal que preguntó.

/* Cómo se dice cada vigencia (`Vigencia`, en decisiones.rs) y con qué tono se
   pinta. «Viva» es que la terminal que preguntó sigue abierta y espera;
   «huérfana», que está sin contestar pero ya no hay nadie detrás; «hablada»,
   que le escribiste a su terminal en vez de contestarla aquí. */
const VIGENCIA = {
  viva: [tr("te espera"), "pregunta"],
  huerfana: [tr("sin nadie detrás"), "cerrada"],
  hablada: [tr("hablada"), "cerrada"],
  contestada: [tr("contestada"), "cerrada"],
  descartada: [tr("descartada"), "cerrada"],
};
const vivas = (lista) => (lista || []).filter((d) => d.vigencia === "viva");
/** `una` y `varias` llegan ya traducidas; `varias` lleva su `{n}`. */
const plural = (n, una, varias) => (n === 1 ? una : varias.replace("{n}", n));

/** De quién es y si sigue ahí, en una línea. */
function quienEspera(d) {
  if (d.vigencia === "viva") return d.panel ? tr("panel {n}, abierto", { n: d.panel }) : "";
  if (d.vigencia === "huerfana") return d.panel ? tr("su terminal se cerró") : tr("de otro arranque de Adeorq");
  if (d.vigencia === "hablada") return d.panel ? tr("le escribiste al panel {n}", { n: d.panel }) : "";
  return d.panel ? tr("panel {n}", { n: d.panel }) : "";
}

function tarjetaDecision(d) {
  const [palabra, tono] = VIGENCIA[d.vigencia] || VIGENCIA.huerfana;
  const n = plural(d.preguntas, tr("1 pregunta"), tr("{n} preguntas"));
  const cerrada = d.vigencia !== "viva" && d.vigencia !== "huerfana";
  const cuando = hace((cerrada ? d.cerrada ?? d.creada : d.creada) / 1000);
  return `<button class="tarjeta" data-estado="${tono}" data-vigencia="${d.vigencia}" data-id="${esc(d.id)}">
    <span class="tarjeta-cab"><b>${esc(d.titulo)}</b><span class="estado"><i></i>${palabra}</span></span>
    <span class="porque">${esc([d.proyecto, quienEspera(d), cerrada ? "" : n, cuando].filter(Boolean).join(" · "))}</span>
  </button>`;
}

/* Lo que pregunta una terminal, con sus opciones a un toque. Si su pantalla no
   trae un menú (te espera con texto libre), se dice y se va a la terminal. */
function tarjetaPregunta({ t, a }) {
  const menu = a?.tipo === "pregunta";
  return `<div class="preg-term" data-panel="${t.panel}">
    <span class="tarjeta-cab"><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><span class="estado"><i></i>${tr("Te pregunta")}</span></span>
    ${menu ? menuHtml(a, "preg-que") : `<p class="preg-que porque">${tr("Te espera: contéstale en su terminal.")}</p>`}
    <button class="mini ir-term" type="button">${tr("Abrir la terminal")}</button>
  </div>`;
}

async function descartarDecision(id) {
  const r = await api("POST", "/api/decision/descartar", { id });
  try { localStorage.removeItem(borradorDe(id)); } catch (_) {}
  return r;
}

async function pintarDecisiones() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        ${e.volverPanel ? `<button class="atras" id="atras" aria-label="${tr("Volver")}">${ICONO.atras}</button>` : botonCajon()}
        <h1>${tr("Decisiones")}<small id="sub-dec">${tr("lo que te preguntan tus agentes")}</small></h1>
      </header>
      <main class="cuerpo" id="decisiones"></main>
    </div>`;
  // Si llegaste desde una terminal, la flecha te devuelve a ella; si no, el menú.
  document.getElementById("atras")?.addEventListener("click", () => ir({ vista: "terminal", panel: e.volverPanel, arranque: e.volverArranque }, true));
  montarBotonCajon();
  // Solo se repinta si algo cambió: rehacerla cada cinco segundos reiniciaba
  // el latido de las vivas y te quitaba el toque a medio pulsar.
  let pintado = null;
  let arranque = null;
  const cargar = async () => {
    const [v, vt] = await Promise.all([api("GET", "/api/decisiones"), api("GET", "/api/terminales").catch(() => ({}))]);
    arranque = vt.arranque ?? null;
    // Lo que te pregunta cada terminal, leído de su pantalla como en su chat.
    const preguntas = await Promise.all(preguntanDe(vt).map((t) => api("GET", `/api/terminal?panel=${t.panel}&arranque=${vt.arranque}`).then((x) => {
      if (!x.filas && Array.isArray(x.trozos)) x.filas = x.trozos.map((l) => l.map((y) => y[0]).join(""));
      return { t, a: ahoraDe(x) };
    }, () => ({ t, a: null }))));
    const aqui = document.getElementById("decisiones");
    if (!aqui) return;
    const lista = v.decisiones || [];
    const esperan = vivas(lista);
    ponerEsperan(esperan.length + preguntas.length);
    // Todo lo que ya no te espera va junto y se limpia solo (a la semana se
    // borra): antes las que nadie esperaba tenían montón y botón propios, y
    // había que vaciarlo a mano.
    const anteriores = lista.filter((d) => d.vigencia !== "viva")
      .sort((a, b) => (b.cerrada ?? b.creada) - (a.cerrada ?? a.creada));
    const total = esperan.length + preguntas.length;
    const sub = document.getElementById("sub-dec");
    if (sub) {
      sub.textContent = !lista.length && !preguntas.length ? tr("lo que te preguntan tus agentes")
        : total ? plural(total, tr("1 te espera"), tr("{n} te esperan")) : tr("ninguna te espera");
    }
    let html = "";
    if (!lista.length && !preguntas.length) {
      html = `<p class="vacio">${tr("No hay ninguna decisión. Cuando un agente te pregunte algo, sale aquí.")}</p>`;
    } else {
      html += total
        ? `<h2 class="seccion"><span>${tr("Te esperan")}</span></h2>${preguntas.map(tarjetaPregunta).join("")}${esperan.map(tarjetaDecision).join("")}`
        : `<p class="calma">${mascota("quieta", 26, "decisiones")}${tr("Nada te espera ahora mismo.")}</p>`;
      if (anteriores.length) {
        html += `<h2 class="seccion"><span>${tr("Anteriores")}</span></h2>
          <p class="seccion-nota">${tr("Ya no te esperan. A la semana se borran solas.")}</p>${anteriores.map(tarjetaDecision).join("")}`;
      }
    }
    // Por lo que dice la lista y no por el HTML, que lleva dentro a la mascota
    // y esa cambia de postura sola.
    const firma = JSON.stringify([lista, preguntas.map((p) => [p.t.panel, p.t.nombre, p.t.carpeta, p.a])]);
    if (firma === pintado) return;
    pintado = firma;
    conservarEscrito(aqui, () => { aqui.innerHTML = html; });
    aqui.querySelectorAll(".tarjeta[data-id]").forEach((b) => b.addEventListener("click", () => ir({ vista: "decision", id: b.dataset.id, volverPanel: e.volverPanel, volverArranque: e.volverArranque })));
  };
  // Contestar a una terminal desde aquí, como en su chat (`contestarMenu`). O
  // ir a verla, que a veces hace falta el contexto.
  document.getElementById("decisiones").addEventListener("click", async (ev) => {
    const tarjeta = ev.target.closest(".preg-term");
    if (!tarjeta) return;
    const panel = Number(tarjeta.dataset.panel);
    if (ev.target.closest(".ir-term")) return ir({ vista: "terminal", panel, arranque });
    if (!ev.target.closest("button")) return;
    const num = ev.target.closest("button[data-num]:not([data-escribir])")?.dataset.num;
    const botones = [...tarjeta.querySelectorAll("button:not(.ir-term)")];
    botones.forEach((x) => { x.disabled = true; });
    try {
      const hecho = await contestarMenu(tarjeta, panel, arranque, ev);
      if (hecho === "enviado") tarjeta.querySelector(".opciones-menu")?.insertAdjacentHTML("beforebegin", `<p class="nota">${num ? tr("Contestado: {n}.", { n: esc(num) }) : tr("Mandado.")}</p>`);
      // Una casilla marcada no cierra la pregunta: se repinta y se sigue.
      if (hecho !== "enviado") botones.forEach((x) => { x.disabled = false; });
      if (hecho) setTimeout(() => { pintado = null; cargar().catch(() => {}); }, 900);
    } catch (err) {
      botones.forEach((x) => { x.disabled = false; });
      tarjeta.insertAdjacentHTML("beforeend", `<p class="nota fallo">${esc(err.message)}</p>`);
    }
  });
  try { await cargar(); } catch (err) {
    const aqui = document.getElementById("decisiones");
    if (aqui) aqui.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  sondear(5000, cargar);
}

/* Lo marcado y lo escrito se guarda solo mientras no se manda: cerrar la
   página a medias no lo pierde. */
const borradorDe = (id) => `adeorq-decision-${id}`;
function leerBorrador(id) {
  try { return JSON.parse(localStorage.getItem(borradorDe(id)) || "{}"); } catch (_) { return {}; }
}
function guardarBorrador(id, b) {
  try { localStorage.setItem(borradorDe(id), JSON.stringify(b)); } catch (_) {}
}

/* El agente a veces escribe la letra en el título («A · El botón…») y la
   pantalla ya la pinta delante: salía «A A · El botón…» (Munir, 2026-10-16). */
function sinSuLetra(id, titulo) {
  const letra = String(id).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return String(titulo).replace(new RegExp(`^\\s*${letra}\\s*[·.):\\-–]\\s*`), "") || titulo;
}
/* El contexto de una decisión, con sus enlaces que se pueden tocar (abren
   aparte): sin esto, el de las maquetas había que copiarlo a mano. */
function conEnlaces(texto) {
  return esc(texto).replace(/https?:\/\/[^\s<"]+[^\s<".,;:!?\u00bb)]/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}

async function pintarDecision() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="${tr("Volver a las decisiones")}">${ICONO.atras}</button>
        <h1 id="titulo">${tr("Decisión")}<small>${tr("cargando…")}</small></h1>
      </header>
      <main class="cuerpo" id="decision"></main>
      <footer class="caja" id="pie-dec" hidden>
        <p class="estado-envio" id="estado-envio" role="status" aria-live="polite"></p>
        <div class="pie-dec">
          <button class="descartar" id="descartar-dec">${tr("Descartar")}</button>
          <button class="boton enviar-dec" id="enviar-dec" disabled>${tr("Enviar respuesta")}</button>
        </div>
      </footer>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir(e.volverPanel ? { vista: "terminal", panel: e.volverPanel, arranque: e.volverArranque } : { vista: e.volver === "lista" ? "lista" : "decisiones" }, true));
  let d;
  try {
    d = await api("GET", `/api/decision?id=${encodeURIComponent(e.id)}`);
  } catch (err) {
    document.getElementById("decision").innerHTML = `<p class="nota">${esc(err.message)}</p>`;
    return;
  }
  const contestada = Boolean(d.respuesta);
  // Descartada: se enseña como quedó, y ya no se contesta.
  const cerrada = contestada || d.vigencia === "descartada";
  const borrador = cerrada ? {} : leerBorrador(d.id);
  const elegida = (q) => contestada ? d.respuesta.elecciones[q.id]?.opcion : borrador[q.id]?.opcion;
  const escrita = (q) => contestada ? d.respuesta.elecciones[q.id]?.texto : borrador[q.id]?.texto;
  const de = [d.proyecto, d.panel ? tr("panel {n}", { n: d.panel }) : ""].filter(Boolean).join(" · ");
  document.getElementById("titulo").innerHTML = `${esc(d.titulo)}<small>${esc([de, hace(d.creada / 1000)].filter(Boolean).join(" · "))}</small>`;

  // Lo primero, si alguien la espera todavía.
  const vig = d.vigencia === "viva"
    ? `<p class="dec-vig" data-v="viva"><i></i><span><b>${tr("Te espera.")}</b> ${d.panel ? tr("El panel {n} sigue abierto: tu respuesta se teclea allí.", { n: d.panel }) : tr("El agente la leerá en cuanto la pida.")}</span></p>`
    : d.vigencia === "huerfana"
      ? `<p class="dec-vig" data-v="huerfana"><span><b>${tr("Ya no la espera nadie.")}</b> ${tr("La terminal que preguntó se cerró. Si la contestas se guarda, pero no se teclea en ningún sitio.")}</span></p>`
      : d.vigencia === "hablada"
        ? `<p class="dec-vig" data-v="huerfana"><span><b>${tr("La hablaste con el agente.")}</b> ${d.panel ? tr("Le escribiste al panel {n} después de que preguntara. Si no era eso, aún puedes contestarla aquí.", { n: d.panel }) : tr("Si no era eso, aún puedes contestarla aquí.")}</span></p>`
      : d.vigencia === "descartada"
        ? `<p class="dec-vig" data-v="descartada"><span><b>${tr("Descartada")}</b> ${tr("{cuando}, sin contestar.", { cuando: hace((d.descartada ?? d.creada) / 1000) })}</span></p>`
        : "";
  const hecha = contestada
    ? `<p class="dec-hecha">${tr("Contestada desde {desde}, {cuando}.", { desde: esc(delPc(d.respuesta.desde)), cuando: hace(d.respuesta.cuando / 1000) })} ${d.respuesta.entregada ? tr("Se tecleó en el panel {n}.", { n: d.panel }) : tr("El agente la lee cuando la pide.")}</p>`
    : "";
  document.getElementById("decision").innerHTML = `
    <div class="dec-cab">${vig}${hecha}${d.contexto ? `<p>${conEnlaces(d.contexto)}</p>` : ""}</div>
    ${d.preguntas.map((q) => `
      <fieldset class="pregunta-d" data-q="${esc(q.id)}"${cerrada ? " disabled" : ""}>
        <legend><span class="letra">${esc(q.id)}</span>${esc(sinSuLetra(q.id, q.titulo))}</legend>
        ${q.contexto ? `<p>${conEnlaces(q.contexto)}</p>` : ""}
        ${q.opciones.map((o, i) => `
          <label class="opcion">
            <input type="radio" name="q-${esc(q.id)}" value="${i + 1}"${elegida(q) === i + 1 ? " checked" : ""}>
            <span class="num">${i + 1}</span>
            <span class="txt"><b>${esc(o.texto)}</b>${o.recomendada ? `<em class="rec">${tr("Recomendada")}</em>` : ""}${o.detalle ? `<small>${esc(o.detalle)}</small>` : ""}</span>
          </label>`).join("")}
        ${cerrada && !escrita(q) ? "" : `
        <div class="o">${tr("o")}</div>
        <textarea class="libre" data-q="${esc(q.id)}" rows="2" placeholder="${tr("Otra cosa, con tus palabras")}" aria-label="${tr("Otra cosa para la pregunta {q}, con tus palabras", { q: esc(q.id) })}">${esc(escrita(q) || "")}</textarea>`}
      </fieldset>`).join("")}`;
  if (cerrada) return;

  const pie = document.getElementById("pie-dec");
  const boton = document.getElementById("enviar-dec");
  const estado = document.getElementById("estado-envio");
  pie.hidden = false;
  // Repintar la misma pantalla (al contestar o al descartar) no es llegar a otra.
  const repintar = async (dicho) => {
    app.dataset.sentido = "igual";
    await pintarDecision();
    const est = document.getElementById("estado-envio");
    const f = document.getElementById("pie-dec");
    if (!f || !est) return;
    f.hidden = false;
    f.querySelector(".pie-dec").hidden = true;
    est.textContent = dicho;
  };
  /* Descartar: deja de contar entre las que te esperan. A una terminal que
     seguía esperándola se le dice, para que el agente no se quede parado. */
  const descartarB = document.getElementById("descartar-dec");
  descartarB.addEventListener("click", async () => {
    if (cuenta) parar();
    descartarB.disabled = true;
    boton.disabled = true;
    try {
      const r = await descartarDecision(d.id);
      await repintar(r.avisada ? tr("Descartada. Se le ha dicho al panel {n} que no espere respuesta.", { n: r.panel }) : tr("Descartada."));
    } catch (err) {
      descartarB.disabled = false;
      estado.textContent = err.estado === 409 ? tr("Ya estaba contestada desde otro sitio.") : tr("No se ha descartado: {e}", { e: err.message });
      repasar();
    }
  });
  const leerForm = () => {
    const el = {};
    for (const q of d.preguntas) {
      const marcada = document.querySelector(`input[name="q-${CSS.escape(q.id)}"]:checked`);
      const texto = document.querySelector(`.libre[data-q="${CSS.escape(q.id)}"]`)?.value.trim();
      el[q.id] = { opcion: marcada ? Number(marcada.value) : undefined, texto: texto || undefined };
    }
    return el;
  };
  const completa = (el) => d.preguntas.every((q) => el[q.id].opcion || el[q.id].texto);
  const faltan = (el) => d.preguntas.filter((q) => !el[q.id].opcion && !el[q.id].texto).map((q) => q.id);
  const repasar = () => {
    const el = leerForm();
    guardarBorrador(d.id, el);
    boton.disabled = !completa(el);
    const f = faltan(el);
    if (!cuenta) {
      estado.textContent = !f.length ? ""
        : f.length === 1 ? tr("Falta la pregunta {q}.", { q: f[0] })
        : tr("Faltan las preguntas {lista} y {ultima}.", { lista: f.slice(0, -1).join(", "), ultima: f.at(-1) });
    }
  };
  document.getElementById("decision").addEventListener("input", repasar);
  document.getElementById("decision").addEventListener("change", repasar);

  /* Se manda a los cinco segundos, con «Deshacer» mientras tanto: un toque de
     más no le llega al agente (Material, «display an Undo action»). */
  let cuenta = null;
  const parar = () => { clearInterval(cuenta); cuenta = null; boton.textContent = tr("Enviar respuesta"); repasar(); };
  boton.addEventListener("click", () => {
    if (cuenta) { parar(); estado.textContent = tr("No se ha mandado."); return; }
    const el = leerForm();
    if (!completa(el)) return;
    let quedan = 5;
    boton.textContent = tr("Deshacer ({n})", { n: quedan });
    estado.textContent = tr("Se manda en {n} s.", { n: quedan });
    cuenta = setInterval(async () => {
      quedan -= 1;
      if (quedan > 0) { boton.textContent = tr("Deshacer ({n})", { n: quedan }); estado.textContent = tr("Se manda en {n} s.", { n: quedan }); return; }
      clearInterval(cuenta);
      cuenta = null;
      boton.disabled = true;
      boton.textContent = tr("Mandando…");
      try {
        const r = await api("POST", "/api/decision/responder", { id: d.id, elecciones: el });
        try { localStorage.removeItem(borradorDe(d.id)); } catch (_) {}
        await repintar(r.entregada ? tr("Enviada. Se ha tecleado en el panel {n}.", { n: r.panel }) : tr("Enviada. El agente la leerá cuando la pida."));
      } catch (err) {
        boton.textContent = tr("Enviar respuesta");
        boton.disabled = false;
        // Ya contestada (desde otro aparato): se enseña cómo quedó, y lo tuyo
        // sigue en el borrador por si lo quieres copiar.
        estado.textContent = err.estado === 409 ? tr("Ya estaba contestada desde otro sitio. Lo que escribiste sigue guardado aquí.") : tr("No se ha mandado: {e}", { e: err.message });
      }
    }, 1000);
  });
  repasar();
}

/* El modo de Claude Code, leído de su propia pantalla: la línea de abajo dice
   «auto mode on», «plan mode on» o «accept edits on» (y nada en el normal).
   Shift+Tab pasa al siguiente; desde el PC es una tecla, desde el móvil no
   había forma, y el modo auto se para ante lo que su clasificador no deja
   (publicar, tocar ajustes) hasta que alguien cambia de modo. */
function modoDe(v) {
  const filas = v.filas || [];
  for (let i = filas.length - 1; i >= 0 && i >= filas.length - 12; i--) {
    // «manual mode» es como Claude Code v2.1.302 llama al normal («⏸ manual
    // mode on», visto el 2026-10-17); antes no pintaba nada en ese.
    const m = /(auto mode|plan mode|accept edits|bypass permissions|manual mode) on/i.exec(filas[i]);
    if (m) return { "auto mode": "auto", "plan mode": "plan", "accept edits": tr("aceptar ediciones"), "bypass permissions": tr("sin permisos"), "manual mode": tr("manual") }[m[1].toLowerCase()];
  }
  // En el modo normal Claude Code no pinta nada: no se sabe, y no se inventa.
  return null;
}

/* Lo que está haciendo una terminal de agente AHORA, leído de su pantalla.
   Munir, 2026-10-09, desde el móvil: «¿qué pasa?», con el chat parado en lo
   último dicho mientras el agente trabajaba, porque el transcript solo se
   escribe al acabar cada paso. Claude Code lo pinta así:
     ● Listing 1 directory, calling adeorq 2 times, running 1 shell command…
       ⎿  $ curl -s -m 5 http://127.0.0.1:3013/
     · Gallivanting… (26s · ↓ 1.7k tokens)
   y Codex, «• Working (12s • esc to interrupt)». Lo que no se reconoce no se
   inventa: queda «Trabajando» y nada más. */
const GIRO = /^\s*[·✻✳✢✶✽*•◦]\s+\S[^(]*\((\d[^)·•]*)/;
function ahoraDe(v) {
  const filas = (v.filas || []).map((f) => f.replace(/\s+$/, ""));
  if (["pregunta", "ofrece"].includes(v.estado)) {
    const m = menuDe(filas);
    // Sin menú que pulsar sigue siendo tu turno: se dice, y contestas en la caja.
    return m ? { tipo: "pregunta", ...m } : { tipo: "espera", que: estadoTerminal(v)[0] };
  }
  // Ni trabaja ni te pregunta: acabó, o está quieta. Antes aquí no se pintaba
  // nada y el pie del chat se quedaba mudo justo cuando había terminado.
  if (v.estado === "lista") return { tipo: "termino" };
  if (v.estado !== "a_medias") return { tipo: "quieta" };
  const desde = Math.max(0, filas.length - 40);
  let giro = filas.length;
  for (let i = filas.length - 1; i >= desde; i--) if (GIRO.test(filas[i])) { giro = i; break; }
  const tiempo = giro < filas.length ? GIRO.exec(filas[giro])[1].trim() : "";
  let que = "";
  let det = "";
  for (let j = giro - 1; j >= desde; j--) {
    const m = /^\s*[●⏺]\s+(.+)$/.exec(filas[j]);
    if (!m) continue;
    // La línea sigue en las de debajo si el panel del PC era más estrecho.
    const partes = [m[1]];
    let k = j + 1;
    for (; k < giro && partes.length < 3 && /^ {2,}\S/.test(filas[k]) && !/^\s*⎿/.test(filas[k]); k++) partes.push(filas[k].trim());
    // Solo si es un paso en marcha («…» al final) o una herramienta, «Bash(…)»:
    // un párrafo suyo ya terminado está en el chat, y aquí parecería la tarea.
    const linea = partes.join(" ");
    if (/…$/.test(linea) || /^[\w.-]+(?: - [\w.-]+ \(MCP\))?\(/.test(linea)) {
      que = linea;
      const d = /^\s*⎿\s+(.+)$/.exec(filas[k] || "");
      det = d ? d[1] : "";
    }
    break;
  }
  return { tipo: "trabajando", que, det, tiempo };
}

/* Una pregunta con opciones numeradas al pie de la pantalla («Do you want to
   proceed? ❯ 1. Yes  2. No…»). Solo se busca cuando la terminal ya está en
   «te pregunta», que si no, cualquier lista numerada de un mensaje lo parecía.

   Munir, 2026-10-17: «no va del todo bien». Leído contra tres pantallas de un
   Claude Code v2.1.302 de verdad (están tal cual en `doble-movil.mjs`), fallaba
   en cuatro cosas: de una pregunta en dos líneas salía solo la última; una
   opción larga perdía su final y ninguna traía su descripción; un permiso
   decía «Do you want to proceed?» sin decir QUÉ quería ejecutar; y en una de
   elegir varias el número solo marca la casilla, y lo que la envía («Submit»)
   no lleva número, así que desde el móvil no había forma de mandarla.

   Lo que se saca: la pregunta entera, las opciones con su descripción (si son
   casillas, marcadas o no), lo de encima de la pregunta (de qué es el permiso
   y su comando, o el repaso de las respuestas) y las pestañas de una con
   varias preguntas. Si una línea sigue en la de debajo se sabe por el ancho:
   la terminal la partió porque la palabra siguiente ya no cabía en la raya. */
const RAYA_LLENA = /^\s*[─━═]{8,}\s*$/;
const RAYA_DE_PUNTOS = /^\s*[╌┄┈╍┅┉]{8,}\s*$/;
const OPCION = /^\s*([❯›>]\s*)?(\d{1,2})[.)]\s+(.+?)\s*$/;
const PESTANAS = /[☐☒]\s+\S/;
const PIE_DEL_MENU = /^\s*(Enter to |Esc to |↑\/↓ |Tab to )/;
function menuDe(filas) {
  // El borde de un recuadro («│ ¿Dónde…») se cambia por espacios y no se
  // quita: lo que se mide para saber si una línea sigue debajo es el ancho
  // que ocupaba en la terminal.
  const sinBorde = (f) => f.replace(/^(\s*)([│┃|]\s?)/, (_, s, b) => s + " ".repeat(b.length)).replace(/\s?[│┃|]\s*$/, "");
  const abajo = filas.slice(-45).map(sinBorde);
  let opciones = [];
  abajo.forEach((f, k) => {
    const m = OPCION.exec(f);
    if (!m) return;
    const n = Number(m[2]);
    if (n === 1) opciones = [];
    if (n === opciones.length + 1) opciones.push({ n, fila: k, texto: m[3], sel: Boolean(m[1]) });
  });
  if (opciones.length < 2) return null;
  const primera = opciones[0].fila;
  // Hasta dónde llega el texto del cuadro: la línea más larga desde la raya
  // de encima. No es la raya: un permiso parte sus líneas antes del borde (a
  // 82 columnas en un panel de 89, medido).
  let raya = primera;
  while (raya >= 0 && !RAYA_LLENA.test(abajo[raya])) raya--;
  const ancho = Math.max(0, ...abajo.slice(raya + 1).filter((f) => !RAYA_LLENA.test(f) && !RAYA_DE_PUNTOS.test(f)).map((f) => f.length));
  // ¿La terminal partió `linea` porque `sigue` ya no cabía? Si acababa en una
  // palabra larguísima pegada al borde (una ruta), la partió por dentro y se
  // junta sin hueco.
  const partida = (linea, sigue) => ancho > 0 && linea.length + 1 + (sigue.trim().split(/\s+/)[0] || "").length > ancho;
  const pegar = (a, linea, sigue) => a + (linea.length >= ancho - 2 && linea.trim().split(/\s+/).pop().length >= 20 ? "" : " ") + sigue.trim();
  // Un bloque de filas seguidas como un texto: partidas, se juntan; si no, una por renglón.
  const parrafos = (lista) => lista.reduce((acc, f, i) => {
    if (i && partida(lista[i - 1], f)) acc[acc.length - 1] = pegar(acc[acc.length - 1], lista[i - 1], f);
    else acc.push(f.trim());
    return acc;
  }, []);
  opciones.forEach((o, i) => {
    // Lo de debajo de cada opción, hasta la siguiente o hasta lo que corta.
    const hasta = i + 1 < opciones.length ? opciones[i + 1].fila : abajo.length;
    let ultima = abajo[o.fila];
    const desc = [];
    for (let k = o.fila + 1; k < hasta; k++) {
      const f = abajo[k];
      // «Submit» va sin número debajo de las casillas: lo hace «Listo».
      if (!f.trim() || RAYA_LLENA.test(f) || RAYA_DE_PUNTOS.test(f) || PIE_DEL_MENU.test(f) || f.trim() === "Submit") break;
      if (!desc.length && partida(ultima, f)) { o.texto = pegar(o.texto, ultima, f); ultima = f; continue; }
      desc.push(f);
    }
    // Una descripción que repite la opción («Lunes», «Lunes») no dice nada.
    if (desc.length && parrafos(desc).join(" ") !== o.texto) o.desc = parrafos(desc).join(" ");
    const caja = /^\[([ ✔✓xX■])\]\s+/.exec(o.texto);
    if (caja) { o.marcada = caja[1] !== " "; o.texto = o.texto.slice(caja[0].length); }
    // Las de Claude Code que no son una respuesta: escribir la tuya y hablarlo.
    if (/^Type something\.?$/i.test(o.texto)) { o.escribir = true; o.texto = tr("Escribir otra respuesta"); }
    else if (/^Chat about this$/i.test(o.texto)) o.texto = tr("Hablarlo en el chat");
    else if (/^Submit answers$/i.test(o.texto)) o.texto = tr("Enviar respuestas");
    else if (/^Cancel$/i.test(o.texto)) o.texto = tr("Cancelar");
    delete o.fila;
  });
  const multi = opciones.some((o) => o.marcada !== undefined);
  // La pregunta: las filas seguidas justo encima de la primera opción.
  let k = primera - 1;
  while (k >= 0 && !abajo[k].trim()) k--;
  const deLaPregunta = [];
  for (; k >= 0; k--) {
    const f = abajo[k];
    if (!f.trim() || RAYA_LLENA.test(f) || RAYA_DE_PUNTOS.test(f) || PESTANAS.test(f)) break;
    deLaPregunta.unshift(f);
  }
  const pregunta = parrafos(deLaPregunta).join(" ");
  // Lo de encima: desde la última raya entera hasta la pregunta. Ahí están las
  // pestañas de una con varias preguntas, de qué es un permiso y su comando
  // (entre dos rayas de puntos), o el repaso de lo contestado.
  let desde = k;
  while (desde >= 0 && !RAYA_LLENA.test(abajo[desde])) desde--;
  const encima = abajo.slice(desde + 1, k + 1);
  let pasos = [];
  const contexto = [];
  const comando = [];
  let enComando = false;
  let tramo = [];
  const cerrarTramo = () => { if (tramo.length) contexto.push(...parrafos(tramo)); tramo = []; };
  for (const f of encima) {
    if (PESTANAS.test(f) && !pasos.length) {
      pasos = f.replace(/[←→]/g, "").trim().split(/\s{2,}/)
        .map((x) => /^([☐☒])\s+(.+)$/.exec(x.trim()))
        .filter(Boolean).map((m) => ({ nombre: m[2], hecha: m[1] === "☒" }));
      continue;
    }
    if (RAYA_DE_PUNTOS.test(f)) { cerrarTramo(); enComando = !enComando; continue; }
    if (enComando) { comando.push(f.trim()); continue; }
    if (!f.trim() || /^\s*Tip:/.test(f)) { cerrarTramo(); continue; }
    tramo.push(f);
  }
  cerrarTramo();
  const corto = (lista, tope) => (lista.length > tope ? [...lista.slice(0, tope), "…"] : lista);
  return {
    pregunta, opciones, multi, pasos,
    contexto: corto(contexto, 6), comando: corto(comando, 8).join("\n"),
  };
}

/* Una pregunta de la terminal, con sus opciones a un toque. La misma en su
   chat (`ahoraHtml`) y en Decisiones (`tarjetaPregunta`): eran dos copias del
   mismo HTML, y una opción nueva salía en una y en la otra no. */
function menuHtml(a, claseDeLaPregunta) {
  const pasos = a.pasos?.length > 1
    ? `<div class="menu-pasos">${a.pasos.map((p) => `<span data-hecha="${p.hecha}">${p.hecha ? "✓ " : ""}${esc(p.nombre)}</span>`).join("")}</div>` : "";
  const contexto = a.contexto?.length
    ? `<div class="menu-ctx">${a.contexto.map((x, i) => (i === 0 && a.comando ? `<b>${esc(x)}</b>` : `<span>${esc(x)}</span>`)).join("")}</div>` : "";
  const comando = a.comando ? `<pre class="menu-cmd">${esc(a.comando)}</pre>` : "";
  const opcion = (o) => `<button data-num="${o.n}"${o.escribir ? ' data-escribir="true"' : ""}${o.marcada !== undefined ? ` aria-pressed="${o.marcada}"` : ""}><span class="num">${o.n}</span><span class="op-txt"><span>${esc(o.texto)}</span>${o.desc ? `<small>${esc(o.desc)}</small>` : ""}</span></button>`;
  return `${pasos}${contexto}${comando}${a.pregunta ? `<div class="${claseDeLaPregunta}">${esc(a.pregunta)}</div>` : ""}
    ${a.multi ? `<p class="menu-nota">${tr("Marca las que quieras y pulsa «Listo».")}</p>` : ""}
    <div class="opciones-menu"${a.multi ? ' data-multi="true"' : ""}>${a.opciones.map(opcion).join("")}</div>
    ${a.multi ? `<button class="mini menu-listo" type="button" data-tecla="right">${tr("Listo, siguiente")}</button>` : ""}
    <div class="menu-escribir" hidden><textarea rows="2" aria-label="${tr("Tu respuesta")}" placeholder="${tr("Tu respuesta")}"></textarea><button class="mini menu-mandar" type="button">${tr("Mandar")}</button></div>`;
}

/* Contestar un menú de la terminal, igual en su chat y en Decisiones. Medido
   en Claude Code v2.1.302 (2026-10-17): el número elige y pasa a la siguiente;
   en una de elegir varias solo marca la casilla, y la flecha derecha lleva al
   repaso («Review your answers»), que se envía con su 1; en «Type something.»
   el número deja la opción escribiendo, y el texto con Intro la contesta (las
   dos cosas las hace `mandar_texto`: un número suelto es una tecla, un texto
   va pegado y con su Intro). Devuelve qué pasó, o null si aún no se mandó nada. */
async function contestarMenu(caja, panel, arranque, ev) {
  if (ev.target.closest(".menu-escribir textarea")) return null;
  const tecla = ev.target.closest("button[data-tecla]");
  if (tecla) {
    await api("POST", "/api/terminal/tecla", { panel, arranque, tecla: tecla.dataset.tecla });
    return "enviado";
  }
  const area = caja.querySelector(".menu-escribir");
  if (ev.target.closest(".menu-mandar")) {
    const texto = area.querySelector("textarea").value.trim();
    if (!texto) return null;
    await api("POST", "/api/terminal/escribir", { panel, arranque, texto: area.dataset.num });
    await new Promise((r) => setTimeout(r, 350));
    await api("POST", "/api/terminal/escribir", { panel, arranque, texto });
    return "enviado";
  }
  const b = ev.target.closest("button[data-num]");
  if (!b) return null;
  // La tuya se escribe primero aquí: el número se manda con ella, que si no la
  // terminal se queda escribiendo y la tarjeta no tiene dónde.
  if (b.dataset.escribir) {
    area.hidden = false;
    area.dataset.num = b.dataset.num;
    area.querySelector("textarea").focus();
    return null;
  }
  await api("POST", "/api/terminal/escribir", { panel, arranque, texto: b.dataset.num });
  return b.closest("[data-multi]") ? "marcado" : "enviado";
}
/* Lo que escribiste en «Escribir otra respuesta» sobrevive a que se repinte
   la pregunta (cada pocos segundos, si algo cambia en la pantalla). */
function conservarEscrito(el, pintar) {
  // En Decisiones hay una por terminal: se reconocen por su panel.
  const clave = (area) => area.closest("[data-panel]")?.dataset.panel ?? "";
  const antes = [...el.querySelectorAll(".menu-escribir:not([hidden])")].map((area) => ({
    clave: clave(area), num: area.dataset.num, texto: area.querySelector("textarea").value,
    foco: document.activeElement === area.querySelector("textarea"),
  }));
  pintar();
  for (const a of antes) {
    const area = [...el.querySelectorAll(".menu-escribir")].find((x) => clave(x) === a.clave);
    if (!area || !area.parentElement.querySelector(`button[data-num="${a.num}"][data-escribir]`)) continue;
    area.hidden = false;
    area.dataset.num = a.num;
    area.querySelector("textarea").value = a.texto;
    if (a.foco) area.querySelector("textarea").focus();
  }
}

/* El pie del chat: la mascota y lo que pasa ahora. Siempre está, porque es
   quien dice en qué anda la terminal: teclea si trabaja, te llama si te
   pregunta, celebra si acabó y parpadea (o se estira) si no pasa nada. Es UNA
   mascota, la de clave «ahora»: al cambiar de estado no nace otra, cambia de
   ánimo, y por eso se le ve la entrada de cada uno. */
const ANIMO_AHORA = { trabajando: "trabaja", pregunta: "espera", espera: "espera", termino: "lista", quieta: "quieta", cerrada: "dormida" };
function ahoraHtml(a) {
  if (!a) return "";
  const m = mascota(ANIMO_AHORA[a.tipo] || "quieta", 26, "ahora");
  if (a.tipo === "pregunta") {
    return `<div class="ahora-cab">${m}${tr("Te pregunta")}</div>${menuHtml(a, "ahora-que")}`;
  }
  if (a.tipo === "espera") return `<div class="ahora-cab">${m}<span><b>${tr("Es tu turno:")}</b> ${tr("{que}. Contéstale abajo.", { que: esc(a.que) })}</span></div>`;
  if (a.tipo === "termino") return `<div class="ahora-cab">${m}<span><b>${tr("Ha terminado.")}</b> ${tr("Si quieres que siga, díselo abajo.")}</span></div>`;
  if (a.tipo === "quieta") return `<div class="ahora-cab">${m}<span>${tr("Quieta, esperando a que le digas algo.")}</span></div>`;
  if (a.tipo === "cerrada") return `<div class="ahora-cab">${m}<span>${esc(a.que)}</span></div>`;
  return `<div class="ahora-cab">${m}${tr("Trabajando")}${a.tiempo ? ` · ${esc(a.tiempo)}` : ""}</div>${a.que ? `<div class="ahora-que">${esc(a.que)}</div>` : ""}${a.det ? `<div class="ahora-det">${esc(a.det)}</div>` : ""}`;
}

/* Una fila de la pantalla, legible en el móvil. Los ⏵ y ⏸ de Claude Code no
   están en la letra del móvil y salían como cajitas; y sus rayas de lado a
   lado, más anchas que el móvil, se partían en dos filas. */
const GLIFOS = { "⏵": "›", "⏸": "‖", "⏺": "●" };

/* La «Pantalla» de una terminal (Munir, 2026-10-16: la 1 y la 3 mezcladas, «se
   ve muy encogida y no se ve claro y estructurado»): a todo el ancho, con los
   colores de la terminal del PC (`trozos`: texto, color y negrita o tenue), y
   la caja donde se escribe resaltada abajo. En Claude Code esa caja va entre
   las dos últimas rayas de lado a lado y lo de debajo es su barra de estado;
   en una consola, la última línea es lo que espera. */
const RAYA_SOLA = /^\s*[─━═]{3,}\s*$/;
const RAYA_CON_TITULO = /^\s*[─━═]{3,}\s+(.+?)\s+[─━═]+\S?\s*$/;
function trozosHtml(trozos) {
  return trozos.map(([texto, color, marca]) => {
    const t = esc(String(texto).replace(/[⏵⏸⏺]/g, (c) => GLIFOS[c]));
    const clase = marca & 1 ? "b" : marca & 2 ? "d" : "";
    return color || clase ? `<span${clase ? ` class="${clase}"` : ""}${/^#[0-9a-f]{6}$/i.test(color) ? ` style="color:${color}"` : ""}>${t}</span>` : t;
  }).join("");
}
/* Lo de antes de la pantalla cuando el agente pinta a pantalla completa
   (Munir, 2026-10-16: «el modo pantalla se sigue sin ver nada del historial»).
   Ahí xterm no guarda nada por encima de lo que se ve: lo de antes lo vuelve a
   pintar Claude Code desde su transcript, y de ahí lo saca el PC
   (`/api/historia`, `historia.rs`), en orden. */
const mdTerminal = (x) => esc(x)
  .replace(/^#{1,6}\s+(.+)$/gm, "<b>$1</b>")
  .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
  .replace(/`([^`\n]+)`/g, '<span class="h-cod">$1</span>');
function historiaHtml(piezas) {
  return piezas.map((p) => {
    if (p.t === "tu") return `<span class="h-tu">${esc(p.x)}</span>`;
    if (p.t === "uso") return `<span class="l h-uso"><b class="h-punto">●</b> <b>${esc(p.n)}</b>${p.d ? `(${esc(p.d)})` : ""}</span>`;
    return `<span class="h-dice"><b class="h-punto">●</b> ${mdTerminal(p.x)}</span>`;
  }).join("");
}
/* Dónde empieza en el historial lo que ya se ve en la pantalla, para no
   pintarlo dos veces. Se compara solo letras y números: la pantalla lo lleva
   partido al ancho del PC y sin el markdown, y el transcript, entero y con él.
   La primera línea de la pantalla con texto que salga cerca del FINAL del
   historial marca el corte; si sale muy atrás, es que en el PC subieron con la
   rueda (o una frase repetida) y no se corta: se pinta todo y una raya. */
const norma = (s) => String(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
function cortarHistoria(piezas, pantalla) {
  const textoDe = (p) => (p.t === "uso" ? `${p.n}${p.d}` : p.x);
  let todo = "";
  const inicio = piezas.map((p) => { const i = todo.length; todo += norma(textoDe(p)); return i; });
  for (let j = 0; j < pantalla.length; j++) {
    const k = norma(pantalla[j]);
    if (k.length < 14) continue;
    const pos = todo.lastIndexOf(k);
    if (pos < 0) continue;
    if (todo.length - pos > norma(pantalla.slice(j).join("")).length * 2 + 600) break;
    let i = inicio.length - 1;
    while (i > 0 && inicio[i] > pos) i--;
    const quedan = piezas.slice(0, i);
    const p = piezas[i];
    // El principio de esa pieza, que en la pantalla ya no cabe: hasta el corte.
    if (p.t !== "uso") {
      let vistos = 0, corte = p.x.length;
      for (let c = 0; c < p.x.length; c++) {
        if (!norma(p.x[c])) continue;
        if (vistos === pos - inicio[i]) { corte = c; break; }
        vistos++;
      }
      const parte = p.x.slice(0, corte).trimEnd();
      if (norma(parte)) quedan.push({ ...p, x: parte });
    }
    return { piezas: quedan, desde: j, cortado: true };
  }
  return { piezas, desde: 0, cortado: false };
}
function pantallaHtml(v, historia) {
  const lineas = Array.isArray(v.trozos) && v.trozos.length ? v.trozos : (v.filas || []).map((f) => [[f, "", 0]]);
  const vacia = !lineas.some((t) => t.some((x) => String(x[0]).trim()));
  if (vacia) return historia?.length ? historiaHtml(historia) : `<span class="l">${tr("(la pantalla está vacía)")}</span>`;
  const textos = lineas.map((t) => t.map((x) => x[0]).join(""));
  const linea = (i) => {
    if (RAYA_SOLA.test(textos[i])) return `<span class="l regla" aria-hidden="true"></span>`;
    const m = RAYA_CON_TITULO.exec(textos[i]);
    if (m) return `<span class="l regla-titulo">${esc(m[1])}</span>`;
    return `<span class="l">${trozosHtml(lineas[i])}</span>`;
  };
  const rango = (a, b) => Array.from({ length: Math.max(0, b - a) }, (_, k) => linea(a + k)).join("");
  // Las rayas de las últimas líneas: entre las dos últimas está la caja de escribir.
  const rayas = textos.map((t, i) => (RAYA_SOLA.test(t) || RAYA_CON_TITULO.test(t) ? i : -1)).filter((i) => i >= textos.length - 16 && i >= 0);
  const caja = rayas.length >= 2 ? rayas[rayas.length - 2] : textos.length - 1;
  let antes = "", desde = 0;
  if (historia?.length) {
    const c = cortarHistoria(historia, textos.slice(0, caja));
    desde = c.desde;
    antes = historiaHtml(c.piezas) + (c.cortado ? "" : `<span class="l ahora-pc">${tr("Ahora en la pantalla del PC")}</span>`);
  }
  if (rayas.length >= 2) {
    // La raya de arriba se queda, que lleva el nombre de la sesión; la de abajo
    // la hace el borde de la caja. Lo de debajo de ella, la barra de estado de
    // Claude Code («auto mode on (shift+tab to cycle)»), no se pinta: en el
    // móvil el modo ya está en la caja de escribir (Munir, 2026-10-16).
    const [a, b] = rayas.slice(-2);
    return `${antes}${rango(desde, a + 1)}<div class="entrada">${rango(a + 1, b)}</div>`;
  }
  return `${antes}${rango(desde, textos.length - 1)}<div class="entrada">${linea(textos.length - 1)}</div>`;
}

/* Munir, 2026-10-08: «no veo mucho historial de la terminal», y sin verlo no
   podía copiar el mensaje de compactación. La pantalla de un Claude Code a
   pantalla completa no tiene historial ninguno (lo que no cabe, no está en el
   búfer), así que en una terminal de agente se abre por defecto lo que se ha
   dicho, leído de su transcript, y la pantalla queda en la otra pestaña. */
function pintarTerminal() {
  apuntarUso(`t:${e.arranque}:${e.panel}`);
  /* Bajo el texto, solo los mandos (Munir, 2026-10-16, «la 3»): el modelo, el
     esfuerzo, el modo y «Parar» mientras trabaja. Fuera la fila de teclas
     (Intro, Ctrl+C, flechas). Cada uno sale solo si ese programa lo entiende:
     lo dice el PC (`modelos`, `esfuerzos` y `modos` en `/api/terminal`). */
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        ${botonCajon()}
        <h1 id="titulo">Terminal ${e.panel}<small id="sub">${tr("cargando…")}</small></h1>
        <span class="ctx" id="ctx" role="img" hidden></span>
        <nav class="pestanas" id="pestanas" hidden>
          <button class="pastilla" data-cara="conversa">Chat</button>
          <button class="pastilla" data-cara="pantalla">${tr("Pantalla")}</button>
        </nav>
      </header>
      <button class="aviso-dec" id="aviso-dec" hidden></button>
      <div class="aviso-ctx" id="aviso-ctx" role="status" hidden></div>
      <main class="cuerpo" id="conversa" hidden><div id="turnos"></div><div class="ahora" id="ahora" hidden></div></main>
      <main class="cuerpo" id="marco">
        <p class="nota-pantalla" id="nota-pantalla" hidden>${tr("Lo de antes de esta pantalla está en el {chat}.", { chat: "<button data-ir-chat>Chat</button>" })}</p>
        <pre class="pantalla" id="pantalla"></pre>
      </main>
      <footer class="caja" id="caja">
        <button class="bajar" id="bajar" hidden aria-label="${tr("Ir al final")}">${ICONO.bajar}</button>
        <p class="nota fallo" id="fallo" hidden></p>
        <div class="adjuntos" hidden></div>
        <div class="fila-caja">
          <textarea id="texto" rows="1" placeholder="${tr("Escríbele a esta terminal")}" aria-label="${tr("Texto para la terminal")}"></textarea>
          <div class="elegir" id="elegir" hidden></div>
          <div class="mandos">
            ${CLIP}
            <div class="pastillas mandos-term">
              <button class="pastilla parar" data-tecla="esc" id="parar" hidden>${ICONO.parar}${tr("Parar")}</button>
              <button class="pastilla" type="button" id="modelo" hidden aria-expanded="false" aria-controls="elegir" title="${tr("Con qué modelo trabaja esta terminal")}"></button>
              <button class="pastilla" data-tecla="shift+tab" id="modo" hidden title="${tr("Shift+Tab: pasa al siguiente modo de Claude Code")}">${tr("Modo")}</button>
            </div>
            <button class="enviar" id="enviar" aria-label="${tr("Enviar")}" disabled>${ICONO.subir}</button>
          </div>
        </div>
      </footer>
    </div>`;
  montarBotonCajon();
  const texto = document.getElementById("texto");
  const enviarB = document.getElementById("enviar");
  const crecer = () => { texto.style.height = "auto"; texto.style.height = `${Math.min(texto.scrollHeight, 160)}px`; };
  // Se manda con texto, con adjuntos o con las dos cosas; mientras sube uno, no.
  const listo = () => { enviarB.disabled = (!texto.value.trim() && !adj.rutas().length) || adj.subiendo(); };
  const adj = montarAdjuntos(document.getElementById("caja"), () => listo());
  texto.addEventListener("input", () => { crecer(); listo(); });
  const guardarBorrador = borrador(`t:${e.arranque}:${e.panel}`, texto);
  crecer();
  listo();
  // Lo que no se pudo mandar se queda a la vista hasta que algo salga bien:
  // antes iba al subtítulo, que la vuelta siguiente del sondeo reescribía.
  const fallo = (m) => { const f = document.getElementById("fallo"); if (f) { f.textContent = m; f.hidden = false; } };
  const salioBien = () => { const f = document.getElementById("fallo"); if (f) f.hidden = true; };
  // Lo último pintado en cada cara. Solo se repinta lo que cambió: rehacerlo
  // cada 3 s le quitaba la selección a quien estaba copiando un trozo.
  const pintado = { pantalla: null, conversa: null };
  // El historial de la Pantalla (`/api/historia`), con su firma para que el PC
  // conteste «igual» si no cambió. Es de UNA sesión: otra empieza de cero.
  const historia = { de: "", firma: "", piezas: [] };
  const leerHistoria = async (v) => {
    const de = `${v.carpeta}|${v.sesion}`;
    if (historia.de !== de) Object.assign(historia, { de, firma: "", piezas: [] });
    try {
      const r = await api("GET", `/api/historia?cwd=${encodeURIComponent(v.carpeta)}&id=${encodeURIComponent(v.sesion)}&si=${encodeURIComponent(historia.firma)}`);
      if (!r.igual) Object.assign(historia, { firma: r.firma || "", piezas: Array.isArray(r.piezas) ? r.piezas : [] });
    } catch (_) {
      // Sin historial (la sesión aún no escribió nada): se queda la pantalla sola.
    }
  };
  const ent = entradas();
  const pegadoAbajo = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  let ultima = null;
  // Al entrar, la mascota te saluda una vez (si no te está llamando ya).
  let saludada = false;
  const cara = () => (e.cara === "pantalla" || !ultima?.conversa ? "pantalla" : "conversa");
  const visible = () => document.getElementById(cara() === "pantalla" ? "marco" : "conversa");
  // «Ir al final», solo cuando has subido: lo que llega mientras lees el
  // historial se pinta debajo y sin esto no se sabría.
  const bajar = document.getElementById("bajar");
  const mirarBajar = () => { const el = visible(); if (el && bajar) bajar.hidden = pegadoAbajo(el); };
  ["marco", "conversa"].forEach((id) => document.getElementById(id).addEventListener("scroll", mirarBajar, { passive: true }));
  bajar.addEventListener("click", () => { const el = visible(); if (el) el.scrollTop = el.scrollHeight; mirarBajar(); });
  const cargar = () => {
    if (vueltas++ % 4 === 0) mirarDecisiones().catch(() => {});
    return leer().then(mirarBajar, (err) => {
      // Una terminal cerrada en el PC deja de contestar: se dice arriba en vez
      // de dejar la última pantalla como si siguiera viva. Y en el chat, la
      // mascota se duerme: ahí ya no hay nadie.
      const s = document.getElementById("sub");
      if (s) s.textContent = err.message;
      if (ultima?.conversa) pintarAhora({ tipo: "cerrada", que: err.message });
    });
  };
  const leer = async () => {
    const v = await api("GET", `/api/terminal?panel=${e.panel}&arranque=${e.arranque}`);
    // Con color, el PC manda solo los trozos: el texto de cada línea sale de ellos.
    if (!v.filas && Array.isArray(v.trozos)) v.filas = v.trozos.map((t) => t.map((x) => x[0]).join(""));
    const marco = document.getElementById("marco");
    const conversa = document.getElementById("conversa");
    if (!marco || !conversa) return;
    ultima = { ...v, conversa: Boolean(v.agente && v.sesion && v.carpeta) };
    const modo = modoDe(v);
    const bModo = document.getElementById("modo");
    if (bModo) {
      bModo.hidden = !v.modos;
      // Su nombre y ya está (Munir, 2026-10-16: «solo deja Auto»).
      bModo.textContent = modo ? modo.charAt(0).toUpperCase() + modo.slice(1) : tr("Modo");
    }
    // «Parar» (lo que hace Esc) solo mientras trabaja: es cuando hace falta.
    const bParar = document.getElementById("parar");
    if (bParar) bParar.hidden = !estaTrabajando(v);
    pintarMandos(v);
    pintarContexto(v);
    const [palabra] = estadoTerminal(v);
    document.getElementById("titulo").innerHTML = `${esc(v.nombre)}<small id="sub">${esc(hoja(v.carpeta))} · ${palabra}${modo ? ` · ${tr("modo {m}", { m: esc(modo) })}` : ""}</small>`;
    const ahora = cara();
    document.getElementById("pestanas").hidden = !ultima.conversa;
    document.querySelectorAll(".pestanas .pastilla").forEach((b) => { b.dataset.on = String(b.dataset.cara === ahora); });
    marco.hidden = ahora !== "pantalla";
    conversa.hidden = ahora !== "conversa";

    if (ahora === "pantalla") {
      // A pantalla completa, xterm no tiene nada por encima de lo que se ve:
      // lo de antes viene del transcript. Si no hay (aún no escribió nada), la
      // nota con el camino al chat.
      const sinBufer = ultima.conversa && v.alterna !== false;
      if (sinBufer) await leerHistoria(v);
      document.getElementById("nota-pantalla").hidden = !(sinBufer && !historia.piezas.length);
      const texto = JSON.stringify(v.trozos ?? v.filas ?? []) + (sinBufer ? historia.firma : "");
      if (texto !== pintado.pantalla) {
        const abajo = pintado.pantalla === null || pegadoAbajo(marco);
        document.getElementById("pantalla").innerHTML = pantallaHtml(v, sinBufer ? historia.piezas : null);
        pintado.pantalla = texto;
        if (abajo) marco.scrollTop = marco.scrollHeight;
      }
      return;
    }
    // Lo de ahora antes que el transcript: se ve aunque este tarde o falle.
    const seguia = pegadoAbajo(conversa);
    const a = ahoraDe(v);
    pintarAhora(a);
    if (!saludada) {
      saludada = true;
      if (a?.tipo === "quieta" || a?.tipo === "trabajando") reaccionaMascota("ahora", "hola");
    }
    if (seguia) conversa.scrollTop = conversa.scrollHeight;
    const lista = document.getElementById("turnos");
    let r;
    try {
      // `si`: la firma de lo pintado. Si no cambió, el PC contesta solo «igual».
      r = await api("GET", `/api/sesion?cwd=${encodeURIComponent(v.carpeta)}&id=${encodeURIComponent(v.sesion)}&si=${encodeURIComponent(pintado.conversa ?? "")}`);
    } catch (err) {
      // Codex, Gemini y compañía no escriben en `~/.claude`: ahí solo queda la pantalla.
      if (pintado.conversa !== err.message) lista.innerHTML = `<p class="vacio">${tr("No encuentro lo que ha dicho esta sesión ({e}). Lo que se ve está en «Pantalla».", { e: esc(err.message) })}</p>`;
      pintado.conversa = err.message;
      return;
    }
    if (r.igual || !document.getElementById("turnos")) return;
    const abajo = pintado.conversa === null || pegadoAbajo(conversa);
    // Repintar cerraba los pasos que tenías abiertos: se recuerdan por su hora.
    const abiertos = new Set([...lista.querySelectorAll("details.pasos[open]")].map((d) => d.dataset.k));
    lista.innerHTML = r.turnos.length ? turnosHtml(r.turnos, ent) : `<p class="vacio">${tr("Esta sesión todavía no ha dicho nada.")}</p>`;
    lista.querySelectorAll("details.pasos").forEach((d) => { if (abiertos.has(d.dataset.k)) d.open = true; });
    pintado.conversa = r.firma;
    if (abajo) conversa.scrollTop = conversa.scrollHeight;
  };
  /* El contexto: el anillo de arriba siempre, y desde el 60 % el aviso de
     compactar; desde el 80 %, el de seguir en una nueva (los niveles del PC,
     `nivelDeContexto`). Los botones se los piden al panel del PC, que hace su
     traspaso y, cuando el agente acaba, lo demás. «Ahora no» lo calla hasta
     el nivel siguiente. */
  const avisosCallados = new Set();
  const pintarContexto = (v) => {
    const anillo = document.getElementById("ctx");
    const aviso = document.getElementById("aviso-ctx");
    const p = typeof v.contexto === "number" ? v.contexto : null;
    anillo.hidden = p === null;
    if (p === null) { aviso.hidden = true; return; }
    const nivel = p >= 80 ? 2 : p >= 60 ? 1 : 0;
    anillo.dataset.nivel = String(nivel);
    anillo.style.setProperty("--p", `${Math.min(100, Math.max(0, p))}%`);
    anillo.textContent = String(p);
    anillo.setAttribute("aria-label", tr("Contexto gastado: {p} %", { p }));
    const clave = String(nivel);
    if (!nivel || avisosCallados.has(clave)) { aviso.hidden = true; return; }
    const dice = nivel === 2
      ? tr("Esta sesión pesa demasiado ({p} %): mejor seguir en una terminal nueva.", { p })
      : tr("El contexto va por el {p} %: compáctala antes de que pese más.", { p });
    if (aviso.dataset.clave === clave && !aviso.hidden) {
      const texto = aviso.querySelector("span");
      if (texto && !aviso.dataset.hecho) texto.textContent = dice;
      return;
    }
    aviso.dataset.clave = clave;
    aviso.dataset.nivel = clave;
    delete aviso.dataset.hecho;
    aviso.hidden = false;
    aviso.innerHTML = `<span>${esc(dice)}</span><div class="botones">${nivel === 2
      ? `<button data-traspaso="nueva">${tr("Nueva con traspaso")}</button><button data-otro="compactar">${tr("Compactar")}</button>`
      : `<button data-traspaso="compactar">${tr("Compactar")}</button>`}<button data-callar>${tr("Ahora no")}</button></div>`;
  };
  document.getElementById("aviso-ctx").addEventListener("click", async (ev) => {
    const aviso = document.getElementById("aviso-ctx");
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.callar !== undefined) {
      avisosCallados.add(aviso.dataset.clave);
      aviso.hidden = true;
      return;
    }
    const que = b.dataset.traspaso || b.dataset.otro;
    aviso.querySelectorAll("button").forEach((x) => { x.disabled = true; });
    try {
      await api("POST", "/api/terminal/traspaso", { panel: e.panel, arranque: e.arranque, que });
      aviso.dataset.hecho = "1";
      aviso.querySelector("span").textContent = que === "nueva"
        ? tr("Hecho: primero deja el traspaso y, cuando acabe, se abre una terminal nueva que sigue desde ahí.")
        : tr("Hecho: primero deja el traspaso y, cuando acabe, se compacta sola.");
      aviso.querySelector(".botones").hidden = true;
      avisosCallados.add(aviso.dataset.clave);
      enSeguida();
    } catch (err) {
      fallo(tr("No se ha hecho: {e}", { e: err.message }));
      aviso.querySelectorAll("button").forEach((x) => { x.disabled = false; });
    }
  });
  /* El modelo y el esfuerzo se eligen con un toque (Munir, 2026-10-16, «la 3,
     y además el effort»). Van en UNA pastilla («Opus · extra»): con «Parar» a
     la vista, dos pastillas más el modo no cabían en 411 px y «Auto» se salía.
     Tocarla abre dentro de la caja una barra con dos filas, los modelos y los
     esfuerzos, y tocar uno se lo pide al PC y la cierra. Las opciones las dice
     el PC según el programa de esta terminal; lo que lleva puesto, también (el
     modelo por su nombre dentro del de la terminal, el esfuerzo leído de su
     pie). Lo pedido desde aquí se enseña hasta que el PC lo diga, que tarda. */
  const NIVELES = { low: tr("Bajo"), medium: tr("Medio"), high: tr("Alto"), xhigh: tr("Extra"), max: tr("Máx") };
  const elegirEl = document.getElementById("elegir");
  const bModelo = document.getElementById("modelo");
  const mandos = { abierta: false, opciones: { modelo: [], esfuerzo: [] }, puesto: { modelo: "", esfuerzo: "" }, pedido: {}, firma: "" };
  const elPuesto = (que) => {
    const p = mandos.pedido[que];
    if (p && p.hasta > Date.now() && p.valor !== mandos.puesto[que]) return p.valor;
    delete mandos.pedido[que];
    return mandos.puesto[que];
  };
  const pintarElegir = () => {
    bModelo.setAttribute("aria-expanded", String(mandos.abierta));
    const filas = mandos.abierta ? ["modelo", "esfuerzo"].filter((que) => mandos.opciones[que].length) : [];
    const firma = JSON.stringify([filas, mandos.opciones, elPuesto("modelo"), elPuesto("esfuerzo")]);
    if (firma === mandos.firma) return;
    mandos.firma = firma;
    elegirEl.hidden = !filas.length;
    elegirEl.innerHTML = filas.map((que) => `<div class="seg" role="radiogroup" data-que="${que}" aria-label="${que === "esfuerzo" ? tr("Cuánto piensa antes de contestar") : tr("Con qué modelo trabaja esta terminal")}">${mandos.opciones[que].map((o) => `<button type="button" role="radio" aria-checked="${o.valor === elPuesto(que)}" data-valor="${esc(o.valor)}">${esc(o.nombre)}</button>`).join("")}</div>`).join("");
  };
  const pintarMandos = (v) => {
    mandos.opciones.modelo = (v.modelos || []).map((m) => ({ valor: m.alias, nombre: m.nombre }));
    mandos.opciones.esfuerzo = (v.esfuerzos || []).map((x) => ({ valor: x, nombre: NIVELES[x] ?? x }));
    /* Lo puesto se reconoce por el NOMBRE entero, con su versión: las opciones
       son solo los últimos modelos (Munir, 2026-10-17), y una sesión vieja con
       «Opus 5» no lleva puesto «Opus 5.5». Entonces no sale ninguna marcada y
       la pastilla dice el que lleva de verdad, para que se vea que hay otro. */
    const enPc = String(v.modelo || "").toLowerCase();
    mandos.puesto.modelo = mandos.opciones.modelo.find((m) => enPc.includes(m.nombre.toLowerCase()))?.valor ?? "";
    mandos.puesto.esfuerzo = String(v.esfuerzo || "").toLowerCase();
    const modelo = mandos.opciones.modelo.find((m) => m.valor === elPuesto("modelo"))?.nombre ?? (mandos.opciones.modelo.length ? String(v.modelo || "") : "");
    const esfuerzo = elPuesto("esfuerzo") && String(NIVELES[elPuesto("esfuerzo")] ?? elPuesto("esfuerzo")).toLowerCase();
    const hay = mandos.opciones.modelo.length || mandos.opciones.esfuerzo.length;
    bModelo.hidden = !hay;
    bModelo.textContent = modelo && esfuerzo ? `${modelo} · ${esfuerzo}`
      : modelo || (esfuerzo ? tr("Esfuerzo {e}", { e: esfuerzo }) : mandos.opciones.modelo.length ? tr("Modelo") : tr("Esfuerzo"));
    if (!hay) mandos.abierta = false;
    pintarElegir();
  };
  bModelo.addEventListener("click", () => {
    mandos.abierta = !mandos.abierta;
    pintarElegir();
  });
  // Tocar la barra no le quita el teclado al texto.
  elegirEl.addEventListener("mousedown", (ev) => ev.preventDefault());
  elegirEl.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-valor]");
    const que = b?.closest(".seg")?.dataset.que;
    if (!b || !que) return;
    const valor = b.dataset.valor;
    mandos.abierta = false;
    mandos.pedido[que] = { valor, hasta: Date.now() + 60000 };
    if (ultima) pintarMandos(ultima);
    try {
      await api("POST", "/api/terminal/modelo", { panel: e.panel, arranque: e.arranque, [que]: valor });
      salioBien();
      enSeguida();
    } catch (err) {
      delete mandos.pedido[que];
      if (ultima) pintarMandos(ultima);
      fallo(que === "esfuerzo" ? tr("No se ha cambiado el esfuerzo: {e}", { e: err.message }) : tr("No se ha cambiado el modelo: {e}", { e: err.message }));
    }
  });
  // Se compara lo que DICE y no el HTML, que lleva dentro a la mascota y esa
  // cambia de postura sola: comparando el HTML se rehacía en cada vuelta y los
  // botones de una pregunta nacían de nuevo bajo el dedo.
  let ahoraPintado = null;
  const pintarAhora = (a) => {
    const el = document.getElementById("ahora");
    const dice = JSON.stringify(a);
    if (!el || dice === ahoraPintado) return;
    ahoraPintado = dice;
    const cambiaDeTipo = el.dataset.tipo !== (a?.tipo || "");
    el.hidden = !a;
    el.dataset.tipo = a?.tipo || "";
    conservarEscrito(el, () => { el.innerHTML = ahoraHtml(a); });
    // Si te pregunta, la pregunta sube a la caja de escribir, encima del texto:
    // es donde está tu dedo, y contestar es un toque. Si no, vuelve al pie del
    // chat. Es el MISMO elemento: lo que tiene enganchado se va con él.
    const fila = document.querySelector("#caja .fila-caja");
    if (a?.tipo === "pregunta" && fila && el.parentElement !== fila) fila.prepend(el);
    else if (a?.tipo !== "pregunta" && el.parentElement !== document.getElementById("conversa")) document.getElementById("conversa")?.append(el);
    // Solo al cambiar de estado llega desde abajo: que «26s» pase a «27s» no es llegar.
    if (cambiaDeTipo && a) { el.classList.remove("cambia"); void el.offsetWidth; el.classList.add("cambia"); }
  };
  // Las opciones de una pregunta, como en Decisiones (`contestarMenu`).
  const ahoraEl = document.getElementById("ahora");
  ahoraEl.addEventListener("mousedown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
  ahoraEl.addEventListener("click", async (ev) => {
    if (!ev.target.closest("button")) return;
    const botones = [...ahoraEl.querySelectorAll("button")];
    botones.forEach((x) => { x.disabled = true; });
    try {
      const hecho = await contestarMenu(ahoraEl, e.panel, e.arranque, ev);
      if (hecho) {
        salioBien();
        reaccionaMascota("ahora", "enviado");
        enSeguida();
      }
      // Si la pantalla no cambia (una tecla que no llegó), los botones vuelven.
      if (hecho !== "enviado") botones.forEach((x) => { x.disabled = false; });
      else setTimeout(() => botones.forEach((x) => { x.disabled = false; }), 4000);
    } catch (err) {
      fallo(tr("No se ha mandado: {e}", { e: err.message }));
      botones.forEach((x) => { x.disabled = false; });
    }
  });
  document.querySelector("[data-ir-chat]").addEventListener("click", () => {
    e.cara = "conversa";
    pintado.conversa = null;
    cargar();
  });
  // Las decisiones pendientes, cada cuatro vueltas (12 s): no cambian a menudo.
  let vueltas = 0;
  const mirarDecisiones = async () => {
    const v = await api("GET", "/api/decisiones");
    const b = document.getElementById("aviso-dec");
    if (!b) return;
    // Solo las que siguen vivas: una decisión cuya terminal se cerró no es
    // motivo para ponerte un aviso encima del chat de otra.
    const pend = vivas(v.decisiones);
    b.hidden = !pend.length;
    if (!pend.length) return;
    // La de ESTA terminal va primero: es la que tiene a este agente parado.
    pend.sort((x, y) => Number(y.panel === e.panel) - Number(x.panel === e.panel));
    const suya = pend[0].panel === e.panel;
    b.innerHTML = `${ICONO.decision}<span><b>${pend.length === 1 ? (suya ? tr("Esta terminal espera tu decisión") : tr("Una decisión te espera")) : tr("{n} decisiones te esperan", { n: pend.length })}</b> · ${esc(pend[0].titulo)}</span><em>${tr("Contestar")}</em>`;
    b.onclick = () => ir(pend.length === 1 ? { vista: "decision", id: pend[0].id, volverPanel: e.panel, volverArranque: e.arranque } : { vista: "decisiones", volverPanel: e.panel, volverArranque: e.arranque });
  };
  document.querySelectorAll(".pestanas .pastilla").forEach((b) => b.addEventListener("click", () => {
    e.cara = b.dataset.cara;
    // Al volver a una cara, se repinta y se baja al final, como al entrar.
    pintado[e.cara] = null;
    cargar();
  }));
  // Tras escribir, la pantalla tarda un instante en reflejarlo: se vuelve a
  // pedir en seguida en vez de esperar a la vuelta siguiente del sondeo.
  const enSeguida = () => setTimeout(cargar, 700);
  enviarB.addEventListener("click", async () => {
    const txt = conRutas(texto.value.trim(), adj.rutas());
    if (!txt || adj.subiendo()) return;
    enviarB.disabled = true;
    try {
      await api("POST", "/api/terminal/escribir", { panel: e.panel, arranque: e.arranque, texto: txt });
      texto.value = "";
      guardarBorrador();
      adj.vaciar();
      crecer();
      salioBien();
      reaccionaMascota("ahora", "enviado");
      enSeguida();
    } catch (err) {
      fallo(tr("No se ha mandado: {e}", { e: err.message }));
      listo();
    }
  });
  // Pulsar una tecla no le quita el foco a la caja ni se lo da al botón: así no
  // cambia nada de sitio a mitad del toque, y si estabas escribiendo, el
  // teclado sigue fuera.
  document.querySelectorAll(".pastilla[data-tecla]").forEach((b) => b.addEventListener("mousedown", (ev) => ev.preventDefault()));
  document.querySelectorAll(".pastilla[data-tecla]").forEach((b) => b.addEventListener("click", async () => {
    try {
      await api("POST", "/api/terminal/tecla", { panel: e.panel, arranque: e.arranque, tecla: b.dataset.tecla });
      salioBien();
      enSeguida();
    } catch (err) {
      fallo(tr("No se ha mandado: {e}", { e: err.message }));
    }
  }));
  cargar();
  sondear(3000, cargar);
}

/* «Compactar con esto»: el bloque, con la orden delante, en la caja de la
   terminal. `mandar_texto` (pty.rs) teclea la orden y pega el resto, así que
   le llega a Claude Code como orden y no como un mensaje. */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest?.(".compactar");
  const caja = document.getElementById("texto");
  if (!b || !caja || e.vista !== "terminal") return;
  caja.value = `/compact ${textoDelBloque(b).trim()}`;
  caja.dispatchEvent(new Event("input"));
  caja.scrollTop = 0;
  b.textContent = tr("En la caja: dale a enviar");
  b.dataset.hecho = "true";
  setTimeout(() => { b.textContent = tr("Compactar con esto"); b.dataset.hecho = "false"; }, 2400);
});

// ─── Una sesión, para leerla ────────────────────────────────────────────────

/** Las herramientas de un turno, contadas: uno de una sesión de verdad usa
    cientos, y en fila salía un párrafo de «Read · Read · Bash · Read…». */
function resumenHerramientas(lista) {
  const n = new Map();
  for (const h of lista) {
    const k = h.startsWith("mcp__") ? h.split("__")[1] : h;
    n.set(k, (n.get(k) || 0) + 1);
  }
  return [...n].map(([k, v]) => (v > 1 ? `${k} ×${v}` : k)).join(" · ");
}

/** Los turnos de un transcript (`session_messages`), como burbujas. Con `ent`,
    los que llegan desde el último pintado entran desde abajo; un turno se
    reconoce por su hora (o por cómo empieza, si no la trae), no por su sitio
    en la lista, que son «los últimos 80» y se corre con cada turno nuevo. */
const turnosHtml = (turnos, ent) => {
  const html = turnos.map((t) => {
    // «[Image #1]» es como Claude Code apunta una imagen pegada: aquí, una etiqueta.
    const texto = md(t.texto).replace(/\[Image #(\d+)\]/g, (_, n) => `<span class="chip-img">${tr("imagen {n}", { n })}</span>`);
    const llega = ent ? ent.de(`${t.rol}|${t.hora || t.texto.slice(0, 48)}`) : "";
    return `<div class="turno${llega}" data-rol="${t.rol === "tu" ? "tu" : "agente"}"><div class="burbuja">${texto}${pasosHtml(t)}</div></div>`;
  }).join("");
  ent?.pintado();
  return html;
};

/** Los pasos de un turno, plegados: cuántos, de qué, y al abrir qué hizo cada
    uno (`pasos`, de sessions.rs; los últimos 30 del turno). */
function pasosHtml(t) {
  const n = t.herramientas?.length || 0;
  if (!n) return "";
  const resumen = esc(resumenHerramientas(t.herramientas));
  if (!t.pasos?.length) return `<span class="herramientas">${resumen}</span>`;
  const antes = n - t.pasos.length;
  const filas = t.pasos.map((p) => `<li><b>${esc(p.nombre)}</b>${p.detalle ? `<span>${esc(p.detalle)}</span>` : ""}</li>`).join("");
  return `<details class="pasos" data-k="${esc(t.hora)}"><summary><b>${n === 1 ? tr("1 paso") : tr("{n} pasos", { n })}</b><span>${resumen}</span></summary>
    <ol>${antes > 0 ? `<li class="antes">${tr("y {n} antes", { n: antes })}</li>` : ""}${filas}</ol></details>`;
}

function abrirSesion(cl) {
  const w = (e.conv?.trabajos || []).find((x) => claveDe(x) === cl);
  if (!w) return;
  const sid = (e.vivo?.sesiones || {})[cl] || w.sesion;
  ir({ vista: "sesion", w, sid, volver: { id: e.id } });
}

function pintarSesion() {
  const w = e.w;
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        <button class="atras" id="atras" aria-label="${tr("Volver al conserje")}">${ICONO.atras}</button>
        <h1>${esc(hoja(w.carpeta))}<small>${esc(nombreDe(w))} · ${esc(w.encargo)}</small></h1>
      </header>
      <main class="cuerpo" id="sesion"></main>
      <p class="solo-lectura">${tr("Solo para leer. Si quieres decirle algo, díselo al conserje.")}</p>
    </div>`;
  document.getElementById("atras").addEventListener("click", () => ir({ vista: "hilo", id: e.volver.id }, true));
  const cuerpo = document.getElementById("sesion");
  if (!e.sid) {
    cuerpo.innerHTML = `<p class="vacio">${tr("Esta sesión todavía no ha escrito nada. En cuanto empiece, aparece aquí.")}</p>`;
    return;
  }
  const cargar = async () => {
    const turnos = await api("GET", `/api/sesion?cwd=${encodeURIComponent(w.carpeta)}&id=${encodeURIComponent(e.sid)}`);
    const aqui = document.getElementById("sesion");
    if (!aqui) return;
    const abajo = aqui.scrollHeight - aqui.scrollTop - aqui.clientHeight < 60;
    aqui.innerHTML = turnos.length ? turnosHtml(turnos) : `<p class="vacio">${tr("Todavía no hay nada que leer.")}</p>`;
    if (abajo) aqui.scrollTop = aqui.scrollHeight;
  };
  cargar().catch((err) => { cuerpo.innerHTML = `<p class="nota">${esc(err.message)}</p>`; });
  sondear(5000, cargar);
}

pintar();
</script>
