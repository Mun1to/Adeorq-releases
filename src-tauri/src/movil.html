<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#060a12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8eef8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg">
<link rel="apple-touch-icon" href="/icono-180.png">
<title>Adeorq</title>
<!--
  El conserje de Adeorq en el móvil. Lo sirve `src-tauri/src/movil.rs` desde
  el PC, y llega aquí por Tailscale. Todo va dentro de este archivo: la
  política de la página no deja cargar nada de fuera.

  Lo que el móvil hace es HABLAR con el conserje, MIRAR sus sesiones y, desde
  el 2026-10-07 (decisión E3 de Munir), ESCRIBIR en cualquier terminal: la
  lista de las abiertas, la pantalla de una y una caja para mandarle texto o
  una tecla (Intro, Esc, Ctrl+C). Abrir sesiones sigue siendo del conserje.
-->
<style>
  /* ════════════════════════════════════════════════════════════════════
     La cara del móvil (2026-10-15). Munir: «lo quiero más como la app de
     Claude, pero no idéntico, como el layout». La estructura es la de esa
     app (un cajón a la izquierda con todo lo vivo, el chat a pantalla entera,
     la caja de escribir redonda abajo con sus botones debajo) y la cara es la
     de Adeorq: cristal sobre un cielo, el azul de la casa, el punto de estado
     cuadrado y los iconos de trazo 1,9 del escritorio (Icons.tsx).

     Orden: 1 tokens · 2 base · 3 armazón · 4 piezas · 5 cajón · 6 portada ·
     7 chat · 8 terminal · 9 caja · 10 decisiones · 11 emparejar · 12 mascota
     · 13 movimiento. Las esquinas son redondas a propósito: esta casa sigue a
     la app de Claude (estilo.md) y `pnpm estilo` no la mira.
     ════════════════════════════════════════════════════════════════════ */

  /* ── 1. Tokens: oscuro de base (el «azul» del escritorio), claro debajo ── */
  :root {
    color-scheme: dark;
    --fondo: #060a12;
    --capa: rgba(16, 22, 36, 0.62);
    --capa-fuerte: rgba(70, 90, 120, 0.26);
    --capa-viva: rgba(86, 110, 145, 0.42);
    --cristal: rgba(14, 20, 33, 0.94);
    --hondo: rgba(0, 0, 0, 0.3);
    --borde: rgba(140, 170, 220, 0.15);
    --borde-fuerte: rgba(150, 185, 240, 0.3);
    --tinta: #e6edfa;
    --suave: #93a4c2;
    --acento: #4d9fff;
    --acento-2: #48c2ff;
    --acento-capa: rgba(77, 159, 255, 0.16);
    --sobre-acento: #071019;
    --vivo: #7ee08a;
    --pregunta: #f3cf8a;
    --termino: #ff9a3c;
    --cerrada: #93a4c2;
    --grave: #ffd166;
    --grave-capa: rgba(255, 209, 102, 0.1);
    --mal: #ff8a80;
    --velo: rgba(2, 5, 10, 0.62);
    --brillo: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --sombra: 0 0 0 1px var(--borde-fuerte), 0 12px 32px rgba(0, 0, 0, 0.45);
    --cielo-1: rgba(77, 159, 255, 0.32);
    --cielo-2: rgba(34, 211, 238, 0.14);
    --cielo-3: rgba(255, 154, 60, 0.09);
    --pantalla: rgba(4, 7, 13, 0.86);
    --vidrio: saturate(150%) blur(22px);
    --r-chico: 10px;
    --r-btn: 14px;
    --r-caja: 20px;
    --r-pastilla: 999px;
    --letra: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Roboto Mono", "SF Mono", Consolas, monospace;
    --t: 0.18s;
    --t-lenta: 0.32s;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --fondo: #e8eef8;
      --capa: rgba(255, 255, 255, 0.76);
      --capa-fuerte: rgba(120, 150, 195, 0.14);
      --capa-viva: rgba(120, 150, 195, 0.26);
      --cristal: rgba(250, 252, 255, 0.96);
      --hondo: rgba(20, 40, 80, 0.06);
      --borde: rgba(40, 70, 120, 0.14);
      --borde-fuerte: rgba(40, 70, 120, 0.28);
      --tinta: #16213a;
      --suave: #5a6a86;
      --acento: #1f6fe0;
      --acento-2: #2f9df3;
      --acento-capa: rgba(31, 111, 224, 0.12);
      --sobre-acento: #ffffff;
      --vivo: #15803d;
      --pregunta: #9a6b12;
      --termino: #c2410c;
      --cerrada: #5a6a86;
      --grave: #9a4b06;
      --grave-capa: #fff4e5;
      --mal: #b42318;
      --velo: rgba(20, 30, 50, 0.32);
      --brillo: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      --sombra: 0 0 0 1px var(--borde-fuerte), 0 12px 32px rgba(30, 50, 90, 0.18);
      --cielo-1: rgba(31, 111, 224, 0.2);
      --cielo-2: rgba(34, 180, 210, 0.14);
      --cielo-3: rgba(255, 154, 60, 0.1);
      --pantalla: rgba(13, 19, 33, 0.92);
    }
  }

  /* ── 2. Base ── */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* `hidden` esconde SIEMPRE. Cada `display` de una clase le ganaba y salían
     cosas que no tocaban: el recuadro vacío de los avisos y, al contestar una
     decisión, el botón de enviar otra vez. Una regla en vez de un parche por pieza. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font: 16px/1.5 var(--letra);
    -webkit-font-smoothing: antialiased;
  }
  /* El cielo de detrás del cristal: fijo, y no se mueve al hacer scroll. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(70% 45% at 85% 0%, var(--cielo-1), transparent 70%),
      radial-gradient(60% 40% at 0% 100%, var(--cielo-2), transparent 70%),
      radial-gradient(40% 30% at 100% 75%, var(--cielo-3), transparent 70%),
      var(--fondo);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  code { font: 0.88em var(--mono); background: var(--hondo); border: 1px solid var(--borde); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }

  /* ── 3. Armazón: cabecera, cuerpo que hace scroll y caja abajo ── */
  .vista { display: flex; flex-direction: column; height: 100dvh; }
  /* La cabecera: un botón a la izquierda (el cajón, o volver en lo que cuelga
     de otra pantalla), el título centrado con su subtítulo, y en una terminal
     de agente, Chat y Pantalla en una segunda fila. */
  .barra {
    display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; column-gap: 6px;
    padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
    background: var(--capa); backdrop-filter: var(--vidrio); -webkit-backdrop-filter: var(--vidrio);
    border-bottom: 1px solid var(--borde); box-shadow: var(--brillo);
    position: relative; z-index: 2;
  }
  .barra > :first-child { grid-column: 1; }
  .barra h1 {
    grid-column: 2; margin: 0; text-align: center; min-width: 0;
    font-size: 16px; line-height: 1.3; font-weight: 650; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .barra small { display: block; font-size: 12.5px; font-weight: 400; color: var(--suave); overflow: hidden; text-overflow: ellipsis; }
  .atras {
    width: 44px; height: 44px; border-radius: var(--r-btn); border: 0; background: none;
    display: grid; place-items: center; cursor: pointer; color: var(--tinta);
  }
  .atras:active { background: var(--capa-fuerte); }
  .cuerpo { flex: 1; overflow-y: auto; padding: 16px 16px 24px; overscroll-behavior: contain; min-height: 0; }
  .cuerpo[hidden] { display: none; }

  /* ── 4. Piezas sueltas ── */
  /* El punto de estado de la casa: un cuadradito, como en la barra del escritorio. */
  .punto { flex: none; width: 9px; height: 9px; border-radius: 3px; background: var(--cerrada); opacity: 0.55; }
  .punto[data-tono="trabajando"] { background: var(--vivo); opacity: 1; box-shadow: 0 0 8px color-mix(in srgb, var(--vivo) 55%, transparent); animation: late 1.6s ease-in-out infinite; }
  .punto[data-tono="pregunta"] { background: var(--pregunta); opacity: 1; box-shadow: 0 0 8px color-mix(in srgb, var(--pregunta) 50%, transparent); }
  .punto[data-tono="termino"] { background: var(--termino); opacity: 1; }
  .avatar {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 11px 4px 4px 11px; background: var(--acento-capa); color: var(--acento);
  }
  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 12px 18px; border-radius: var(--r-btn); border: 0; cursor: pointer;
    background: linear-gradient(180deg, var(--acento-2), var(--acento)); color: var(--sobre-acento); font-weight: 650;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .boton:disabled { opacity: 0.5; cursor: default; }
  .mini { padding: 5px 12px; border-radius: var(--r-pastilla); border: 1px solid var(--borde-fuerte); background: var(--capa-fuerte); cursor: pointer; font-size: 13px; }
  .nota { padding: 11px 14px; border-radius: var(--r-btn); font-size: 14px; background: var(--grave-capa); color: var(--grave); border: 1px solid color-mix(in srgb, var(--grave) 30%, transparent); }
  .nota b { color: var(--tinta); }
  .nota .mini { margin-left: 8px; }
  .vacio { color: var(--suave); text-align: center; margin-top: 12vh; padding: 0 20px; }
  /* Un rótulo de sección: en mayúsculas pequeñas, como los de la app de Claude. */
  .seccion { display: flex; align-items: center; gap: 8px; margin: 22px 4px 8px; font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--suave); }
  .seccion:first-child { margin-top: 4px; }
  .seccion span { flex: 1; }
  .seccion-nota { margin: 0 4px 8px; font-size: 13px; color: var(--suave); }
  /* Una tarjeta: lo que te reclama o algo que se abre. La raya de la izquierda dice su estado. */
  .tarjeta {
    --c: var(--cerrada);
    display: grid; gap: 5px; width: 100%; text-align: left; cursor: pointer;
    margin: 0 0 10px; padding: 14px 16px; border-radius: var(--r-caja);
    border: 1px solid var(--borde); background: var(--capa);
    box-shadow: var(--brillo), inset 3px 0 0 var(--c);
  }
  .tarjeta[data-estado="trabajando"] { --c: var(--vivo); }
  .tarjeta[data-estado="pregunta"] { --c: var(--pregunta); }
  .tarjeta[data-estado="termino"] { --c: var(--termino); }
  .tarjeta-cab { display: flex; align-items: center; gap: 8px; }
  .tarjeta-cab b { flex: 1; min-width: 0; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .estado {
    flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pastilla);
    font-size: 12px; font-weight: 650; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent);
  }
  .estado i { width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
  .para { font-size: 15px; }
  .porque { font-size: 13px; color: var(--suave); }
  .porque b { color: var(--tinta); font-weight: 600; }
  /* Una fila: lo que se lista sin pedir atención. Juntas, dentro de un grupo de cristal. */
  .fila {
    width: 100%; display: block; text-align: left; cursor: pointer;
    padding: 12px 12px; margin: 0; border-radius: var(--r-btn); border: 0; background: none;
  }
  .fila:active { background: var(--capa-fuerte); }
  .fila b { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila span { font-size: 13px; color: var(--suave); }
  .fila-t { display: flex; align-items: center; gap: 12px; }
  .fila-t b { flex: 1; min-width: 0; }
  .fila-t span { flex: none; }
  .grupo { display: grid; gap: 2px; padding: 6px; border-radius: var(--r-caja); border: 1px solid var(--borde); background: var(--capa); box-shadow: var(--brillo); }
  .grupo .seccion-nota { margin: 4px 12px 6px; }

  /* ── 5. El cajón: la cabina, con todo lo vivo de tu PC ── */
  .cajon-velo { position: fixed; inset: 0; z-index: 20; background: var(--velo); opacity: 0; pointer-events: none; transition: opacity var(--t-lenta); }
  .cajon {
    position: fixed; z-index: 21; top: 0; bottom: 0; left: 0; width: min(86vw, 380px);
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    background: var(--cristal); backdrop-filter: var(--vidrio); -webkit-backdrop-filter: var(--vidrio);
    border-right: 1px solid var(--borde-fuerte); box-shadow: var(--sombra);
    transform: translateX(-104%); transition: transform var(--t-lenta) cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  body[data-cajon] .cajon { transform: none; }
  body[data-cajon] .cajon-velo { opacity: 1; pointer-events: auto; }
  .cajon .marca { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; }
  .cajon .marca b { font-size: 26px; font-weight: 750; letter-spacing: -0.03em; }
  .cajon .menu { display: grid; gap: 2px; padding: 0 10px 12px; border-bottom: 1px solid var(--borde); }
  .cajon .fila { display: flex; align-items: center; gap: 14px; padding: 12px; font-size: 16px; }
  .cajon .fila > svg { color: var(--suave); }
  .cajon .fila b { flex: 1; min-width: 0; font-weight: 500; }
  .cajon .fila .cuenta-dec { margin-left: 0; }
  .cajon .recientes { flex: 1; overflow-y: auto; padding: 4px 10px 96px; }
  .cajon .recientes .seccion { margin: 12px 12px 6px; }
  .cajon .recientes .fila { padding: 10px 12px; font-size: 15.5px; }
  .cajon .fila[aria-current="true"] { background: var(--capa-viva); }
  .cajon .pc { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--borde); font-size: 13px; color: var(--suave); }
  .cajon .pc .punto[data-mal] { background: var(--mal); opacity: 1; }
  .nuevo-encargo {
    position: absolute; right: 16px; bottom: calc(64px + env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 20px; border: 0; border-radius: var(--r-pastilla);
    background: var(--tinta); color: var(--fondo); font-weight: 650; font-size: 15.5px; box-shadow: var(--sombra); cursor: pointer;
  }

  /* ── 6. La portada ── */
  .saludo { display: grid; justify-items: center; gap: 8px; padding: 14px 8px 6px; text-align: center; }
  .saludo h2 { margin: 6px 0 0; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
  .saludo p { margin: 0; color: var(--suave); font-size: 15px; text-wrap: balance; }
  /* El rótulo de las conversaciones, solo cuando hay alguna. Lo pone la página
     en `data-rotulo`, en el idioma de la app. */
  #filas:not(:empty)::before {
    content: attr(data-rotulo); display: block; margin: 22px 4px 8px;
    font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--suave);
  }
  .atajos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .segunda {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; cursor: pointer; text-align: left;
    border-radius: var(--r-caja); border: 1px solid var(--borde); background: var(--capa); box-shadow: var(--brillo); font-weight: 550; font-size: 14.5px;
  }
  .segunda .avatar { width: 30px; height: 30px; }
  .cuenta-dec {
    margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; border-radius: var(--r-pastilla);
    background: var(--pregunta); color: #1d1608; font-size: 12px; font-weight: 750;
  }
  /* Pedir (o quitar) los avisos, al pie. */
  .avisos {
    display: block; width: 100%; margin: 18px 0 8px; padding: 12px 14px; cursor: pointer;
    border: 1px solid var(--borde); border-radius: var(--r-btn); background: var(--capa);
    color: var(--suave); font: inherit; font-size: 13px; text-align: left;
  }
  .avisos[data-on="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .avisos:disabled { opacity: 0.6; }

  /* ── 7. El chat ── */
  .turno { display: flex; margin: 22px 0; }
  .turno[data-rol="tu"] { justify-content: flex-end; }
  .burbuja { max-width: 88%; overflow-wrap: anywhere; font-size: 16.5px; line-height: 1.6; }
  .turno[data-rol="tu"] .burbuja {
    max-width: 84%; padding: 11px 15px; border-radius: 20px 20px 6px 20px; line-height: 1.5;
    background: color-mix(in srgb, var(--acento) 22%, var(--capa));
    border: 1px solid color-mix(in srgb, var(--acento) 32%, transparent);
  }
  #conversa .turno[data-rol="agente"] .burbuja, #hilo .turno[data-rol="agente"] .burbuja, #sesion .turno[data-rol="agente"] .burbuja { max-width: 100%; }
  .burbuja p { margin: 0 0 10px; }
  .burbuja p:last-child, .burbuja ul:last-child, .burbuja ol:last-child { margin-bottom: 0; }
  .burbuja ul, .burbuja ol { margin: 0 0 10px; padding-left: 22px; }
  .burbuja li + li { margin-top: 3px; }
  .burbuja pre { margin: 0 0 10px; padding: 12px; border-radius: var(--r-btn); background: var(--hondo); border: 1px solid var(--borde); white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 var(--mono); }
  .burbuja pre code { background: none; border: 0; padding: 0; font-size: inherit; }
  .burbuja h3, .burbuja h4 { margin: 16px 0 6px; line-height: 1.3; }
  .burbuja h3 { font-size: 17px; }
  .burbuja h4 { font-size: 15.5px; color: var(--suave); }
  .burbuja > :first-child { margin-top: 0; }
  .burbuja blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 3px solid var(--borde-fuerte); color: var(--suave); }
  .burbuja hr { border: 0; border-top: 1px solid var(--borde); margin: 14px 0; }
  /* Una tabla no se parte: si no cabe, se mueve de lado ELLA, no la página. */
  .tabla { overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--borde); border-radius: var(--r-btn); background: var(--capa); }
  .tabla table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
  /* `normal`, no el `anywhere` de la burbuja: con ese, la tabla se encogía al
     ancho del móvil partiendo «Antes» en «Ante|s». Mejor que se mueva de lado. */
  .tabla th, .tabla td { padding: 7px 11px; text-align: left; vertical-align: top; border-top: 1px solid var(--borde); overflow-wrap: normal; max-width: 30ch; }
  .tabla th, .tabla code { white-space: nowrap; }
  .tabla thead th { border-top: 0; background: var(--capa-fuerte); font-weight: 650; }
  /* Un bloque de código con su «Copiar»: el mensaje de compactación sale así. */
  .bloque pre { padding-top: 38px; }
  /* Pegado arriba mientras el bloque se vea: el de compactación ocupa más de
     una pantalla, y quien lo lee llega al final, no al principio. */
  .acciones { position: sticky; top: 6px; float: right; display: flex; gap: 6px; margin: 7px 7px 0 0; z-index: 1; }
  .acciones button {
    padding: 4px 12px; border-radius: var(--r-pastilla); cursor: pointer; font-size: 12.5px;
    border: 1px solid var(--borde-fuerte); color: var(--suave);
    /* Opaco: al bajar pasa por encima del texto, y con la capa translúcida se leían los dos a la vez. */
    background: var(--cristal); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .acciones .compactar, .acciones button[data-hecho="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .herramientas { display: block; font-size: 12.5px; color: var(--suave); font-style: italic; margin-top: 4px; }
  /* Los pasos de un turno, plegados en una pastilla: «13 pasos» y, al abrir, qué hizo cada uno. */
  .pasos { margin-top: 10px; font-size: 13px; color: var(--suave); }
  .pasos summary {
    display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 13px 5px 11px; border-radius: var(--r-pastilla);
    background: var(--capa-fuerte); cursor: pointer; list-style: none; max-width: 100%;
  }
  .pasos summary::-webkit-details-marker { display: none; }
  .pasos summary::before { content: "›"; font-size: 15px; line-height: 1; transition: transform var(--t); }
  .pasos[open] summary::before { transform: rotate(90deg); }
  .pasos summary b { flex: none; font-weight: 650; color: var(--tinta); }
  .pasos summary span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pasos ol { list-style: none; margin: 8px 0 0; padding: 10px 14px; display: grid; gap: 5px; border-radius: var(--r-btn); background: var(--hondo); border: 1px solid var(--borde); font: 12.5px/1.5 var(--mono); }
  .pasos li { display: flex; gap: 8px; min-width: 0; }
  .pasos li b { flex: none; font-weight: 650; color: var(--tinta); }
  .pasos li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pasos .antes { font-style: italic; }
  .chip-img { display: inline-block; padding: 0 9px; margin-right: 4px; border-radius: var(--r-pastilla); font-size: 12.5px; border: 1px solid var(--borde-fuerte); color: var(--suave); }
  .pensando { display: flex; align-items: center; gap: 10px; color: var(--suave); margin: 18px 0 6px; font-size: 14px; }
  .solo-lectura { font-size: 13px; color: var(--suave); text-align: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--borde); background: var(--capa); }

  /* Lo que hace una terminal AHORA, al pie del chat: el transcript solo se
     escribe al acabar cada paso, y sin esto el chat parecía parado. */
  .ahora { display: grid; gap: 4px; margin: 18px 0 6px; padding: 12px 14px; border-radius: var(--r-caja); border: 1px dashed var(--borde-fuerte); }
  .ahora-cab { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--suave); }
  .ahora-cab b { font-weight: 650; color: var(--tinta); }
  /* Lo de debajo, alineado con el texto y no con la mascota. */
  .ahora-que, .ahora-det { margin-left: 47px; }
  .ahora-que { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ahora-det { font: 12.5px/1.4 var(--mono); color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Si te pregunta, la pregunta sube a la caja de escribir (ver la caja): es
     ahí donde está tu dedo, y contestar es un toque. */
  .ahora[data-tipo="pregunta"] {
    margin: 8px 8px 2px; padding: 12px 14px; border-radius: 18px; border-style: solid;
    background: color-mix(in srgb, var(--pregunta) 12%, transparent);
    border-color: color-mix(in srgb, var(--pregunta) 38%, transparent);
  }
  .ahora[data-tipo="pregunta"] .ahora-cab { color: var(--pregunta); font-size: 12px; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; }
  .ahora[data-tipo="pregunta"] .ahora-que { margin-left: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35; color: var(--tinta); }
  .opciones-menu { display: grid; gap: 6px; margin-top: 8px; }
  .opciones-menu button {
    display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: var(--r-btn);
    border: 1px solid var(--borde); background: var(--capa-fuerte); color: var(--tinta); font: inherit; font-size: 15px; text-align: left; cursor: pointer;
  }
  .opciones-menu button .num, .opcion .num {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px;
    background: var(--hondo); border: 1px solid var(--borde-fuerte); color: var(--tinta); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .opciones-menu button:disabled { opacity: 0.55; cursor: default; }

  /* ── 8. Una terminal ── */
  /* Chat y Pantalla: un interruptor en la segunda fila de la cabecera. */
  .pestanas {
    grid-column: 1 / -1; justify-self: center; display: inline-flex; gap: 2px; margin-top: 6px; padding: 3px;
    border-radius: var(--r-pastilla); background: var(--capa-fuerte); border: 1px solid var(--borde);
  }
  .pestanas .pastilla { border: 0; padding: 5px 16px; font-size: 13px; }
  .pestanas .pastilla[data-on="true"] { background: var(--acento); color: var(--sobre-acento); font-weight: 650; }
  /* Una decisión pendiente se ve desde dentro de una terminal. */
  .aviso-dec {
    display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); margin: 10px 12px 0; padding: 10px 14px;
    border-radius: var(--r-btn); border: 1px solid color-mix(in srgb, var(--pregunta) 45%, transparent);
    background: color-mix(in srgb, var(--pregunta) 12%, var(--capa)); color: var(--tinta); font: inherit; font-size: 13.5px;
    text-align: left; cursor: pointer;
  }
  .aviso-dec svg { flex: none; color: var(--pregunta); }
  .aviso-dec span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aviso-dec b { font-weight: 650; }
  .aviso-dec em { flex: none; font-style: normal; font-weight: 650; color: var(--pregunta); }
  /* Una sola cosa hace scroll, el `.cuerpo`, y la letra se ajusta al ancho del
     móvil: con `pre` sin ajustar, una línea de 77 columnas no cabía en 390 px. */
  .pantalla {
    margin: 0; padding: 12px 14px; border-radius: var(--r-caja); border: 1px solid var(--borde);
    background: var(--pantalla); color: #d6e2f5;
    font: 12.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  /* Cada línea en su caja, y lo que no cabe sigue con sangría. */
  .pantalla .l { display: block; padding-left: 2ch; text-indent: -2ch; min-height: 1.45em; }
  /* Las rayas de lado a lado de Claude Code se pintan como una línea del ancho que haya. */
  .pantalla .regla { background: linear-gradient(rgba(150, 185, 240, 0.3), rgba(150, 185, 240, 0.3)) center / 100% 1px no-repeat; }
  .pantalla .regla-titulo { display: flex; align-items: center; gap: 8px; padding-left: 0; text-indent: 0; color: #93a4c2; }
  .pantalla .regla-titulo::before, .pantalla .regla-titulo::after { content: ""; flex: 1; min-width: 12px; border-top: 1px solid rgba(150, 185, 240, 0.3); }
  .nota-pantalla { margin: 0 0 10px; font-size: 13px; color: var(--suave); }
  .nota-pantalla button { padding: 0; border: 0; background: none; color: var(--acento); font: inherit; text-decoration: underline; cursor: pointer; }
  .bajar {
    position: absolute; right: 16px; bottom: calc(100% + 10px); z-index: 2;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    border: 1px solid var(--borde-fuerte); background: var(--cristal); color: var(--tinta); box-shadow: var(--sombra);
  }

  /* ── 9. La caja de escribir: una tarjeta de cristal flotando abajo. Arriba
     el texto; debajo, en una fila, adjuntar, las teclas, las pastillas y mandar. ── */
  .caja { position: relative; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .caja .fallo, .aviso-mejora { margin: 0 4px 8px; }
  .aviso-mejora { font-size: 12.5px; color: var(--acento); }
  .fila-caja {
    display: flex; flex-direction: column; border-radius: 26px; overflow: hidden;
    border: 1px solid var(--borde-fuerte); background: var(--cristal);
    backdrop-filter: var(--vidrio); -webkit-backdrop-filter: var(--vidrio); box-shadow: var(--sombra);
  }
  .caja[data-mejorado="true"] .fila-caja { border-color: color-mix(in srgb, var(--acento) 55%, transparent); }
  textarea {
    display: block; width: 100%; min-width: 0; border: 0; outline: none; background: none; color: var(--tinta);
    font: 16.5px/1.45 var(--letra); padding: 15px 18px 6px; min-height: 52px; max-height: 160px;
    resize: none;
  }
  textarea::placeholder { color: var(--suave); }
  .mandos { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px; min-width: 0; }
  .mandos .hueco { flex: 1; }
  /* Un carril que se desliza: el borde derecho se difumina para que se vea que
     sigue, en vez de cortar la última pastilla en seco contra el botón de mandar. */
  .mandos .pastillas {
    flex: 1; min-width: 0; margin: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  }
  .mandos .pastillas::-webkit-scrollbar { display: none; }
  .enviar {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(180deg, var(--acento-2), var(--acento)); color: var(--sobre-acento);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 14px color-mix(in srgb, var(--acento) 40%, transparent);
  }
  .enviar:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  .adjuntar, .abrir-teclas {
    flex: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    border: 1px solid var(--borde); background: var(--capa-fuerte); color: var(--tinta);
  }
  .abrir-teclas[aria-expanded="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .adjuntos { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .adjunto {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px; border-radius: var(--r-chico); font-size: 13px;
    border: 1px solid var(--borde); background: var(--capa); color: var(--suave);
  }
  .adjunto img { width: 30px; height: 30px; object-fit: cover; border-radius: 7px; flex: none; }
  .adjunto svg { flex: none; margin: 0 2px 0 4px; }
  .adjunto .que { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .adjunto[data-estado="listo"] { color: var(--tinta); }
  .adjunto[data-estado="mal"] { color: var(--mal); border-color: color-mix(in srgb, var(--mal) 45%, transparent); }
  .adjunto .quitar { flex: none; width: 26px; height: 26px; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; font-size: 17px; line-height: 1; }
  .pastillas { display: flex; flex-wrap: wrap; gap: 6px; }
  .pastilla {
    flex: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    height: 40px; padding: 0 14px; border-radius: var(--r-pastilla); cursor: pointer; font-size: 13.5px;
    border: 1px solid var(--borde); background: var(--capa-fuerte); color: var(--tinta);
  }
  .pastilla[data-on="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .pastilla select { appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; outline: none; }
  .pastilla select option { background: var(--fondo); color: var(--tinta); }
  .pastilla:has(select:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }
  .pastilla:disabled { opacity: 0.45; cursor: default; }
  /* Las teclas de una terminal: dentro de la caja, en UNA fila que se mueve de lado si no cabe. */
  .teclas { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px 10px 4px; }
  .teclas::-webkit-scrollbar { display: none; }
  .teclas .pastilla { height: 36px; padding: 0 13px; border-radius: 12px; background: var(--hondo); border-color: var(--borde-fuerte); font: 13px var(--mono); }

  /* ── 10. Decisiones ──
     Ninguna opción sale marcada: la recomendada lleva su etiqueta y su porqué,
     pero elegirla es de Munir (GOV.UK: «Do not pre-select radio options»).
     Mismo orden y mismos números que puso el agente, que es lo que se dicta. */
  .dec-cab { display: grid; gap: 8px; margin: 0 0 16px; }
  .dec-cab p { margin: 0; color: var(--suave); }
  .dec-hecha { padding: 11px 14px; border-radius: var(--r-btn); background: var(--acento-capa); font-size: 14px; }
  /* Si sigue viva o no: lo primero que hay que saber antes de contestar. */
  .dec-cab .dec-vig { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: var(--r-btn); font-size: 14px; border: 1px solid var(--borde); color: var(--suave); background: var(--capa); }
  .dec-vig i { flex: none; width: 9px; height: 9px; margin-top: 6px; border-radius: 3px; background: currentColor; }
  .dec-cab .dec-vig[data-v="viva"] { color: var(--tinta); border-color: color-mix(in srgb, var(--pregunta) 45%, transparent); background: color-mix(in srgb, var(--pregunta) 12%, var(--capa)); }
  .dec-vig[data-v="viva"] i { background: var(--pregunta); animation: late 1.6s ease-in-out infinite; }
  .dec-vig[data-v="huerfana"] { border-style: dashed; }
  .tarjeta[data-vigencia="viva"] .estado i { animation: late 1.6s ease-in-out infinite; }
  .tarjeta[data-vigencia]:not([data-vigencia="viva"]) { background: none; box-shadow: none; margin: 0 0 6px; padding: 10px 14px; }
  .tarjeta[data-vigencia]:not([data-vigencia="viva"]) b { font-weight: 500; }
  .tarjeta[data-vigencia="huerfana"] { border-style: dashed; }
  .tarjeta[data-vigencia="contestada"] .estado { color: var(--vivo); background: color-mix(in srgb, var(--vivo) 15%, transparent); }
  .calma { display: flex; align-items: center; gap: 12px; margin: 6px 4px 4px; color: var(--suave); font-size: 14.5px; }
  .pregunta-d { border: 1px solid var(--borde); border-radius: var(--r-caja); background: var(--capa); padding: 14px 14px 16px; margin: 0 0 14px; min-width: 0; box-shadow: var(--brillo); }
  .pregunta-d legend { padding: 0 6px; font-weight: 650; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
  .letra { color: var(--acento); font-variant-numeric: tabular-nums; }
  .pregunta-d > p { margin: 2px 2px 10px; font-size: 14px; color: var(--suave); }
  .opcion {
    display: flex; align-items: flex-start; gap: 12px; min-height: 48px; padding: 12px 14px; margin: 0 0 8px;
    border: 1px solid var(--borde); border-radius: 16px; background: var(--capa-fuerte); cursor: pointer;
  }
  .opcion:has(input:checked) { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 16%, var(--capa-fuerte)); }
  .opcion:has(input:checked) .num { background: var(--acento); color: var(--sobre-acento); border-color: transparent; }
  /* El círculo del sistema no se ve: lo que se marca es el número (y el input sigue ahí para el teclado y el lector). */
  .opcion input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .opcion:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }
  .opcion .txt { display: grid; gap: 3px; min-width: 0; }
  .opcion small { color: var(--suave); font-size: 13.5px; }
  .rec { justify-self: start; font-style: normal; font-size: 11px; font-weight: 750; letter-spacing: 0.04em; text-transform: uppercase; color: var(--acento); }
  .o { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: 13px; margin: 4px 2px 8px; }
  .o::before, .o::after { content: ""; flex: 1; border-top: 1px solid var(--borde); }
  .libre {
    display: block; width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 16px; resize: none;
    border: 1px solid var(--borde-fuerte); background: var(--hondo); color: var(--tinta); font: inherit; font-size: 15px; max-height: none;
  }
  .libre:focus { outline: none; border-color: var(--acento); }
  .pregunta-d[disabled] .opcion { cursor: default; }
  .pregunta-d[disabled] .opcion:not(:has(input:checked)) { opacity: 0.55; }
  .pie-dec { display: flex; align-items: center; gap: 10px; }
  .pie-dec .enviar-dec { flex: 1; width: auto; }
  .descartar { flex: none; min-height: 48px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid var(--borde-fuerte); background: var(--capa); color: var(--suave); cursor: pointer; }
  .descartar:disabled { opacity: 0.5; cursor: default; }
  .enviar-dec { width: 100%; min-height: 50px; }
  .estado-envio { margin: 0 4px 8px; font-size: 14px; color: var(--suave); }
  .estado-envio:empty { display: none; }

  /* ── 11. Emparejar ── */
  .emparejar { max-width: 420px; margin: 8vh auto 0; padding: 0 20px; display: grid; gap: 14px; }
  .emparejar h1 { font-size: 26px; line-height: 1.2; margin: 8px 0 0; letter-spacing: -0.02em; }
  .emparejar p { margin: 0; color: var(--suave); }
  .campo {
    width: 100%; padding: 14px 16px; border-radius: var(--r-btn); border: 1px solid var(--borde-fuerte);
    background: var(--capa); color: var(--tinta); font: inherit; outline: none;
  }
  .campo:focus { border-color: var(--acento); }
  /* Pegada a su campo: el hueco de la rejilla la dejaba a medio camino del código. */
  .etiqueta-campo { font-size: 13px; color: var(--suave); margin: 4px 0 -8px 2px; }
  .codigo { font-size: 30px; letter-spacing: 0.4em; text-align: center; font-variant-numeric: tabular-nums; }

  /* ── 12. La mascota ──
     La A de cuadritos del escritorio. Sus posturas las cambia el reloj de más
     abajo (`marchas`), no el CSS: teclea mientras el agente trabaja, se asusta
     y te llama si te preguntan, celebra cuando terminan, y si la tocas, brinca. */
  .masc { flex: none; display: block; shape-rendering: crispEdges; overflow: visible; touch-action: manipulation; }

  /* ── 13. Lo que se mueve ──
     Poco y con motivo: una pantalla que entra dice de dónde viene, un mensaje
     nuevo llega desde abajo, el cajón y lo que se pulsa ceden un pelo. Quien
     pide menos movimiento al sistema no ve nada de esto. */
  @keyframes entra { from { opacity: 0; transform: translateX(var(--desde, 14px)); } }
  @keyframes llega { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
  @keyframes late { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .vista { animation: entra 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  #app[data-sentido="atras"] .vista { --desde: -14px; }
  #app[data-sentido="igual"] .vista { animation: none; }
  .nuevo, .ahora.cambia { animation: llega 0.26s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .turno[data-rol="tu"].nuevo { transform-origin: 100% 100%; }
  .tarjeta, .segunda, .fila, .opcion, .opciones-menu button, .boton, .pastilla, .enviar { transition: transform 0.09s ease, background var(--t) ease, border-color var(--t) ease; }
  .tarjeta:active, .segunda:active, .fila:active, .opciones-menu button:active, .boton:active, .enviar:active { transform: scale(0.985); }
  @media (prefers-reduced-motion: reduce) {
    .vista, .nuevo, .ahora.cambia, .estado i, .punto, .dec-vig i { animation: none !important; }
    .tarjeta, .segunda, .fila, .opcion, .opciones-menu button, .boton, .pastilla, .enviar, .cajon, .cajon-velo { transition: none; }
  }
</style>

<body>
<div id="app"></div>
<script>
"use strict";

// ─── Lo pequeño ─────────────────────────────────────────────────────────────

const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LLAVE = "adeorq-movil-clave";

let clave = null;
try { clave = localStorage.getItem(LLAVE); } catch (_) { /* sin almacén: se empareja cada vez */ }

// ─── El idioma ──────────────────────────────────────────────────────────────
// La página habla el idioma de la APP, no el del teléfono: lo dice `movil.rs`
// al servirla (`<html lang="en">`), que lo sabe porque se lo cuenta la ventana
// (`movil_idioma`). Se lee al cargar: si cambias el idioma en Ajustes, el móvil
// lo coge la próxima vez que abra la página. Todo lo que se ve pasa por `tr`;
// lo que escriben los agentes y el conserje (conversaciones, títulos, pantallas)
// es de ellos y sale tal cual. Su comprobador: `scripts/movil-idioma-check.mjs`.
const INGLES = document.documentElement.lang === "en";
const EN = {
  // Lo de todas las pantallas
  "Volver": "Back",
  "Enviar": "Send",
  "Parar": "Stop",
  "cargando…": "loading…",
  "Copiar": "Copy",
  "Copiado": "Copied",
  "No se pudo": "Could not copy",
  "Compactar con esto": "Compact with this",
  "En la caja: dale a enviar": "In the box: press send",
  "ahora mismo": "just now",
  "hace {n} min": "{n} min ago",
  "hace {n} h": "{n} h ago",
  "hace {n} d": "{n} d ago",
  // Cómo va cada cosa
  "trabajando": "working",
  "te pregunta algo": "is asking you something",
  "ha terminado": "has finished",
  "cerrada": "closed",
  "te pregunta": "is asking you",
  "te espera": "waiting for you",
  "en reposo": "idle",
  "terminó": "finished",
  "quieta": "idle",
  "sin nadie detrás": "nobody behind it",
  "hablada": "talked over",
  "contestada": "answered",
  "descartada": "discarded",
  "aceptar ediciones": "accept edits",
  "sin permisos": "bypass permissions",
  // Adjuntos, conexión, avisos y la app
  "Adjuntar una foto o un archivo": "Attach a photo or a file",
  "No se ha subido: {e}": "Not uploaded: {e}",
  "Quitar {nombre}": "Remove {nombre}",
  "está vacío": "it is empty",
  "el PC no dijo dónde lo guardó": "the PC did not say where it saved it",
  "No llego a tu PC. ¿Está encendido, con Adeorq abierto y Tailscale activo en los dos?":
    "I can't reach your PC. Is it on, with Adeorq open and Tailscale running on both?",
  "Algo ha fallado ({n}).": "Something went wrong ({n}).",
  "Sin permiso para avisar.": "No permission to notify.",
  "Avisos puestos en este móvil · tocar para quitarlos": "Notifications on for this phone · tap to turn them off",
  "Avisarme en este móvil cuando una sesión me pregunte o termine":

/* Quién lleva el reloj. La página se repinta a trozos cada pocos segundos, y
   cada repintado cambia el <svg> por otro: por eso la marcha de cada mascota
   no vive en su elemento sino aquí, por su clave («portada», «ahora»…). La que
   nace encuentra a la anterior a mitad de un gesto y sigue por donde iba. */
const marchas = new Map();
const sinMovimiento = () => document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches;
function marchaDe(clave, animo) {
  let m = marchas.get(clave);
  if (!m || m.animo !== animo) {
    // Un ánimo nuevo empieza por su entrada: el susto al enterarse de que la
    // esperan, los tres saltos al terminar.
    m = { animo, marcha: MASCOTA.arrancar(animo, Date.now(), Math.random), hasta: 0, mirada: "", miraHasta: 0, v: 0 };
    marchas.set(clave, m);
  }
  return m;
}
const cuadrosHtml = (m) =>
  MASCOTA.cuadrosDe(sinMovimiento() ? MASCOTA.reposoDe(m.animo) : m.marcha.pose, m.mirada)
    .map((q) => `<rect x="${q.x}" y="${q.y}" width="1.02" height="1.02" fill="${q.c}"/>`).join("");
/** `clave` es quién es esta mascota en la página; dos con la misma clave son la misma. */
function mascota(animo, alto = 26, clave = animo) {
  const m = marchaDe(clave, animo);
  return `<svg class="masc" data-animo="${animo}" data-clave="${esc(clave)}" data-v="${m.v}" viewBox="0 0 ${MASCOTA.ANCHO} ${MASCOTA.ALTO}" width="${Math.round((alto * MASCOTA.ANCHO) / MASCOTA.ALTO)}" height="${alto}" aria-hidden="true">${cuadrosHtml(m)}</svg>`;
}
/** Una reacción, delante de lo que estuviera haciendo: «toque», «hola», «enviado». */
function reaccionaMascota(clave, cual) {
  const m = marchas.get(clave);
  if (!m || sinMovimiento()) return;
  m.marcha = MASCOTA.reaccionar(m.marcha, cual);
  m.hasta = 0;
}
/* Un reloj para todas. Solo trabaja si hay alguna en pantalla, y solo repinta
   la que cambia de postura: entre postura y postura pasan de 130 ms a 3 s. */
setInterval(() => {
  const enPantalla = document.getElementsByClassName("masc");
  if (!enPantalla.length || sinMovimiento()) return;
  const ahora = Date.now();
  for (const el of enPantalla) {
    const m = marchaDe(el.dataset.clave, el.dataset.animo);
    if (m.mirada && ahora >= m.miraHasta) { m.mirada = ""; m.v++; }
    if (ahora >= m.hasta) {
      const r = MASCOTA.avanzar(m.marcha, ahora, Math.random);
      m.marcha = r.marcha;
      m.hasta = ahora + r.espera;
      m.v++;
    }
    if (el.dataset.v !== String(m.v)) { el.innerHTML = cuadrosHtml(m); el.dataset.v = String(m.v); }
  }
}, 50);
/* La tocas y da un brinco. Y si tocas en otro sitio, mira hacia allí un
   momento: en el escritorio sigue al ratón, y aquí el ratón es tu dedo. */
document.addEventListener("pointerdown", (ev) => {
  const tocada = ev.target.closest?.(".masc");
  if (tocada) return reaccionaMascota(tocada.dataset.clave, "toque");
  for (const el of document.getElementsByClassName("masc")) {
    const m = marchas.get(el.dataset.clave);
    const caja = el.getBoundingClientRect();
    if (!m || !caja.width) continue;
    const dx = ev.clientX - (caja.left + caja.width / 2);
    const dy = ev.clientY - (caja.top + caja.height / 2);
    const mirada = dy > caja.height && Math.abs(dx) <= caja.width * 2 ? "bajo" : dx < -caja.width ? "izq" : dx > caja.width ? "der" : "";
    if (mirada !== m.mirada) { m.mirada = mirada; m.v++; }
    m.miraHasta = Date.now() + 2500;
  }
}, { passive: true });

/* Cómo se dice el estado de una terminal (los `WorkState` de lib/pty.ts), y
   con qué tono se pinta: el de las tarjetas del conserje. `tuya` (lo último es
   un mensaje tuyo sin contestar) no reclama: en una terminal viva casi siempre
   es que acaba de recibirlo y piensa. Lo mismo que en el PC (`columnaDe`, en
   lib/estados.ts). */
const ESTADO_TERMINAL = {
  a_medias: [tr("trabajando"), "trabajando"],
  pregunta: [tr("te pregunta"), "pregunta"],
  ofrece: [tr("te espera"), "pregunta"],
  tuya: [tr("en reposo"), "cerrada"],
  lista: [tr("terminó"), "termino"],
  "": [tr("quieta"), "cerrada"],
};
const estadoTerminal = (t) => ESTADO_TERMINAL[t.estado] || ESTADO_TERMINAL[""];

function hace(segundos) {
  const ms = segundos * 1000;
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return tr("ahora mismo");
  if (min < 60) return tr("hace {n} min", { n: min });
  const h = Math.round(min / 60);
  if (h < 24) return tr("hace {n} h", { n: h });
  const d = Math.round(h / 24);
  if (d <= 7) return tr("hace {n} d", { n: d });
  return new Date(ms).toLocaleDateString(INGLES ? "en" : "es", { day: "numeric", month: "short" });
}

/* Lo que acaba de llegar entra desde abajo. Un chat se repinta entero cada
   pocos segundos, así que cada cosa recuerda cuándo nació: repintada a media

    de(clave) {

      const ms = Date.now() - nacio.get(clave);
      return ms < ENTRADA_MS ? ` nuevo" style="animation-delay:-${ms}ms` : "";
    },
    pintado() { primera = false; },
  };
}

const hoja = (ruta) => String(ruta || "").split(/[\\/]/).filter(Boolean).pop() || ruta;
const claveDe = (w) => `${w.arranque ?? 0}:${w.panel}`;
function nombreDe(w) {
  const marca = MARCA[w.cli] || w.cli || "";
  const m = w.modelo ? ` ${w.modelo.charAt(0).toUpperCase()}${w.modelo.slice(1)}` : "";
  return `${marca}${m}`;
}
const nuevoId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

/** Markdown del conserje y de las sesiones, lo justo: párrafos, listas,
    títulos, tablas, citas, negrita y código. Se escapa TODO antes, así que
    nada de lo que diga el modelo es HTML. Los títulos y las tablas están
    porque las respuestas de un Claude Code van llenas: medido el 2026-10-08
    en sus sesiones de esa semana, cientos de `##` y de filas `| … |` que el
    móvil enseñaba tal cual, con las almohadillas y las barras. */
function md(texto) {
  const lineas = esc(texto).split("\n");
  const enLinea = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  let html = "", lista = null, parrafo = [], codigo = null, tabla = null, cita = null;
  const cierraParrafo = () => { if (parrafo.length) { html += `<p>${parrafo.map(enLinea).join("<br>")}</p>`; parrafo = []; } };
  const cierraLista = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const cierraTabla = () => {
    if (!tabla) return;
    const [cab, ...filas] = tabla;
    const celdas = (f, tag) => f.map((c) => `<${tag}>${enLinea(c)}</${tag}>`).join("");
    html += `<div class="tabla"><table><thead><tr>${celdas(cab, "th")}</tr></thead><tbody>${filas.map((f) => `<tr>${celdas(f, "td")}</tr>`).join("")}</tbody></table></div>`;
    tabla = null;
  };
  const cierraCita = () => { if (cita) { html += `<blockquote>${cita.map(enLinea).join("<br>")}</blockquote>`; cita = null; } };
  const cierraTodo = () => { cierraParrafo(); cierraLista(); cierraTabla(); cierraCita(); };
  for (const l of lineas) {
    if (l.trim().startsWith("```")) {
      if (codigo) { html += bloque(codigo); codigo = null; }
      else { cierraTodo(); codigo = []; }
      continue;
    }
    if (codigo) { codigo.push(l); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      cierraParrafo(); cierraLista(); cierraCita();
      // La raya de debajo de la cabecera no es una fila.
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l) && l.includes("-")) continue;
      (tabla ||= []).push(l.trim().slice(1, -1).split("|").map((c) => c.trim()));
      continue;
    }
    cierraTabla();
    const q = l.match(/^\s*&gt;\s?(.*)$/);
    if (q) { cierraParrafo(); cierraLista(); (cita ||= []).push(q[1]); continue; }
    cierraCita();
    const t = l.match(/^\s*(#{1,6})\s+(.*)$/);
    if (t) { cierraParrafo(); cierraLista(); html += t[1].length <= 2 ? `<h3>${enLinea(t[2])}</h3>` : `<h4>${enLinea(t[2])}</h4>`; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { cierraParrafo(); cierraLista(); html += "<hr>"; continue; }
    const m = l.match(/^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/);
    if (m) {
      cierraParrafo();
      const tipo = m[1] ? "ul" : "ol";
      if (lista !== tipo) { cierraLista(); html += `<${tipo}>`; lista = tipo; }
      html += `<li>${enLinea(m[3])}</li>`;
      continue;
    }
    if (!l.trim()) { cierraParrafo(); cierraLista(); continue; }
    cierraLista();
    parrafo.push(l);
  }
  if (codigo) html += bloque(codigo);
  cierraTodo();
  return html;
}

/* Un bloque de código con su «Copiar». En la terminal, el mensaje de
   compactación de un `/fin` lleva además «Compactar con esto», que deja
   `/compact <el bloque>` en la caja: es lo que Munir quería hacer desde el
   móvil el 2026-10-08 y no podía. Solo lo deja escrito; mandarlo es suyo. */
const bloque = (lineas) => {
  const compactar = e.vista === "terminal" && /^#\s*(COMPACTACI[ÓO]N|HANDOFF)\b/i.test(lineas.find((l) => l.trim()) || "");
  return `<div class="bloque"><div class="acciones">${compactar ? `<button class="compactar" type="button">${tr("Compactar con esto")}</button>` : ""}<button class="copiar" type="button">${tr("Copiar")}</button></div><pre>${lineas.join("\n")}</pre></div>`;
};
const textoDelBloque = (b) => b.closest(".bloque")?.querySelector("pre")?.textContent ?? "";

/* El «Copiar» de cualquier bloque, de cualquier vista. El portapapeles solo
   existe en una página segura (la de Tailscale lo es, va por https); si no
   está, se cae al `execCommand` de toda la vida. */
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest?.(".copiar");
  if (!b) return;
  const texto = textoDelBloque(b);
  let hecho = false;
  try { await navigator.clipboard.writeText(texto); hecho = true; } catch (_) {
    const t = document.createElement("textarea");
    t.value = texto;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;opacity:0;resize:none";
    document.body.appendChild(t);
    t.select();
    try { hecho = document.execCommand("copy"); } catch (_) {}
    t.remove();
  }
  b.textContent = hecho ? tr("Copiado") : tr("No se pudo");
  b.dataset.hecho = String(hecho);
  setTimeout(() => { b.textContent = tr("Copiar"); b.dataset.hecho = "false"; }, 1600);
});

// ─── Los adjuntos ───────────────────────────────────────────────────────────
// Munir, 2026-10-08: «que también se puedan adjuntar archivos, imágenes». Se
// suben al PC a trozos (`/api/adjuntar`, cada trozo una petición normal) y al
// mandar se añade su RUTA al texto, que es lo que lee Claude Code.

const TROZO = 45000; // el `TROZO_ADJUNTO` de movil.rs
const LADO_MAXIMO = 2048;

/* Una foto del móvil son 3-8 MB y quien la lee la reduce igual: se achica
   aquí, que por datos sube en segundos en vez de en un minuto. Lo que el
   navegador no sabe abrir (HEIC, un PDF) va tal cual. */
async function achicar(archivo) {
  if (!/^image\/(jpeg|png|webp)$/.test(archivo.type) || !window.createImageBitmap) return archivo;
  try {
    const bmp = await createImageBitmap(archivo);
    const lado = Math.max(bmp.width, bmp.height);
    if (lado <= LADO_MAXIMO && archivo.size <= 2500000) { bmp.close?.(); return archivo; }
    const k = Math.min(1, LADO_MAXIMO / lado);
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.round(bmp.width * k);
    lienzo.height = Math.round(bmp.height * k);
    lienzo.getContext("2d").drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
    bmp.close?.();
    const blob = await new Promise((r) => lienzo.toBlob(r, "image/jpeg", 0.88));
    return blob ? new File([blob], `${archivo.name.replace(/\.[^.]+$/, "") || "foto"}.jpg`, { type: "image/jpeg" }) : archivo;
  } catch (_) {
    return archivo;
  }
}

function aBase64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

async function subir(archivo, progreso) {
  const f = await achicar(archivo);
  const bytes = new Uint8Array(await f.arrayBuffer());
  if (!bytes.length) throw new Error(tr("está vacío"));
  const total = Math.ceil(bytes.length / TROZO);
  const id = nuevoId();
  let ruta = null;
  for (let i = 0; i < total; i++) {
    const v = await api("POST", "/api/adjuntar", { id, nombre: f.name, parte: i, total, datos: aBase64(bytes.subarray(i * TROZO, (i + 1) * TROZO)) });
    progreso((i + 1) / total);
    if (v.ruta) ruta = v.ruta;
  }
  if (!ruta) throw new Error(tr("el PC no dijo dónde lo guardó"));
  return { ruta, nombre: f.name, imagen: f.type.startsWith("image/") ? URL.createObjectURL(f) : null };
}

/* El clip y la bandeja de una caja. `cambio` avisa para encender o apagar el
   botón de enviar; `rutas()` es lo que se añade al texto al mandarlo. */
function montarAdjuntos(caja, cambio) {
  const input = caja.querySelector('input[type="file"]');
  const bandeja = caja.querySelector(".adjuntos");
  const lista = [];
  const pintarBandeja = () => {
    bandeja.hidden = !lista.length;
    bandeja.innerHTML = lista.map((a, i) => {
      const que = a.error ? tr("No se ha subido: {e}", { e: a.error }) : a.ruta ? a.nombre : `${a.nombre} · ${Math.round(a.progreso * 100)} %`;
      return `<span class="adjunto" data-estado="${a.error ? "mal" : a.ruta ? "listo" : "subiendo"}">${a.imagen ? `<img src="${a.imagen}" alt="">` : ICONO.clip}<span class="que">${esc(que)}</span><button type="button" class="quitar" data-i="${i}" aria-label="${esc(tr("Quitar {nombre}", { nombre: a.nombre }))}">×</button></span>`;
    }).join("");
    bandeja.querySelectorAll(".quitar").forEach((b) => b.addEventListener("click", () => {
      const [a] = lista.splice(Number(b.dataset.i), 1);
      if (a?.imagen) URL.revokeObjectURL(a.imagen);
      pintarBandeja();
    }));
    cambio();
  };
  caja.querySelector(".adjuntar").addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const elegidos = [...input.files];
    input.value = "";
    for (const f of elegidos) {
      const a = { nombre: f.name, ruta: null, imagen: null, progreso: 0, error: null };
      lista.push(a);
      pintarBandeja();
      try {
        Object.assign(a, await subir(f, (p) => { a.progreso = p; pintarBandeja(); }));
      } catch (err) {
        a.error = err.message;
      }
      pintarBandeja();
    }
  });
  return {
    subiendo: () => lista.some((a) => !a.ruta && !a.error),
    // Entre comillas si la ruta lleva espacios (una carpeta de usuario con dos nombres).
    rutas: () => lista.filter((a) => a.ruta).map((a) => (/\s/.test(a.ruta) ? `"${a.ruta}"` : a.ruta)),
    vaciar: () => {
      lista.forEach((a) => a.imagen && URL.revokeObjectURL(a.imagen));
      lista.length = 0;
      pintarBandeja();
    },
  };
}

const CLIP = `<button class="adjuntar" type="button" aria-label="${tr("Adjuntar una foto o un archivo")}">${ICONO.clip}</button><input type="file" multiple hidden>`;
const conRutas = (texto, rutas) => [texto, ...rutas].filter(Boolean).join(" ");

async function api(metodo, ruta, cuerpo) {
  const cabeceras = { Authorization: `Bearer ${clave || ""}` };
  if (cuerpo) cabeceras["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch(ruta, { method: metodo, headers: cabeceras, body: cuerpo ? JSON.stringify(cuerpo) : undefined, cache: "no-store" });
  } catch (_) {
    throw new Error(tr("No llego a tu PC. ¿Está encendido, con Adeorq abierto y Tailscale activo en los dos?"));
  }
  const v = await r.json().catch(() => ({}));
  if (r.status === 401) {
    olvidarClave();
    throw new Error(delPc(v.error || "Este móvil no está emparejado."));
  }
  if (!r.ok) {
    const err = new Error(delPc(v.error) || tr("Algo ha fallado ({n}).", { n: r.status }));
    err.estado = r.status;
    throw err;
  }
  return v;
}

function olvidarClave() {
  clave = null;
  try { localStorage.removeItem(LLAVE); } catch (_) {}
  alPanel({ tipo: "adeorq:olvidar" });
  ir({ vista: "emparejar" });
}

/* Dentro del panel personal de Munir (decisión del 2026-10-08): ahí esta
   página va en un marco, y el navegador le da un almacén aparte que Brave
   vacía al cerrar la pestaña. Emparejar exige ir al PC, así que sin esto
   habría que volver a casa cada vez. La clave la guarda el panel y se la da
   al abrir; se habla SOLO con esa dirección, la misma que deja `movil.rs` en
   `frame-ancestors` (`PANEL_DE_MUNIR`). */
const PANEL = "https://munito-panel.pages.dev";
const enMarco = window.top !== window.self;
function alPanel(mensaje) {
  if (enMarco) try { window.parent.postMessage(mensaje, PANEL); } catch (_) {}
}
window.addEventListener("message", (ev) => {
  if (ev.origin !== PANEL || ev.source !== window.parent || ev.data?.tipo !== "adeorq:clave") return;
  const llegada = typeof ev.data.clave === "string" && /^[A-Za-z0-9_-]{16,128}$/.test(ev.data.clave) ? ev.data.clave : null;
  if (e.vista !== "esperando") return;
  if (llegada) {
    clave = llegada;
    try { localStorage.setItem(LLAVE, clave); } catch (_) {}
  }
  ir({ vista: clave ? "lista" : "emparejar" });
});

// ─── El estado y quien lo pinta ─────────────────────────────────────────────

let e = { vista: clave ? "lista" : enMarco ? "esperando" : "emparejar" };
let reloj = null;
// En el panel y sin clave propia: se le pide la suya, y si no contesta en un
// momento (no la tiene, o el panel es viejo) se empareja como siempre.
if (e.vista === "esperando") {
  alPanel({ tipo: "adeorq:clave?" });
  setTimeout(() => { if (e.vista === "esperando") ir({ vista: "emparejar" }); }, 1500);
}

/* El aviso de una terminal trae su panel y el arranque de Adeorq en que era
   ese panel (`/#terminal=3@<arranque>`, `sellar_aviso` en movil.rs): el PC no
   deja leer ni escribir con el de otro arranque, que el «panel 3» de anoche
   es hoy otra terminal. Uno sin arranque solo lo mandaba una versión anterior,
   así que es de antes de reiniciar: con 0, el PC dice eso mismo. */
function terminalDelAviso(hash) {
  const m = /#terminal=(\d{1,6})(?:@(\d{1,16}))?/.exec(hash);
  return m && { vista: "terminal", panel: Number(m[1]), arranque: Number(m[2] || 0) };
}

// Un toque en un aviso abre la página con `#conv=<id>`: se va a esa
// conversación y se limpia la dirección, que no es para guardarla.
{
  const m = /#conv=([A-Za-z0-9_-]{1,64})/.exec(location.hash);
  if (m && clave) e = { vista: "hilo", id: m[1] };
  // Y un aviso de una terminal («te pregunta») abre su pantalla directamente.
  const mt = terminalDelAviso(location.hash);
  if (mt && clave) e = mt;
  // El de una decisión (`ask_decision`), la decisión.
  const md = /#decision=(d[0-9a-f]{1,22})/.exec(location.hash);
  if (md && clave) e = { vista: "decision", id: md[1] };
  if (location.hash) history.replaceState(null, "", location.pathname);
}

// Con la página YA abierta, tocar un aviso no la recarga: el service worker la
// lleva a la dirección nueva y eso es solo un cambio de `#`. Se atiende igual.
window.addEventListener("hashchange", () => {
  const mc = /#conv=([A-Za-z0-9_-]{1,64})/.exec(location.hash);
  const mt = terminalDelAviso(location.hash);
  const md = /#decision=(d[0-9a-f]{1,22})/.exec(location.hash);
  if (location.hash) history.replaceState(null, "", location.pathname);
  if (!clave) return;
  if (md) ir({ vista: "decision", id: md[1] });
  else if (mt) ir(mt);
  else if (mc) ir({ vista: "hilo", id: mc[1] });
});

// ─── Los avisos, aunque la página esté cerrada ─────────────────────────────
// El service worker (`/sw.js`) recibe el aviso y lo enseña; aquí solo se pide
// permiso, se suscribe con la clave de esta app y se le manda al PC lo que
// devuelve el navegador (ver `push.rs`).

const hayPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
if (hayPush) navigator.serviceWorker.register("/sw.js").catch(() => {});

function claveAServidor(b64url) {
  const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
function aB64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function suscripcionActual() {
  if (!hayPush) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function pedirAvisos() {
  const reg = await navigator.serviceWorker.ready;
  if ((await Notification.requestPermission()) !== "granted") throw new Error(tr("Sin permiso para avisar."));
  const { clave: publica } = await api("GET", "/api/push/clave");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveAServidor(publica) });
  await api("POST", "/api/push/suscribir", {
    endpoint: sub.endpoint,
    p256dh: aB64url(sub.getKey("p256dh")),
    auth: aB64url(sub.getKey("auth")),
  });
}

async function quitarAvisos() {
  const sub = await suscripcionActual();
  if (sub) await sub.unsubscribe();
  await api("POST", "/api/push/olvidar", {});
}

async function pintarAvisos() {
  const b = document.getElementById("avisos");
  // En un marco el navegador no deja pedir avisos: se ponen abriendo la página aparte.
  if (!b || !hayPush || enMarco) return;
  let puestos = false;
  try { puestos = !!(await suscripcionActual()) && Notification.permission === "granted"; } catch (_) {}
  b.hidden = false;
  b.dataset.on = String(puestos);
  b.textContent = puestos ? tr("Avisos puestos en este móvil · tocar para quitarlos") : tr("Avisarme en este móvil cuando una sesión me pregunte o termine");
  b.onclick = async () => {
    b.disabled = true;
    try {
      if (puestos) await quitarAvisos(); else await pedirAvisos();
    } catch (err) {
      b.textContent = tr("No se pudo: {e}", { e: err.message });
      b.disabled = false;
      return;
    }
    b.disabled = false;
    pintarAvisos();
  };
}

// ─── Llevarla como una app ──────────────────────────────────────────────────
// Chrome, Edge y Brave avisan de que la página se puede instalar: se guarda el
// aviso y la lista enseña el botón. Safari no avisa nunca (allí es Compartir >
// Añadir a la pantalla de inicio), así que en un iPhone no sale nada.
let instalable = null;
window.addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  instalable = ev;
  pintarInstalar();
});
window.addEventListener("appinstalled", () => { instalable = null; pintarInstalar(); });

function pintarInstalar() {
  const b = document.getElementById("instalar");
  if (!b) return;
  b.hidden = !instalable || enMarco;
  b.onclick = async () => {
    const aviso = instalable;
    if (!aviso) return;
    instalable = null;
    aviso.prompt();
    await aviso.userChoice.catch(() => {});
    pintarInstalar();
  };
}

/* El nombre con el que sale en Ajustes > Móvil, para saber luego cuál quitar:
   sistema y navegador, que es lo que distingue el móvil del portátil. */
function nombreSugerido() {
  const ua = navigator.userAgent;
  const sistema = /Android/i.test(ua) ? "Android" : /iPhone/i.test(ua) ? "iPhone" : /iPad/i.test(ua) ? "iPad"
    : /Windows/i.test(ua) ? "Windows" : /Mac OS X/i.test(ua) ? "Mac" : /Linux/i.test(ua) ? "Linux" : tr("Móvil");
  const navegador = navigator.brave ? "Brave" : /EdgA?\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung"
    : /Firefox\/|FxiOS/.test(ua) ? "Firefox" : /Chrome\/|CriOS/.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "";
  return navegador ? `${sistema} · ${navegador}` : sistema;
}

// ─── El cajón ───────────────────────────────────────────────────────────────
/* La cabina en el bolsillo (Munir, 2026-10-15: «como la app de Claude, el
   layout»). Como el cajón de esa app, sale por la izquierda y tapa lo demás:
   arriba a dónde ir (el conserje, las terminales, las decisiones) y debajo lo
   reciente, cada terminal con su punto de estado y cada conversación. Vive
   fuera de #app, así que repintar una pantalla no lo cierra ni lo rehace; y
   cerrado es `inert`, para que sus botones no se toquen ni se lean de fuera. */
document.body.insertAdjacentHTML("beforeend", `<div class="cajon-velo" id="cajon-velo"></div><nav class="cajon" id="cajon" aria-label="Adeorq"></nav>`);
const cajon = document.getElementById("cajon");
cajon.inert = true;
let delCajon = null;
const botonCajon = () => `<button class="atras" id="abrir-cajon" aria-label="${tr("Abrir el menú")}">${ICONO.menu}</button>`;
function montarBotonCajon() {
  document.getElementById("abrir-cajon")?.addEventListener("click", () => abrirCajon());
}
function abrirCajon() {
  if (!clave) return;
  pintarCajon();
  document.body.dataset.cajon = "";
  cajon.inert = false;
  Promise.all([
    api("GET", "/api/terminales").catch((err) => ({ fallo: err.message })),
    api("GET", "/api/lista").catch(() => []),
    api("GET", "/api/decisiones").catch(() => null),
  ]).then(([vt, lista, vd]) => {
    delCajon = { vt, lista, decisiones: vd?.decisiones || [] };
    if (document.body.dataset.cajon !== undefined) pintarCajon();
  });
}
function cerrarCajon() {
  delete document.body.dataset.cajon;
  cajon.inert = true;
}
function pintarCajon() {
  const d = delCajon || { vt: {}, lista: [], decisiones: [] };
  const terminales = (d.vt.terminales || []).slice().sort((a, b) => Number(b.agente) - Number(a.agente) || a.panel - b.panel);
  const esperan = vivas(d.decisiones).length;
  const aqui = (vista, k) => e.vista === vista && (k === undefined || e.panel === k || e.id === k);
  cajon.innerHTML = `
    <div class="marca">${ICONO.logo}<b>Adeorq</b></div>
    <div class="menu">
      <button class="fila" data-ir="lista" aria-current="${aqui("lista") || aqui("hilo")}">${ICONO.chat}<b>${tr("Conserje")}</b></button>
      <button class="fila" data-ir="terminales" aria-current="${aqui("terminales")}">${ICONO.terminal}<b>${tr("Terminales")}</b>${terminales.length ? `<span>${terminales.length}</span>` : ""}</button>
      <button class="fila" data-ir="decisiones" aria-current="${aqui("decisiones") || aqui("decision")}">${ICONO.decision}<b>${tr("Decisiones")}</b>${esperan ? `<span class="cuenta-dec">${esperan}</span>` : ""}</button>
    </div>
    <div class="recientes">
      ${terminales.length || d.lista.length ? `<h2 class="seccion"><span>${tr("Recientes")}</span></h2>` : ""}
      ${terminales.map((t) => `<button class="fila" data-panel="${t.panel}" aria-current="${aqui("terminal", t.panel)}">${ICONO.terminal}<b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><i class="punto" data-tono="${estadoTerminal(t)[1]}"></i></button>`).join("")}
      ${d.lista.slice(0, 12).map((f) => `<button class="fila" data-conv="${esc(f.id)}" aria-current="${aqui("hilo", f.id)}">${ICONO.chat}<b>${esc(f.titulo || tr("Conversación nueva"))}</b><span>${esc(hace(f.cuando))}</span></button>`).join("")}
    </div>
    <div class="pc"><i class="punto" ${d.vt.fallo ? "data-mal" : 'data-tono="trabajando"'}></i><span>${d.vt.fallo ? tr("Tu PC no contesta") : tr("Tu PC, conectado")}</span></div>
    <button class="nuevo-encargo" id="nuevo-encargo">${ICONO.mas}${tr("Nuevo encargo")}</button>`;
}
cajon.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.ir) return ir({ vista: b.dataset.ir });
  if (b.dataset.panel) return ir({ vista: "terminal", panel: Number(b.dataset.panel), arranque: delCajon?.vt?.arranque });
  if (b.dataset.conv) return ir({ vista: "hilo", id: b.dataset.conv });
  if (b.id === "nuevo-encargo") {
    ir({ vista: "lista" });
    document.getElementById("decir")?.focus();
  }
});
document.getElementById("cajon-velo").addEventListener("click", () => cerrarCajon());
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && document.body.dataset.cajon !== undefined) cerrarCajon(); });
/* Deslizar desde el borde izquierdo lo abre y deslizar hacia la izquierda lo
   cierra, como en la app de Claude. Solo con el móvil emparejado. */
let dedoX = null;
document.addEventListener("touchstart", (ev) => {
  const x = ev.touches[0].clientX;
  const abierto = document.body.dataset.cajon !== undefined;
  dedoX = clave && (abierto || x < 24) && !["emparejar", "esperando"].includes(e.vista) ? x : null;
}, { passive: true });
document.addEventListener("touchend", (ev) => {
  if (dedoX === null) return;
  const dx = ev.changedTouches[0].clientX - dedoX;
  const abierto = document.body.dataset.cajon !== undefined;
  if (dx > 60 && !abierto) abrirCajon();
  if (dx < -60 && abierto) cerrarCajon();
  dedoX = null;
}, { passive: true });

/* `atras` dice por dónde entra la pantalla nueva: hacia delante por la
   derecha, de vuelta por la izquierda. Volver a la portada siempre es volver. */
function ir(cambio, atras = cambio.vista === "lista") {
  clearTimeout(reloj);
  cerrarCajon();
  e = { vista: cambio.vista, ...cambio };
  app.dataset.sentido = atras ? "atras" : "adelante";
  pintar();
}

function sondear(ms, fn) {
  clearTimeout(reloj);
  reloj = setTimeout(async () => {
    if (document.visibilityState === "visible") await fn().catch(() => {});
    sondear(ms, fn);
  }, ms);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && e.vista === "hilo") cargarHilo().catch(() => {});
});

function pintar() {
  if (e.vista === "esperando") { app.innerHTML = `<p class="vacio">${tr("Conectando con tu PC…")}</p>`; return; }
  if (e.vista === "emparejar") return pintarEmparejar();
  if (e.vista === "lista") return pintarLista();
  if (e.vista === "hilo") return pintarHiloEntero();
  if (e.vista === "sesion") return pintarSesion();
  if (e.vista === "terminales") return pintarTerminales();
  if (e.vista === "terminal") return pintarTerminal();
  if (e.vista === "decisiones") return pintarDecisiones();
  if (e.vista === "decision") return pintarDecision();
}

/* El ánimo de la mascota de la portada, que es el de todo tu PC de un vistazo:
   la misma cuenta que hace la campana del escritorio (`animoDe`, lib/campana.ts). */
function animoDeTodo(terminales, esperan) {
  if (esperan || terminales.some((t) => estadoTerminal(t)[1] === "pregunta")) return "espera";
  if (terminales.some((t) => t.estado === "a_medias")) return "trabaja";
  if (terminales.some((t) => t.estado === "lista")) return "lista";
  return terminales.length ? "quieta" : "dormida";
}

/* La portada es una bandeja: arriba lo que te reclama (las decisiones que
   siguen vivas y las terminales que te preguntan), debajo cómo va cada
   terminal, y al final lo hablado con el conserje. Antes había que entrar en
   «Tus terminales» y en «Decisiones» para saber si pasaba algo. */
/** Adeo en la portada es grande: es quien te recibe y dice cómo va el PC de un vistazo. */
const MASC_PORTADA = 72;
async function pintarLista() {
  // Vuelve con el ánimo que tenía: si nace quieta y a los dos segundos se
  // entera de que te esperan, repetía el susto cada vez que volvías a la portada.
  const animoPortada = marchas.get("portada")?.animo || "quieta";
  app.innerHTML = `
    <div class="vista">
      <header class="barra">${botonCajon()}<h1>Adeorq</h1></header>
      <main class="cuerpo">
        <div class="saludo">
          <span id="masc-portada">${mascota(animoPortada, MASC_PORTADA, "portada")}</span>
          <h2>${tr("Buenas.")}</h2>
          <p id="yo">${tr("tu PC")}</p>
        </div>
        <div id="reclaman"></div>
        <div id="portada-term"></div>
        <div class="atajos">
          <button id="decisiones" class="segunda"><span class="avatar">${ICONO.decision}</span>${tr("Decisiones")}<b class="cuenta-dec" id="cuenta-dec" hidden></b></button>
          <button id="terminales" class="segunda"><span class="avatar">${ICONO.terminal}</span>${tr("Terminales")}</button>
        </div>
        <div id="filas" data-rotulo="${tr("Conversaciones")}"></div>
        <button id="avisos" class="avisos" hidden></button>
        <button id="instalar" class="avisos" hidden>${tr("Instalar Adeorq como app en este aparato")}</button>
      </main>
      <footer class="caja">
        <div class="fila-caja decir" id="nueva">
          <textarea id="decir" rows="1" placeholder="${tr("Dile al conserje qué hay que hacer")}" aria-label="${tr("Mensaje nuevo al conserje")}"></textarea>
          <div class="mandos"><span class="avatar">${ICONO.chispa}</span><span class="hueco"></span><button class="enviar" id="decir-enviar" aria-label="${tr("Enviar al conserje")}" disabled>${ICONO.subir}</button></div>
        </div>
      </footer>
    </div>`;
  montarBotonCajon();
  /* Al conserje se le escribe desde aquí mismo: antes esto era un botón que
     abría la conversación, y había que tocar otra vez para empezar a escribir.
     Lo que mandas abre su conversación ya con tu mensaje saliendo. */
  const decir = document.getElementById("decir");
  const decirB = document.getElementById("decir-enviar");
  decir.addEventListener("input", () => {
    decir.style.height = "auto";
    decir.style.height = `${Math.min(decir.scrollHeight, 120)}px`;
    decirB.disabled = !decir.value.trim();
  });
  decirB.addEventListener("click", () => {
    const texto = decir.value.trim();
    if (texto) ir({ vista: "hilo", id: nuevoId(), alEntrar: texto });
  });
  document.getElementById("terminales").addEventListener("click", () => ir({ vista: "terminales" }));
  document.getElementById("decisiones").addEventListener("click", () => ir({ vista: "decisiones" }));
  pintarAvisos().catch(() => {});
  pintarInstalar();
  // Lo que te reclama y cómo va cada terminal. Solo se repinta si cambió.
  let pintado = null;
  let animo = animoPortada;
  const mirar = async () => {
    const [vd, vt] = await Promise.all([
      api("GET", "/api/decisiones").catch(() => null),
      api("GET", "/api/terminales").catch((err) => ({ fallo: err.message })),
    ]);
    const reclaman = document.getElementById("reclaman");
    if (!reclaman) return;
    const decisiones = vd?.decisiones || [];
    const esperan = vivas(decisiones);
    const terminales = (vt.terminales || []).slice().sort((a, b) => Number(b.agente) - Number(a.agente) || a.panel - b.panel);
    const preguntan = terminales.filter((t) => estadoTerminal(t)[1] === "pregunta");
    const otras = terminales.filter((t) => !preguntan.includes(t));

    // La cuenta del botón: las que te esperan DE VERDAD. Las demás no suman
    // ni se dicen: se limpian solas.
    const c = document.getElementById("cuenta-dec");
    c.hidden = !esperan.length;
    c.textContent = String(esperan.length);
    c.setAttribute("aria-label", tr("{n} te esperan", { n: esperan.length }));

    const nuevo = animoDeTodo(terminales, esperan.length);
    if (nuevo !== animo) {
      animo = nuevo;
      document.getElementById("masc-portada").innerHTML = mascota(animo, MASC_PORTADA, "portada");
    }
    const yo = document.getElementById("yo");
    const trabajan = terminales.filter((t) => t.estado === "a_medias").length;
    const teLlaman = esperan.length + preguntan.length;
    yo.textContent = vt.fallo ? tr("tu PC no contesta")
      : [teLlaman ? plural(teLlaman, tr("1 cosa te espera"), tr("{n} cosas te esperan")) : "",
        trabajan ? plural(trabajan, tr("1 agente trabajando"), tr("{n} agentes trabajando")) : ""].filter(Boolean).join(" · ")
        || (terminales.length ? tr("todo tranquilo") : tr("sin terminales abiertas"));

    // Con el arranque: si Adeorq se reinicia, los botones se rehacen con el nuevo.
    const firma = JSON.stringify([esperan, terminales, vt.fallo || "", vt.arranque]);
    if (firma === pintado) return;
    const primera = pintado === null;
    pintado = firma;
    const filaTerminal = (t) => {
      const [palabra, tono] = estadoTerminal(t);
      return `<button class="fila fila-t" data-panel="${t.panel}"><i class="punto" data-tono="${tono}"></i><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><span>${palabra}</span></button>`;
    };
    reclaman.innerHTML = teLlaman
      ? `<h2 class="seccion"><span>${tr("Te esperan")}</span></h2>${esperan.map(tarjetaDecision).join("")}${preguntan.map((t) => {
        const [palabra] = estadoTerminal(t);
        return `<button class="tarjeta${primera ? "" : " nuevo"}" data-estado="pregunta" data-vigencia="viva" data-panel="${t.panel}">
          <span class="tarjeta-cab"><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><span class="estado"><i></i>${palabra}</span></span>
          <span class="porque">${tr("Entra y contéstale desde aquí.")}</span>
        </button>`;
      }).join("")}`
      : "";
    document.getElementById("portada-term").innerHTML = vt.fallo
      ? `<h2 class="seccion"><span>${tr("Terminales")}</span></h2><p class="seccion-nota">${esc(vt.fallo)}</p>`
      : otras.length
        ? `<h2 class="seccion"><span>${tr("En marcha")}</span></h2><div class="grupo">${otras.slice(0, 5).map(filaTerminal).join("")}${otras.length > 5 ? `<p class="seccion-nota">${tr("y {n} más, en «Terminales».", { n: otras.length - 5 })}</p>` : ""}</div>`
        : "";
    reclaman.querySelectorAll(".tarjeta[data-id]").forEach((b) => b.addEventListener("click", () => ir({ vista: "decision", id: b.dataset.id, volver: "lista" })));
    document.querySelectorAll("#reclaman [data-panel], #portada-term [data-panel]").forEach((b) => b.addEventListener("click", () => ir({ vista: "terminal", panel: Number(b.dataset.panel), arranque: vt.arranque, volver: "lista" })));
  };
  mirar().catch(() => {});
  const cargar = async () => {
    const lista = await api("GET", "/api/lista");
    const filas = document.getElementById("filas");
    if (!filas) return;
    filas.innerHTML = lista.length
      ? lista.map((f) => `<button class="fila" data-id="${esc(f.id)}"><b>${esc(f.titulo || tr("Conversación nueva"))}</b><span>${esc(hace(f.cuando))}${f.trabajos ? ` · ${f.trabajos === 1 ? tr("1 sesión") : tr("{n} sesiones", { n: f.trabajos })}` : ""}</span></button>`).join("")
      : `<p class="vacio">${tr("Todavía no has hablado con el conserje. Empieza con el botón de arriba.")}</p>`;
    filas.querySelectorAll(".fila").forEach((b) => b.addEventListener("click", () => ir({ vista: "hilo", id: b.dataset.id })));
  };
  try { await cargar(); } catch (err) {
    // Un 401 ya ha cambiado de vista (`olvidarClave`): entonces no hay dónde pintarlo.
    const filas = document.getElementById("filas");
    if (filas) filas.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  // Cada seis segundos: es la bandeja de lo que te reclama, y son tres
  // respuestas pequeñas. La lista de conversaciones va en la misma vuelta.
  sondear(6000, () => Promise.all([cargar(), mirar()]));
}

      <header class="barra">
        ${botonCajon()}
        <h1 id="titulo">${tr("Conserje")}<small id="sub">${tr("cargando…")}</small></h1>
      </header>
      <main class="cuerpo" id="hilo"></main>
      <footer class="caja" id="caja">
        <p class="aviso-mejora" id="aviso-mejora" hidden>${tr("Mejorado: lo mismo que dijiste, ordenado. Si no te gusta, Deshacer.")}</p>
        <div class="adjuntos" hidden></div>
        <div class="fila-caja">
          <textarea id="texto" rows="1" placeholder="${tr("Dile qué hay que hacer")}" aria-label="${tr("Mensaje al conserje")}"></textarea>

            <option value="haiku">${tr("Sesiones: {m}", { m: "Claude Haiku" })}</option>
            <option value="sonnet">${tr("Sesiones: {m}", { m: "Claude Sonnet" })}</option>
