/* Cómo se dice el estado de una terminal (los `WorkState` de lib/pty.ts), y
   con qué tono se pinta: el de las tarjetas del conserje. `tuya` (lo último es
   un mensaje tuyo sin contestar) no reclama: en una terminal viva casi siempre
   es que acaba de recibirlo y piensa. Lo mismo que en el PC (`columnaDe`, en
   lib/estados.ts). */
const ESTADO_TERMINAL = {
  a_medias: [tr("trabajando"), "trabajando"],
  pregunta: [tr("te pregunta"), "pregunta"],
  ofrece: [tr("te espera"), "pregunta"],
  tuya: [tr("en reposo"), "cerrada"],
  lista: [tr("terminó"), "termino"],
  "": [tr("quieta"), "cerrada"],
};
const estadoTerminal = (t) => ESTADO_TERMINAL[t.estado] || ESTADO_TERMINAL[""];
/** Las terminales que te preguntan algo ahora: cuentan como lo que te espera. */
const preguntanDe = (vt) => (vt?.terminales || []).filter((t) => estadoTerminal(t)[1] === "pregunta");
/** Si su agente está escribiendo ahora mismo: lleva el hilo de luz. */
const estaTrabajando = (t) => estadoTerminal(t)[1] === "trabajando";

function hace(segundos) {
  const ms = segundos * 1000;
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return tr("ahora mismo");
  if (min < 60) return tr("hace {n} min", { n: min });
  const h = Math.round(min / 60);
  if (h < 24) return tr("hace {n} h", { n: h });
  const d = Math.round(h / 24);
  if (d <= 7) return tr("hace {n} d", { n: d });
  return new Date(ms).toLocaleDateString(INGLES ? "en" : "es", { day: "numeric", month: "short" });
}

/* Lo que acaba de llegar entra desde abajo. Un chat se repinta entero cada
   pocos segundos, así que cada cosa recuerda cuándo nació: repintada a media
   entrada sigue por donde iba (el retraso en negativo), y pasada la entrada no
   vuelve a entrar. Lo del primer pintado ya estaba ahí: no entra.
   `de(clave)` se pega dentro de un `class="…"`. */
const ENTRADA_MS = 260;
function entradas() {
  const nacio = new Map();
  let primera = true;
  return {
    de(clave) {
      if (!nacio.has(clave)) nacio.set(clave, primera ? 0 : Date.now());
      const ms = Date.now() - nacio.get(clave);
      return ms < ENTRADA_MS ? ` nuevo" style="animation-delay:-${ms}ms` : "";
    },
    pintado() { primera = false; },
  };
}

const hoja = (ruta) => String(ruta || "").split(/[\\/]/).filter(Boolean).pop() || ruta;
const claveDe = (w) => `${w.arranque ?? 0}:${w.panel}`;
function nombreDe(w) {
  const marca = MARCA[w.cli] || w.cli || "";
  const m = w.modelo ? ` ${w.modelo.charAt(0).toUpperCase()}${w.modelo.slice(1)}` : "";
  return `${marca}${m}`;
}
const nuevoId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

/** Markdown del conserje y de las sesiones, lo justo: párrafos, listas,
    títulos, tablas, citas, negrita y código. Se escapa TODO antes, así que
    nada de lo que diga el modelo es HTML. Los títulos y las tablas están
    porque las respuestas de un Claude Code van llenas: medido el 2026-10-08
    en sus sesiones de esa semana, cientos de `##` y de filas `| … |` que el
    móvil enseñaba tal cual, con las almohadillas y las barras. */
function md(texto) {
  const lineas = esc(texto).split("\n");
  const enLinea = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  let html = "", lista = null, parrafo = [], codigo = null, tabla = null, cita = null;
  const cierraParrafo = () => { if (parrafo.length) { html += `<p>${parrafo.map(enLinea).join("<br>")}</p>`; parrafo = []; } };
  const cierraLista = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const cierraTabla = () => {
    if (!tabla) return;
    const [cab, ...filas] = tabla;
    const celdas = (f, tag) => f.map((c) => `<${tag}>${enLinea(c)}</${tag}>`).join("");
    html += `<div class="tabla"><table><thead><tr>${celdas(cab, "th")}</tr></thead><tbody>${filas.map((f) => `<tr>${celdas(f, "td")}</tr>`).join("")}</tbody></table></div>`;
    tabla = null;
  };
  const cierraCita = () => { if (cita) { html += `<blockquote>${cita.map(enLinea).join("<br>")}</blockquote>`; cita = null; } };
  const cierraTodo = () => { cierraParrafo(); cierraLista(); cierraTabla(); cierraCita(); };
  for (const l of lineas) {
    if (l.trim().startsWith("```")) {
      if (codigo) { html += bloque(codigo); codigo = null; }
      else { cierraTodo(); codigo = []; }
      continue;
    }
    if (codigo) { codigo.push(l); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      cierraParrafo(); cierraLista(); cierraCita();
      // La raya de debajo de la cabecera no es una fila.
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l) && l.includes("-")) continue;
      (tabla ||= []).push(l.trim().slice(1, -1).split("|").map((c) => c.trim()));
      continue;
    }
    cierraTabla();
    const q = l.match(/^\s*&gt;\s?(.*)$/);
    if (q) { cierraParrafo(); cierraLista(); (cita ||= []).push(q[1]); continue; }
    cierraCita();
    const t = l.match(/^\s*(#{1,6})\s+(.*)$/);
    if (t) { cierraParrafo(); cierraLista(); html += t[1].length <= 2 ? `<h3>${enLinea(t[2])}</h3>` : `<h4>${enLinea(t[2])}</h4>`; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { cierraParrafo(); cierraLista(); html += "<hr>"; continue; }
    const m = l.match(/^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/);
    if (m) {
      cierraParrafo();
      const tipo = m[1] ? "ul" : "ol";
      if (lista !== tipo) { cierraLista(); html += `<${tipo}>`; lista = tipo; }
      html += `<li>${enLinea(m[3])}</li>`;
      continue;
    }
    if (!l.trim()) { cierraParrafo(); cierraLista(); continue; }
    cierraLista();
    parrafo.push(l);
  }
  if (codigo) html += bloque(codigo);
  cierraTodo();
  return html;
}

/* Un bloque de código con su «Copiar». En la terminal, el mensaje de
   compactación de un `/fin` lleva además «Compactar con esto», que deja
   `/compact <el bloque>` en la caja: es lo que Munir quería hacer desde el
   móvil el 2026-10-08 y no podía. Solo lo deja escrito; mandarlo es suyo. */
const bloque = (lineas) => {
  const compactar = e.vista === "terminal" && /^#\s*(COMPACTACI[ÓO]N|HANDOFF)\b/i.test(lineas.find((l) => l.trim()) || "");
  return `<div class="bloque"><div class="acciones">${compactar ? `<button class="compactar" type="button">${tr("Compactar con esto")}</button>` : ""}<button class="copiar" type="button">${tr("Copiar")}</button></div><pre>${lineas.join("\n")}</pre></div>`;
};
const textoDelBloque = (b) => b.closest(".bloque")?.querySelector("pre")?.textContent ?? "";

/* El «Copiar» de cualquier bloque, de cualquier vista. El portapapeles solo
   existe en una página segura (la de Tailscale lo es, va por https); si no
   está, se cae al `execCommand` de toda la vida. */
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest?.(".copiar");
  if (!b) return;
  const texto = textoDelBloque(b);
  let hecho = false;
  try { await navigator.clipboard.writeText(texto); hecho = true; } catch (_) {
    const t = document.createElement("textarea");
    t.value = texto;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;opacity:0;resize:none";
    document.body.appendChild(t);
    t.select();
    try { hecho = document.execCommand("copy"); } catch (_) {}
    t.remove();
  }
  b.textContent = hecho ? tr("Copiado") : tr("No se pudo");
  b.dataset.hecho = String(hecho);
  setTimeout(() => { b.textContent = tr("Copiar"); b.dataset.hecho = "false"; }, 1600);
});

// ─── Los adjuntos ───────────────────────────────────────────────────────────
// Munir, 2026-10-08: «que también se puedan adjuntar archivos, imágenes». Se
// suben al PC a trozos (`/api/adjuntar`, cada trozo una petición normal) y al
// mandar se añade su RUTA al texto, que es lo que lee Claude Code.

const TROZO = 45000; // el `TROZO_ADJUNTO` de movil.rs
const LADO_MAXIMO = 2048;

/* Una foto del móvil son 3-8 MB y quien la lee la reduce igual: se achica
   aquí, que por datos sube en segundos en vez de en un minuto. Lo que el
   navegador no sabe abrir (HEIC, un PDF) va tal cual. */
async function achicar(archivo) {
  if (!/^image\/(jpeg|png|webp)$/.test(archivo.type) || !window.createImageBitmap) return archivo;
  try {
    const bmp = await createImageBitmap(archivo);
    const lado = Math.max(bmp.width, bmp.height);
    if (lado <= LADO_MAXIMO && archivo.size <= 2500000) { bmp.close?.(); return archivo; }
    const k = Math.min(1, LADO_MAXIMO / lado);
    const lienzo = document.createElement("canvas");
    lienzo.width = Math.round(bmp.width * k);
    lienzo.height = Math.round(bmp.height * k);
    lienzo.getContext("2d").drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
    bmp.close?.();
    const blob = await new Promise((r) => lienzo.toBlob(r, "image/jpeg", 0.88));
    return blob ? new File([blob], `${archivo.name.replace(/\.[^.]+$/, "") || "foto"}.jpg`, { type: "image/jpeg" }) : archivo;
  } catch (_) {
    return archivo;
  }
}

function aBase64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

async function subir(archivo, progreso) {
  const f = await achicar(archivo);
  const bytes = new Uint8Array(await f.arrayBuffer());
  if (!bytes.length) throw new Error(tr("está vacío"));
  const total = Math.ceil(bytes.length / TROZO);
  const id = nuevoId();
  let ruta = null;
  for (let i = 0; i < total; i++) {
    const v = await api("POST", "/api/adjuntar", { id, nombre: f.name, parte: i, total, datos: aBase64(bytes.subarray(i * TROZO, (i + 1) * TROZO)) });
    progreso((i + 1) / total);
    if (v.ruta) ruta = v.ruta;
  }
  if (!ruta) throw new Error(tr("el PC no dijo dónde lo guardó"));
  return { ruta, nombre: f.name, imagen: f.type.startsWith("image/") ? URL.createObjectURL(f) : null };
}

/* El clip y la bandeja de una caja. `cambio` avisa para encender o apagar el
   botón de enviar; `rutas()` es lo que se añade al texto al mandarlo. */
function montarAdjuntos(caja, cambio) {
  const input = caja.querySelector('input[type="file"]');
  const bandeja = caja.querySelector(".adjuntos");
  const lista = [];
  const pintarBandeja = () => {
    bandeja.hidden = !lista.length;
    bandeja.innerHTML = lista.map((a, i) => {
      const que = a.error ? tr("No se ha subido: {e}", { e: a.error }) : a.ruta ? a.nombre : `${a.nombre} · ${Math.round(a.progreso * 100)} %`;
      return `<span class="adjunto" data-estado="${a.error ? "mal" : a.ruta ? "listo" : "subiendo"}">${a.imagen ? `<img src="${a.imagen}" alt="">` : ICONO.clip}<span class="que">${esc(que)}</span><button type="button" class="quitar" data-i="${i}" aria-label="${esc(tr("Quitar {nombre}", { nombre: a.nombre }))}">×</button></span>`;
    }).join("");
    bandeja.querySelectorAll(".quitar").forEach((b) => b.addEventListener("click", () => {
      const [a] = lista.splice(Number(b.dataset.i), 1);
      if (a?.imagen) URL.revokeObjectURL(a.imagen);
      pintarBandeja();
    }));
    cambio();
  };
  caja.querySelector(".adjuntar").addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const elegidos = [...input.files];
    input.value = "";
    for (const f of elegidos) {
      const a = { nombre: f.name, ruta: null, imagen: null, progreso: 0, error: null };
      lista.push(a);
      pintarBandeja();
      try {
        Object.assign(a, await subir(f, (p) => { a.progreso = p; pintarBandeja(); }));
      } catch (err) {
        a.error = err.message;
      }
      pintarBandeja();
    }
  });
  return {
    subiendo: () => lista.some((a) => !a.ruta && !a.error),
    // Entre comillas si la ruta lleva espacios (una carpeta de usuario con dos nombres).
    rutas: () => lista.filter((a) => a.ruta).map((a) => (/\s/.test(a.ruta) ? `"${a.ruta}"` : a.ruta)),
    vaciar: () => {
      lista.forEach((a) => a.imagen && URL.revokeObjectURL(a.imagen));
      lista.length = 0;
      pintarBandeja();
    },
  };
}

const CLIP = `<button class="adjuntar" type="button" aria-label="${tr("Adjuntar una foto o un archivo")}">${ICONO.clip}</button><input type="file" multiple hidden>`;
const conRutas = (texto, rutas) => [texto, ...rutas].filter(Boolean).join(" ");

async function api(metodo, ruta, cuerpo) {
  const cabeceras = { Authorization: `Bearer ${clave || ""}` };
  if (cuerpo) cabeceras["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch(ruta, { method: metodo, headers: cabeceras, body: cuerpo ? JSON.stringify(cuerpo) : undefined, cache: "no-store" });
  } catch (_) {
    throw new Error(tr("No llego a tu PC. ¿Está encendido, con Adeorq abierto y Tailscale activo en los dos?"));
  }
  const v = await r.json().catch(() => ({}));
  if (r.status === 401) {
    olvidarClave();
    throw new Error(delPc(v.error || "Este móvil no está emparejado."));
  }
  if (!r.ok) {
    const err = new Error(delPc(v.error) || tr("Algo ha fallado ({n}).", { n: r.status }));
    err.estado = r.status;
    throw err;
  }
  return v;
}

function olvidarClave() {
  clave = null;
  try { localStorage.removeItem(LLAVE); } catch (_) {}
  alPanel({ tipo: "adeorq:olvidar" });
  ir({ vista: "emparejar" });
}

/* Dentro del panel personal de Munir (decisión del 2026-10-08): ahí esta
   página va en un marco, y el navegador le da un almacén aparte que Brave
   vacía al cerrar la pestaña. Emparejar exige ir al PC, así que sin esto
   habría que volver a casa cada vez. La clave la guarda el panel y se la da
   al abrir; se habla SOLO con esa dirección, la misma que deja `movil.rs` en
   `frame-ancestors` (`PANEL_DE_MUNIR`). */
const PANEL = "https://munito-panel.pages.dev";
const enMarco = window.top !== window.self;
function alPanel(mensaje) {
  if (enMarco) try { window.parent.postMessage(mensaje, PANEL); } catch (_) {}
}
window.addEventListener("message", (ev) => {
  if (ev.origin !== PANEL || ev.source !== window.parent || ev.data?.tipo !== "adeorq:clave") return;
  const llegada = typeof ev.data.clave === "string" && /^[A-Za-z0-9_-]{16,128}$/.test(ev.data.clave) ? ev.data.clave : null;
  if (e.vista !== "esperando") return;
  if (llegada) {
    clave = llegada;
    try { localStorage.setItem(LLAVE, clave); } catch (_) {}
  }
  ir({ vista: clave ? "lista" : "emparejar" });
});

// ─── El estado y quien lo pinta ─────────────────────────────────────────────

let e = { vista: clave ? "lista" : enMarco ? "esperando" : "emparejar" };
let reloj = null;
// En el panel y sin clave propia: se le pide la suya, y si no contesta en un
// momento (no la tiene, o el panel es viejo) se empareja como siempre.
if (e.vista === "esperando") {
  alPanel({ tipo: "adeorq:clave?" });
  setTimeout(() => { if (e.vista === "esperando") ir({ vista: "emparejar" }); }, 1500);
}

/* El aviso de una terminal trae su panel y el arranque de Adeorq en que era
   ese panel (`/#terminal=3@<arranque>`, `sellar_aviso` en movil.rs): el PC no
   deja leer ni escribir con el de otro arranque, que el «panel 3» de anoche
   es hoy otra terminal. Uno sin arranque solo lo mandaba una versión anterior,
   así que es de antes de reiniciar: con 0, el PC dice eso mismo. */
function terminalDelAviso(hash) {
  const m = /#terminal=(\d{1,6})(?:@(\d{1,16}))?/.exec(hash);
  return m && { vista: "terminal", panel: Number(m[1]), arranque: Number(m[2] || 0) };
}

// Un toque en un aviso abre la página con `#conv=<id>`: se va a esa
// conversación y se limpia la dirección, que no es para guardarla.
{
  const m = /#conv=([A-Za-z0-9_-]{1,64})/.exec(location.hash);
  if (m && clave) e = { vista: "hilo", id: m[1] };
  // Y un aviso de una terminal («te pregunta») abre su pantalla directamente.
  const mt = terminalDelAviso(location.hash);
  if (mt && clave) e = mt;
  // El de una decisión (`ask_decision`), la decisión.
  const md = /#decision=(d[0-9a-f]{1,22})/.exec(location.hash);
  if (md && clave) e = { vista: "decision", id: md[1] };
  if (location.hash) history.replaceState(null, "", location.pathname);
}

// Con la página YA abierta, tocar un aviso no la recarga: el service worker la
// lleva a la dirección nueva y eso es solo un cambio de `#`. Se atiende igual.
window.addEventListener("hashchange", () => {
  const mc = /#conv=([A-Za-z0-9_-]{1,64})/.exec(location.hash);
  const mt = terminalDelAviso(location.hash);
  const md = /#decision=(d[0-9a-f]{1,22})/.exec(location.hash);
  if (location.hash) history.replaceState(null, "", location.pathname);
  if (!clave) return;
  if (md) ir({ vista: "decision", id: md[1] });
  else if (mt) ir(mt);
  else if (mc) ir({ vista: "hilo", id: mc[1] });
});

// ─── Los avisos, aunque la página esté cerrada ─────────────────────────────
// El service worker (`/sw.js`) recibe el aviso y lo enseña; aquí solo se pide
// permiso, se suscribe con la clave de esta app y se le manda al PC lo que
// devuelve el navegador (ver `push.rs`).

const hayPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
if (hayPush) navigator.serviceWorker.register("/sw.js").catch(() => {});

function claveAServidor(b64url) {
  const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
function aB64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function suscripcionActual() {
  if (!hayPush) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function pedirAvisos() {
  const reg = await navigator.serviceWorker.ready;
  if ((await Notification.requestPermission()) !== "granted") throw new Error(tr("Sin permiso para avisar."));
  const { clave: publica } = await api("GET", "/api/push/clave");
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: claveAServidor(publica) });
  await api("POST", "/api/push/suscribir", {
    endpoint: sub.endpoint,
    p256dh: aB64url(sub.getKey("p256dh")),
    auth: aB64url(sub.getKey("auth")),
  });
}

async function quitarAvisos() {
  const sub = await suscripcionActual();
  if (sub) await sub.unsubscribe();
  await api("POST", "/api/push/olvidar", {});
}

async function pintarAvisos() {
  const b = document.getElementById("avisos");
  // En un marco el navegador no deja pedir avisos: se ponen abriendo la página aparte.
  if (!b || !hayPush || enMarco) return;
  let puestos = false;
  try { puestos = !!(await suscripcionActual()) && Notification.permission === "granted"; } catch (_) {}
  b.hidden = false;
  b.dataset.on = String(puestos);
  b.textContent = puestos ? tr("Avisos puestos en este móvil · tocar para quitarlos") : tr("Avisarme en este móvil cuando una sesión me pregunte o termine");
  b.onclick = async () => {
    b.disabled = true;
    try {
      if (puestos) await quitarAvisos(); else await pedirAvisos();
    } catch (err) {
      b.textContent = tr("No se pudo: {e}", { e: err.message });
      b.disabled = false;
      return;
    }
    b.disabled = false;
    pintarAvisos();
  };
}

// ─── Llevarla como una app ──────────────────────────────────────────────────
// Chrome, Edge y Brave avisan de que la página se puede instalar: se guarda el
// aviso y la lista enseña el botón. Safari no avisa nunca (allí es Compartir >
// Añadir a la pantalla de inicio), así que en un iPhone no sale nada.
let instalable = null;
window.addEventListener("beforeinstallprompt", (ev) => {
  ev.preventDefault();
  instalable = ev;
  pintarInstalar();
});
window.addEventListener("appinstalled", () => { instalable = null; pintarInstalar(); });

function pintarInstalar() {
  const b = document.getElementById("instalar");
  if (!b) return;
  b.hidden = !instalable || enMarco;
  b.onclick = async () => {
    const aviso = instalable;
    if (!aviso) return;
    instalable = null;
    aviso.prompt();
    await aviso.userChoice.catch(() => {});
    pintarInstalar();
  };
}

/* El nombre con el que sale en Ajustes > Móvil, para saber luego cuál quitar:
   sistema y navegador, que es lo que distingue el móvil del portátil. */
function nombreSugerido() {
  const ua = navigator.userAgent;
  const sistema = /Android/i.test(ua) ? "Android" : /iPhone/i.test(ua) ? "iPhone" : /iPad/i.test(ua) ? "iPad"
    : /Windows/i.test(ua) ? "Windows" : /Mac OS X/i.test(ua) ? "Mac" : /Linux/i.test(ua) ? "Linux" : tr("Móvil");
  const navegador = navigator.brave ? "Brave" : /EdgA?\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung"
    : /Firefox\/|FxiOS/.test(ua) ? "Firefox" : /Chrome\/|CriOS/.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "";
  return navegador ? `${sistema} · ${navegador}` : sistema;
}

// ─── El cajón ───────────────────────────────────────────────────────────────
/* La cabina en el bolsillo (Munir, 2026-10-15: «como la app de Claude, el
   layout»). Como el cajón de esa app, sale por la izquierda y tapa lo demás:
   arriba a dónde ir (el conserje, las terminales, las decisiones) y debajo lo
   reciente, cada terminal con su punto de estado y cada conversación. Vive
   fuera de #app, así que repintar una pantalla no lo cierra ni lo rehace; y
   cerrado es `inert`, para que sus botones no se toquen ni se lean de fuera. */
document.body.insertAdjacentHTML("beforeend", `<div class="cajon-velo" id="cajon-velo"></div><nav class="cajon" id="cajon" aria-label="Adeorq"></nav>`);
const cajon = document.getElementById("cajon");
cajon.inert = true;
let delCajon = null;
/* Cuántas decisiones te esperan, para el globito del botón del cajón: lo
   apunta quien las lee (la portada, el cajón, Decisiones) y cada pantalla
   nueva nace ya con él. */
let esperanAhora = 0;
const botonCajon = () =>
  `<button class="atras" id="abrir-cajon" aria-label="${tr("Abrir el menú")}">${ICONO.menu}<b class="cuenta-dec globo" id="cuenta-dec"${esperanAhora ? "" : " hidden"}>${esperanAhora || ""}</b></button>`;
function ponerEsperan(n) {
  esperanAhora = n;
  const c = document.getElementById("cuenta-dec");
  if (!c) return;
  c.hidden = !n;
  c.textContent = n ? String(n) : "";
  c.setAttribute("aria-label", tr("{n} te esperan", { n }));
}
function montarBotonCajon() {
  document.getElementById("abrir-cajon")?.addEventListener("click", () => abrirCajon());
}
function abrirCajon() {
  if (!clave) return;
  pintarCajon();
  document.body.dataset.cajon = "";
  cajon.inert = false;
  clearInterval(vigiaCajon);
  vigiaCajon = setInterval(refrescarCajon, 4000);
  Promise.all([
    api("GET", "/api/terminales").catch((err) => ({ fallo: err.message })),
    api("GET", "/api/lista").catch(() => []),
    api("GET", "/api/decisiones").catch(() => null),
  ]).then(([vt, lista, vd]) => {
    delCajon = { vt, lista, decisiones: vd?.decisiones || [] };
    if (vd) ponerEsperan(vivas(delCajon.decisiones).length + preguntanDe(vt).length);
    if (document.body.dataset.cajon !== undefined) pintarCajon();
  });
}
function cerrarCajon() {
  delete document.body.dataset.cajon;
  cajon.inert = true;
  clearInterval(vigiaCajon);
}
/* Con el cajón abierto, cada pocos segundos se mira otra vez cómo van las
   terminales, para que el proyecto que se pone a trabajar suba a la vista. Solo
   se repinta si cambió algo, y nunca justo cuando lo tocas o lo deslizas: una
   fila rehecha bajo el dedo se come el toque. */
let vigiaCajon = null;
let tocadoCajon = 0;
cajon.addEventListener("pointerdown", () => { tocadoCajon = Date.now(); }, { passive: true });
cajon.addEventListener("scroll", () => { tocadoCajon = Date.now(); }, { passive: true, capture: true });
function refrescarCajon() {
  if (document.body.dataset.cajon === undefined || !delCajon) return;
  Promise.all([api("GET", "/api/terminales"), api("GET", "/api/lista").catch(() => delCajon?.lista || [])]).then(([vt, lista]) => {
    if (document.body.dataset.cajon === undefined || !delCajon || Date.now() - tocadoCajon < 1200) return;
    const antes = JSON.stringify([delCajon.vt, delCajon.lista]);
    delCajon = { ...delCajon, vt, lista };
    if (JSON.stringify([vt, lista]) === antes) return;
    const y = cajon.querySelector(".recientes")?.scrollTop ?? 0;
    pintarCajon();
    const r = cajon.querySelector(".recientes");
    if (r) r.scrollTop = y;
  }, () => {});
}
/* Lo reciente del cajón, por proyecto y con lo último que usaste arriba (Munir,
   2026-10-16: «que las sesiones o chats que se usen pasen arriba del panel de
   la izquierda y estén agrupados en proyectos»). Usar es abrirla o escribirle
   desde este móvil (`apuntarUso`); una conversación cuenta también su último
   mensaje. El proyecto de una conversación es el de su última sesión.
   Y lo que TRABAJA cuenta como usado ahora mismo (el mismo día: «que se vaya
   moviendo el que está activo arriba, y si deja de estarlo se queda arriba
   hasta que otro lo esté»): una terminal trabajando vale «ahora», y una que
   paró, la última vez que escribió en su transcript (`activo`, lo dice el PC
   aunque el móvil estuviera apagado). */
/* Lo que escribes y no mandas, guardado por sitio (Munir, 2026-10-16: «que el
   texto que escribas en el modo chat, si te vas a otra terminal o sitio, no se
   borre»): cada terminal y cada conversación tiene el suyo hasta que lo mandas.
   Devuelve con qué guardarlo cuando el texto cambia sin teclear (al mandarlo,
   al mejorarlo). */
const BORRADORES = "adeorq-movil-borradores";
function borrador(clave, caja) {
  const guardado = leerGuardado(BORRADORES)[clave];
  if (guardado?.texto && !caja.value) caja.value = guardado.texto;
  const guardar = () => {
    const todos = leerGuardado(BORRADORES);
    if (caja.value.trim()) todos[clave] = { texto: caja.value, cuando: Date.now() };
    else delete todos[clave];
    // Con tope: los más viejos se olvidan.
    for (const k of Object.keys(todos).sort((a, b) => todos[b].cuando - todos[a].cuando).slice(40)) delete todos[k];
    try { localStorage.setItem(BORRADORES, JSON.stringify(todos)); } catch (_) {}
  };
  caja.addEventListener("input", guardar);
  return guardar;
}
const USADOS = "adeorq-movil-usados";
// Los proyectos que tocaste para plegar o desplegar: lo tuyo manda sobre lo de
// fábrica (abierto solo el de lo que tienes delante).
const PLEGADOS = "adeorq-movil-plegados";
/* El proyecto de una carpeta: lo que cuelga de la carpeta madre del PC
   (`raiz` en `/api/terminales`), como en su barra; lo abierto en la madre
   misma va a «Sueltas», como allí. Fuera de ella, la última carpeta. */
function proyectoDe(carpeta, raiz) {
  const c = String(carpeta || "").replace(/[\\/]+$/, "");
  const r = String(raiz || "").replace(/[\\/]+$/, "");
  if (!c) return { clave: "", nombre: tr("Conversaciones"), logo: "" };
  const bajo = r && c.toLowerCase().startsWith(r.toLowerCase());
  if (bajo && c.length === r.length) return { clave: "~sueltas", nombre: tr("Sueltas"), logo: "" };
  if (bajo && /[\\/]/.test(c[r.length])) {
    const nombre = c.slice(r.length + 1).split(/[\\/]/)[0];
    return { clave: nombre, nombre, logo: nombre };
  }
  const h = hoja(c);
  return { clave: h, nombre: h, logo: "" };
}
// El color de la inicial de un proyecto sin logo: siempre el mismo para el mismo nombre.
const tonoDe = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
/* Los logos, uno por proyecto y una vez por visita: los sirve el PC
   (`/api/logo`, el mismo de su barra) y se guardan aquí como enlace al dibujo. */
const logos = new Map();
function ponerLogos(raizEl) {
  raizEl.querySelectorAll(".p-logo[data-logo]").forEach((el) => {
    const nombre = el.dataset.logo;
    if (!logos.has(nombre)) {
      logos.set(nombre, fetch(`/api/logo?proyecto=${encodeURIComponent(nombre)}`, { headers: { Authorization: `Bearer ${clave || ""}` } })
        .then((r) => (r.ok ? r.blob() : null))
        .then((b) => (b ? new Promise((listo) => {
          const url = URL.createObjectURL(b);
          const img = new Image();
          img.onload = () => {
            // Como `ProjectAvatar` en el PC: se mide si el dibujo es oscuro.
            let oscuro = false;
            try {
              const cv = document.createElement("canvas");
              cv.width = cv.height = 16;
              const cx = cv.getContext("2d", { willReadFrequently: true });
              cx.drawImage(img, 0, 0, 16, 16);
              const d = cx.getImageData(0, 0, 16, 16).data;
              let suma = 0, vistos = 0;
              for (let i = 0; i < d.length; i += 4) {
                if (d[i + 3] < 40) continue;
                suma += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
                vistos++;
              }
              oscuro = vistos > 0 && suma / vistos < 70;
            } catch (_) {}
            listo({ url, oscuro });
          };
          img.onerror = () => listo(null);
          img.src = url;
        }) : null))
        .catch(() => null));
    }
    logos.get(nombre).then((l) => {
      if (!l || !el.isConnected) return;
      el.dataset.conLogo = "";
      if (l.oscuro) el.dataset.oscuro = "";
      el.innerHTML = `<img src="${l.url}" alt="">`;
    });
  });
}
function apuntarUso(clave) {
  const u = leerGuardado(USADOS);
  u[clave] = Date.now();
  // Con tope: lo más viejo se olvida.
  const llaves = Object.keys(u).sort((a, b) => u[b] - u[a]);
  for (const k of llaves.slice(150)) delete u[k];
  try { localStorage.setItem(USADOS, JSON.stringify(u)); } catch (_) {}
}
function recientesHtml(terminales, lista, arranque, aqui, raiz) {
  const u = leerGuardado(USADOS);
  const plegados = leerGuardado(PLEGADOS);
  const cosas = [
    ...terminales.map((t) => ({ t, p: proyectoDe(t.carpeta, raiz), uso: Math.max(u[`t:${arranque}:${t.panel}`] || 0, Number(t.activo) || 0, estaTrabajando(t) ? Date.now() : 0), vivo: estaTrabajando(t) ? 1 : 0, n: t.panel, aqui: aqui("terminal", t.panel) })),
    ...lista.slice(0, 20).map((f) => ({ f, p: proyectoDe(f.carpeta, raiz), uso: Math.max(u[`c:${f.id}`] || 0, (f.cuando || 0) * 1000), vivo: 0, n: 0, aqui: aqui("hilo", f.id) })),
  ];
  if (!cosas.length) return "";
  const grupos = new Map();
  for (const c of cosas) {
    if (!grupos.has(c.p.clave)) grupos.set(c.p.clave, []);
    grupos.get(c.p.clave).push(c);
  }
  const orden = (a, b) => b.uso - a.uso || b.vivo - a.vivo || a.n - b.n;
  const fila = (c) => c.t
    ? `<button class="fila${c.vivo ? " hilo" : ""}" data-panel="${c.t.panel}" aria-current="${c.aqui}">${ICONO.terminal}<b>${esc(c.t.nombre)}</b><i class="punto" data-tono="${estadoTerminal(c.t)[1]}"></i></button>`
    : `<button class="fila" data-conv="${esc(c.f.id)}" aria-current="${c.aqui}">${ICONO.chat}<b>${esc(c.f.titulo || tr("Conversación nueva"))}</b><span>${esc(hace(c.f.cuando))}</span></button>`;
  // Plegado, el punto dice si dentro hay algo que te reclama o que trabaja.
  const RECLAMA = ["pregunta", "trabajando", "termino"];
  const cabeza = (p, lo, abierto) => {
    const tonos = lo.filter((c) => c.t).map((c) => estadoTerminal(c.t)[1]);
    const tono = RECLAMA.find((x) => tonos.includes(x));
    const logo = p.clave === "~sueltas" ? `<span class="p-logo" data-suelta aria-hidden="true">↯</span>`
      : `<span class="p-logo"${p.logo ? ` data-logo="${esc(p.logo)}"` : ""} style="--c:${tonoDe(p.nombre)}" aria-hidden="true">${esc([...p.nombre][0]?.toUpperCase() || "·")}</span>`;
    return `<button class="proyecto" data-proyecto="${esc(p.clave)}" aria-expanded="${abierto}">${logo}<b>${esc(p.nombre)}</b>${tono ? `<i class="punto" data-tono="${tono}"></i>` : ""}<span class="p-cuenta">${lo.length}</span><svg class="flecha" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`;
  };
  return [...grupos.values()]
    .map((lo) => lo.sort(orden))
    .sort((a, b) => orden(a[0], b[0]))
    .map((lo) => {
      const p = lo[0].p;
      // De fábrica, abierto solo el de lo que tienes delante; luego, lo que elijas.
      const abierto = p.clave in plegados ? !plegados[p.clave] : lo.some((c) => c.aqui);
      return `<div class="grupo-proy">${cabeza(p, lo, abierto)}<div class="p-filas"${abierto ? "" : " hidden"}>${lo.map(fila).join("")}</div></div>`;
    })
    .join("");
}

function pintarCajon() {
  const d = delCajon || { vt: {}, lista: [], decisiones: [] };
  const terminales = (d.vt.terminales || []).slice().sort((a, b) => Number(b.agente) - Number(a.agente) || a.panel - b.panel);
  const esperan = vivas(d.decisiones).length + preguntanDe(d.vt).length;
  const aqui = (vista, k) => e.vista === vista && (k === undefined || e.panel === k || e.id === k);
  cajon.innerHTML = `
    <div class="marca">${ICONO.logo}<b>Adeorq</b></div>
    <div class="menu">
      <button class="fila" data-ir="lista" aria-current="${aqui("lista") || aqui("hilo")}">${ICONO.chat}<b>${tr("Conserje")}</b></button>
      <button class="fila" data-ir="terminales" aria-current="${aqui("terminales")}">${ICONO.terminal}<b>${tr("Terminales")}</b>${terminales.length ? `<span>${terminales.length}</span>` : ""}</button>
      <button class="fila" data-ir="decisiones" aria-current="${aqui("decisiones") || aqui("decision")}">${ICONO.decision}<b>${tr("Decisiones")}</b>${esperan ? `<span class="cuenta-dec">${esperan}</span>` : ""}</button>
      <button class="fila" data-ir="programados" aria-current="${aqui("programados")}">${ICONO.reloj}<b>${tr("Programados")}</b></button>
      <button class="fila" data-ir="uso" aria-current="${aqui("uso")}">${ICONO.uso}<b>${tr("Uso")}</b></button>
    </div>
    <div class="recientes">${recientesHtml(terminales, d.lista, d.vt.arranque, aqui, d.vt.raiz)}</div>
    <div class="pc"><i class="punto" ${d.vt.fallo ? "data-mal" : 'data-tono="trabajando"'}></i><span>${d.vt.fallo ? tr("Tu PC no contesta") : tr("Tu PC, conectado")}</span><button class="a-ajustes" data-ir="ajustes" aria-current="${aqui("ajustes")}">${ICONO.ajustes}<b>${tr("Ajustes")}</b></button></div>
    <button class="nuevo-encargo" id="nuevo-encargo">${ICONO.mas}${tr("Nuevo encargo")}</button>`;
  ponerLogos(cajon);
}
cajon.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.classList.contains("proyecto")) {
    const abierto = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", String(abierto));
    b.nextElementSibling.hidden = !abierto;
    const p = leerGuardado(PLEGADOS);
    p[b.dataset.proyecto] = !abierto;
    try { localStorage.setItem(PLEGADOS, JSON.stringify(p)); } catch (_) {}
    return;
  }
  if (b.dataset.ir) return ir({ vista: b.dataset.ir });
  if (b.dataset.panel) return ir({ vista: "terminal", panel: Number(b.dataset.panel), arranque: delCajon?.vt?.arranque });
  if (b.dataset.conv) return ir({ vista: "hilo", id: b.dataset.conv });
  if (b.id === "nuevo-encargo") {
    // Sin la caja en el inicio (Ajustes), una conversación nueva con la suya.
    if (!misAjustes().caja) return ir({ vista: "hilo", id: nuevoId() });
    ir({ vista: "lista" });
    document.getElementById("decir")?.focus();
  }
});
document.getElementById("cajon-velo").addEventListener("click", () => cerrarCajon());
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && document.body.dataset.cajon !== undefined) cerrarCajon(); });
/* Deslizar desde el borde izquierdo lo abre y deslizar hacia la izquierda lo
   cierra, como en la app de Claude. Solo con el móvil emparejado. */
let dedoX = null;
document.addEventListener("touchstart", (ev) => {
  const x = ev.touches[0].clientX;
  const abierto = document.body.dataset.cajon !== undefined;
  dedoX = clave && (abierto || x < 24) && !["emparejar", "esperando"].includes(e.vista) ? x : null;
}, { passive: true });
document.addEventListener("touchend", (ev) => {
  if (dedoX === null) return;
  const dx = ev.changedTouches[0].clientX - dedoX;
  const abierto = document.body.dataset.cajon !== undefined;
  if (dx > 60 && !abierto) abrirCajon();
  if (dx < -60 && abierto) cerrarCajon();
  dedoX = null;
}, { passive: true });

// ─── Mantener pulsada una conversación ──────────────────────────────────────
/* En el inicio y en el cajón, mantener pulsada una conversación saca lo que se
   puede hacer con ella (hoy, borrarla), como en la app de Claude. Las de prueba
   («hola») se iban acumulando sin forma de quitarlas (Munir, 2026-10-15). Vale
   el menú del sistema (`contextmenu`, que Chrome lanza al mantener pulsado) y,
   por si un navegador no lo lanza, un reloj propio de medio segundo. */
const CONVERSACION = "#filas .fila[data-id], #cajon .fila[data-conv]";
let sinClicHasta = 0;
function hojaConversacion(id, titulo) {
  if (document.getElementById("hoja")) return;
  sinClicHasta = Date.now() + 700;
  document.body.insertAdjacentHTML("beforeend", `
    <div class="hoja-velo" id="hoja-velo"></div>
    <div class="hoja" id="hoja" role="dialog" aria-label="${esc(titulo)}">
      <p id="hoja-titulo">${esc(titulo)}</p>
      <button class="peligro" id="hoja-borrar">${ICONO.papelera}${tr("Borrar conversación")}</button>
      <button id="hoja-cancelar">${tr("Cancelar")}</button>
    </div>`);
  const cerrar = () => {
    document.getElementById("hoja-velo")?.remove();
    document.getElementById("hoja")?.remove();
  };
  document.getElementById("hoja-velo").addEventListener("click", cerrar);
  document.getElementById("hoja-cancelar").addEventListener("click", cerrar);
  document.getElementById("hoja-borrar").addEventListener("click", async () => {
    try {
      await api("POST", "/api/olvidar", { id });
    } catch (err) {
      document.getElementById("hoja-titulo").textContent = tr("No se pudo borrar: {e}", { e: err.message });
      return;
    }
    cerrar();
    document.querySelectorAll(`#filas .fila[data-id="${CSS.escape(id)}"]`).forEach((f) => f.remove());
    if (delCajon) {
      delCajon.lista = delCajon.lista.filter((f) => f.id !== id);
      if (document.body.dataset.cajon !== undefined) pintarCajon();
    }
    if (e.vista === "hilo" && e.id === id) ir({ vista: "lista" });
  });
}
const pulsada = (f) => hojaConversacion(f.dataset.id || f.dataset.conv, f.querySelector("b")?.textContent || "");
document.addEventListener("contextmenu", (ev) => {
  const f = ev.target.closest?.(CONVERSACION);
  if (!f) return;
  ev.preventDefault();
  pulsada(f);
});
let largo = null;
document.addEventListener("pointerdown", (ev) => {
  const f = ev.target.closest?.(CONVERSACION);
  if (!f) return;
  const [x, y] = [ev.clientX, ev.clientY];
  const quieto = (m) => Math.abs(m.clientX - x) < 10 && Math.abs(m.clientY - y) < 10;
  largo = { t: setTimeout(() => pulsada(f), 550), quieto };
});
document.addEventListener("pointermove", (ev) => { if (largo && !largo.quieto(ev)) { clearTimeout(largo.t); largo = null; } }, { passive: true });
for (const fin of ["pointerup", "pointercancel"]) document.addEventListener(fin, () => { if (largo) { clearTimeout(largo.t); largo = null; } });
// El dedo que se levanta tras mantener pulsado no abre además la conversación.
document.addEventListener("click", (ev) => {
  if (Date.now() < sinClicHasta && ev.target.closest?.(CONVERSACION)) {
    ev.preventDefault();
    ev.stopPropagation();
  }
}, true);

/* `atras` dice por dónde entra la pantalla nueva: hacia delante por la
   derecha, de vuelta por la izquierda. Volver a la portada siempre es volver. */
function ir(cambio, atras = cambio.vista === "lista") {
  clearTimeout(reloj);
  cerrarCajon();
  e = { vista: cambio.vista, ...cambio };
  app.dataset.sentido = atras ? "atras" : "adelante";
  pintar();
}

function sondear(ms, fn) {
  clearTimeout(reloj);
  reloj = setTimeout(async () => {
    if (document.visibilityState === "visible") await fn().catch(() => {});
    sondear(ms, fn);
  }, ms);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && e.vista === "hilo") cargarHilo().catch(() => {});
});

/* El aspecto del PC (acento y foto) se pregunta una vez por visita, en cuanto
   hay clave: hasta entonces vale lo que se guardó la vez anterior. */
let delPcTraido = false;
function pintar() {
  if (clave && !delPcTraido) {
    delPcTraido = true;
    traerDelPc().catch(() => { delPcTraido = false; });
  }
  if (e.vista === "esperando") { app.innerHTML = `<p class="vacio">${tr("Conectando con tu PC…")}</p>`; return; }
  if (e.vista === "emparejar") return pintarEmparejar();
  if (e.vista === "lista") return pintarLista();
  if (e.vista === "hilo") return pintarHiloEntero();
  if (e.vista === "sesion") return pintarSesion();
  if (e.vista === "terminales") return pintarTerminales();
  if (e.vista === "terminal") return pintarTerminal();
  if (e.vista === "decisiones") return pintarDecisiones();
  if (e.vista === "programados") return pintarProgramados();
  if (e.vista === "uso") return pintarUso();
  if (e.vista === "ajustes") return pintarAjustes();
  if (e.vista === "decision") return pintarDecision();
}

// ─── La lista ───────────────────────────────────────────────────────────────

/* El ánimo de la mascota de la portada, que es el de todo tu PC de un vistazo:
   la misma cuenta que hace la campana del escritorio (`animoDe`, lib/campana.ts). */
function animoDeTodo(terminales, esperan) {
  if (esperan || terminales.some((t) => estadoTerminal(t)[1] === "pregunta")) return "espera";
  if (terminales.some((t) => t.estado === "a_medias")) return "trabaja";
  if (terminales.some((t) => t.estado === "lista")) return "lista";
  return terminales.length ? "quieta" : "dormida";
}

/* La portada es una bandeja: arriba lo que te reclama (las decisiones que
   siguen vivas y las terminales que te preguntan), debajo cómo va cada
   terminal, y al final lo hablado con el conserje. Antes había que entrar en
   «Tus terminales» y en «Decisiones» para saber si pasaba algo. */
/** Adeo en la portada es grande: es quien te recibe y dice cómo va el PC de un vistazo. */
const MASC_PORTADA = 72;
async function pintarLista() {
  // Vuelve con el ánimo que tenía: si nace quieta y a los dos segundos se
  // entera de que te esperan, repetía el susto cada vez que volvías a la portada.
  const animoPortada = marchas.get("portada")?.animo || "quieta";
  // Las secciones van en el orden de Ajustes; las que quitaste siguen ahí,
  // escondidas, que la vuelta de `mirar` las rellena igual (y el globito).
  const a = misAjustes();
  const trozos = {
    saludo: `<div class="saludo">
          <span id="masc-portada">${mascota(animoPortada, MASC_PORTADA, "portada")}</span>
          <h2>${tr("Buenas.")}</h2>
          <p id="yo">${tr("tu PC")}</p>
        </div>`,
    reclaman: `<div id="reclaman"></div>`,
    marcha: `<div id="portada-term"></div>`,
    conversaciones: `<div id="filas" data-rotulo="${tr("Conversaciones")}"></div>`,
  };
  app.innerHTML = `
    <div class="vista">
      <header class="barra">${botonCajon()}<h1>Adeorq</h1></header>
      <main class="cuerpo">
        ${a.inicio.map((s) => (a.ocultas.includes(s) ? trozos[s].replace("<div ", "<div hidden ") : trozos[s])).join("")}
      </main>
      <footer class="caja"${a.caja ? "" : " hidden"}>
        <div class="fila-caja decir" id="nueva">
          <textarea id="decir" rows="1" placeholder="${tr("Dile al conserje qué hay que hacer")}" aria-label="${tr("Mensaje nuevo al conserje")}"></textarea>
          <div class="mandos"><span class="hueco"></span><button class="enviar" id="decir-enviar" aria-label="${tr("Enviar al conserje")}" disabled>${ICONO.subir}</button></div>
        </div>
      </footer>
    </div>`;
  montarBotonCajon();
  /* Al conserje se le escribe desde aquí mismo: antes esto era un botón que
     abría la conversación, y había que tocar otra vez para empezar a escribir.
     Lo que mandas abre su conversación ya con tu mensaje saliendo. */
  const decir = document.getElementById("decir");
  const decirB = document.getElementById("decir-enviar");
  decir.addEventListener("input", () => {
    decir.style.height = "auto";
    decir.style.height = `${Math.min(decir.scrollHeight, 120)}px`;
    decirB.disabled = !decir.value.trim();
  });
  decirB.addEventListener("click", () => {
    const texto = decir.value.trim();
    if (texto) ir({ vista: "hilo", id: nuevoId(), alEntrar: texto });
  });
  // Lo que te reclama y cómo va cada terminal. Solo se repinta si cambió.
  let pintado = null;
  let animo = animoPortada;
  const mirar = async () => {
    const [vd, vt] = await Promise.all([
      api("GET", "/api/decisiones").catch(() => null),
      api("GET", "/api/terminales").catch((err) => ({ fallo: err.message })),
    ]);
    const reclaman = document.getElementById("reclaman");
    if (!reclaman) return;
    const decisiones = vd?.decisiones || [];
    const esperan = vivas(decisiones);
    const terminales = (vt.terminales || []).slice().sort((a, b) => Number(b.agente) - Number(a.agente) || a.panel - b.panel);
    const preguntan = terminales.filter((t) => estadoTerminal(t)[1] === "pregunta");
    // «En marcha» es lo que está trabajando AHORA (Munir, 2026-10-15): las que
    // terminaron o están quietas viven en «Terminales», en el cajón.
    const enMarcha = terminales.filter(estaTrabajando);

    // La cuenta del globito: las que te esperan DE VERDAD, y lo que te
    // preguntan las terminales. Las demás no suman ni se dicen: se limpian solas.
    ponerEsperan(esperan.length + preguntan.length);

    const nuevo = animoDeTodo(terminales, esperan.length);
    if (nuevo !== animo) {
      animo = nuevo;
      document.getElementById("masc-portada").innerHTML = mascota(animo, MASC_PORTADA, "portada");
    }
    const yo = document.getElementById("yo");
    const trabajan = terminales.filter((t) => t.estado === "a_medias").length;
    const teLlaman = esperan.length + preguntan.length;
    yo.textContent = vt.fallo ? tr("tu PC no contesta")
      : [teLlaman ? plural(teLlaman, tr("1 cosa te espera"), tr("{n} cosas te esperan")) : "",
        trabajan ? plural(trabajan, tr("1 agente trabajando"), tr("{n} agentes trabajando")) : ""].filter(Boolean).join(" · ")
        || (terminales.length ? tr("todo tranquilo") : tr("sin terminales abiertas"));

    // Con el arranque: si Adeorq se reinicia, los botones se rehacen con el nuevo.
    const firma = JSON.stringify([esperan, terminales, vt.fallo || "", vt.arranque]);
    if (firma === pintado) return;
    const primera = pintado === null;
    pintado = firma;
    const filaTerminal = (t) => {
      const [palabra, tono] = estadoTerminal(t);
      return `<button class="fila fila-t${tono === "trabajando" ? " hilo" : ""}" data-panel="${t.panel}"><i class="punto" data-tono="${tono}"></i><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><span>${palabra}</span></button>`;
    };
    // Filas como las de Terminales, no tarjetas (Munir, 2026-10-16: «no me
    // gustan estas tarjetas»): qué es, de dónde y cuándo debajo, y su punto.
    const nueva = primera ? "" : " nuevo";
    const filaDecision = (d) => `<button class="fila fila-term${nueva}" data-id="${esc(d.id)}" data-estado="pregunta">
        <span class="avatar">${ICONO.decision}</span>
        <span class="quien"><b>${esc(d.titulo)}</b><small>${esc([d.proyecto, plural(d.preguntas, tr("1 pregunta"), tr("{n} preguntas")), hace(d.creada / 1000)].filter(Boolean).join(" · "))}</small></span>
        <i class="punto" data-tono="pregunta"></i>
      </button>`;
    const filaPregunta = (t) => `<button class="fila fila-term${nueva}" data-panel="${t.panel}" data-estado="pregunta">
        <span class="avatar${t.agente ? "" : " consola"}">${t.agente ? ICONO.chat : ICONO.terminal}</span>
        <span class="quien"><b>${esc(t.nombre)} · ${esc(hoja(t.carpeta))}</b><small>${estadoTerminal(t)[0]}</small></span>
        <i class="punto" data-tono="pregunta"></i>
      </button>`;
    reclaman.innerHTML = teLlaman
      ? `<h2 class="seccion"><span>${tr("Te esperan")}</span></h2><div class="grupo">${esperan.map(filaDecision).join("")}${preguntan.map(filaPregunta).join("")}</div>`
      : "";
    document.getElementById("portada-term").innerHTML = vt.fallo
      ? `<h2 class="seccion"><span>${tr("Terminales")}</span></h2><p class="seccion-nota">${esc(vt.fallo)}</p>`
      : enMarcha.length
        ? `<h2 class="seccion"><span>${tr("En marcha")}</span></h2><div class="grupo">${enMarcha.slice(0, 5).map(filaTerminal).join("")}${enMarcha.length > 5 ? `<p class="seccion-nota">${tr("y {n} más, en «Terminales».", { n: enMarcha.length - 5 })}</p>` : ""}</div>`
        : "";
    reclaman.querySelectorAll(".fila[data-id]").forEach((b) => b.addEventListener("click", () => ir({ vista: "decision", id: b.dataset.id, volver: "lista" })));
    document.querySelectorAll("#reclaman [data-panel], #portada-term [data-panel]").forEach((b) => b.addEventListener("click", () => ir({ vista: "terminal", panel: Number(b.dataset.panel), arranque: vt.arranque, volver: "lista" })));
  };
  mirar().catch(() => {});
  const cargar = async () => {
    const lista = await api("GET", "/api/lista");
    const filas = document.getElementById("filas");
    if (!filas) return;
    filas.innerHTML = lista.length
      ? lista.map((f) => `<button class="fila" data-id="${esc(f.id)}"><b>${esc(f.titulo || tr("Conversación nueva"))}</b><span>${esc(hace(f.cuando))}${f.trabajos ? ` · ${f.trabajos === 1 ? tr("1 sesión") : tr("{n} sesiones", { n: f.trabajos })}` : ""}</span></button>`).join("")
      : `<p class="vacio">${a.caja ? tr("Todavía no has hablado con el conserje. Escríbele en la caja de abajo.") : tr("Todavía no has hablado con el conserje. Empieza con «Nuevo encargo», en el menú.")}</p>`;
    filas.querySelectorAll(".fila").forEach((b) => b.addEventListener("click", () => ir({ vista: "hilo", id: b.dataset.id })));
  };
  try { await cargar(); } catch (err) {
    // Un 401 ya ha cambiado de vista (`olvidarClave`): entonces no hay dónde pintarlo.
    const filas = document.getElementById("filas");
    if (filas) filas.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  // Cada seis segundos: es la bandeja de lo que te reclama, y son tres
  // respuestas pequeñas. La lista de conversaciones va en la misma vuelta.
  sondear(6000, () => Promise.all([cargar(), mirar()]));
}

// ─── El hilo ────────────────────────────────────────────────────────────────

  // Entrar es usarla: sube arriba en el cajón (`recientesHtml`).
  apuntarUso(`c:${e.id}`);
  app.innerHTML = `
    <div class="vista">

        <div class="adjuntos" hidden></div>
        <div class="fila-caja">

            <option value="haiku">${tr("Sesiones: {m}", { m: "Claude Haiku" })}</option>

  texto.addEventListener("input", () => {

    e.antes = null;

  document.getElementById("enviar").addEventListener("click", () => (e.enCurso?.pensando ? parar() : enviar()));
  document.getElementById("mejorar").addEventListener("click", mejorar);
  document.getElementById("router").addEventListener("click", alternarRouter);
  document.getElementById("cerebro").addEventListener("change", (ev) => elegirCerebro(ev.target.value));
  document.getElementById("fijo").addEventListener("change", (ev) => elegirFijo(ev.target.value));
  e.crecer = crecer;

  crecer();
  e.adj = montarAdjuntos(document.getElementById("caja"), () => pintarCaja());
  pintarHilo();
  pintarCaja();

  // tu mensaje ya de camino.
  if (e.alEntrar) {
    const primero = e.alEntrar;

async function cargarHilo() {
  const v = await api("GET", `/api/conversacion?id=${encodeURIComponent(e.id)}`);
  if (e.vista !== "hilo") return;
  e.conv = v.conversacion;
  e.vivo = v.vivo || {};
  e.enCurso = e.vivo.en_curso || null;
  if (e.pendiente && e.conv.turnos.some((t) => t.rol === "tu" && t.texto === e.pendiente)) {
    if (!e.enCurso || !e.enCurso.pensando) e.pendiente = null;
  }
  pintarHilo();
  pintarCaja();
  // Deprisa mientras piensa o alguna sesión trabaja; despacio si todo está quieto.
  const trabaja = Object.values(e.vivo.estados || {}).some((x) => x === "trabajando");
  sondear(e.enCurso?.pensando || e.pendiente ? 2000 : trabaja ? 4000 : 10000, cargarHilo);
}

function tarjeta(w, ent) {
  const estado = (e.vivo?.estados || {})[claveDe(w)] || "cerrada";
  const porque = w.eligio === "router" ? `<b>${tr("Lo eligió el router.")}</b> ${esc(w.porque)}` : `<b>${tr("Elegido por ti: el router estaba apagado.")}</b>`;
  const encargo = w.encargo.length > 180 ? `${w.encargo.slice(0, 180)}…` : w.encargo;
  return `<button class="tarjeta${ent.de(`w${claveDe(w)}`)}" data-estado="${estado}" data-clave="${esc(claveDe(w))}">
    <span class="tarjeta-cab"><b>${esc(hoja(w.carpeta))} · ${esc(nombreDe(w))}</b><span class="estado"><i></i>${PALABRA[estado] || estado}</span></span>
    <span class="para">${esc(encargo)}</span>
    <span class="porque">${porque}</span>
  </button>`;
}

function pintarHilo() {
  const hilo = document.getElementById("hilo");
  if (!hilo) return;
  const conv = e.conv;
  const titulo = document.getElementById("titulo");
  if (conv) {
    const vivas = conv.trabajos.filter((w) => !w.soltado && (e.vivo?.estados || {})[claveDe(w)] && (e.vivo.estados[claveDe(w)] !== "cerrada")).length;
    titulo.innerHTML = `${esc(conv.titulo || tr("Conserje"))}<small>${vivas === 0 ? tr("nada en marcha") : vivas === 1 ? tr("1 sesión en marcha") : tr("{n} sesiones en marcha", { n: vivas })} · ${conv.router ? tr("el router elige el de cada sesión") : tr("el router está apagado")}</small>`;
  }
  const abajo = hilo.scrollHeight - hilo.scrollTop - hilo.clientHeight < 60;
  let html = "";
  if (conv && !conv.turnos.length && !e.pendiente) {
    html += `<p class="vacio">${tr("Dime qué hay que hacer. Lo parto en trabajos y abro una sesión para cada uno en tu PC; aquí verás cómo va cada una.")}</p>`;
  }
  const colocadas = new Set();
  // Lo que llega desde el último pintado entra desde abajo. Lo tuyo se
  // reconoce por su texto: así el mensaje que acabas de mandar (pendiente) y
  // el mismo ya apuntado por el PC son uno, y no entra dos veces.
  const ent = (e.ent ||= entradas());
  const claveDeTurno = (t) => (t.rol === "tu" ? `tu:${t.texto}` : `c${t.n}`);
  for (const t of conv?.turnos || []) {
    html += `<div class="turno${ent.de(claveDeTurno(t))}" data-rol="${t.rol === "tu" ? "tu" : "agente"}"><div class="burbuja">${md(t.texto)}</div></div>`;
    if (t.rol === "conserje") {
      for (const w of conv.trabajos.filter((x) => x.turno === t.n)) { html += tarjeta(w, ent); colocadas.add(claveDe(w)); }
    }
  }
  for (const w of (conv?.trabajos || []).filter((x) => !colocadas.has(claveDe(x)))) html += tarjeta(w, ent);
  if (e.pendiente && !(conv?.turnos || []).some((t) => t.rol === "tu" && t.texto === e.pendiente)) {
    html += `<div class="turno${ent.de(`tu:${e.pendiente}`)}" data-rol="tu"><div class="burbuja">${md(e.pendiente)}</div></div>`;
  }
  // Solo cuenta como «ya estaba» lo pintado con la conversación delante.
  if (conv) ent.pintado();
  if (e.enCurso?.pensando || (e.pendiente && !e.enCurso)) {
    html += `<p class="pensando">${mascota("trabaja", 24, "hilo")}${esc(delPc(e.enCurso?.paso) || tr("Pensando…"))}</p>`;
  }
  if (e.enCurso?.aviso && !e.enCurso.pensando) {
    html += `<p class="nota"><b>${tr("Esto no lo he hecho:")}</b> ${esc(delPc(e.enCurso.aviso))}</p>`;
  }
  if (e.enCurso?.error && !e.enCurso.pensando) {
    html += `<p class="nota"><b>${tr("No he podido contestar.")}</b> ${esc(delPc(e.enCurso.error))}<button class="mini" id="reintentar">${tr("Reintentar")}</button></p>`;
  }
  if (e.fallo) html += `<p class="nota">${esc(e.fallo)}</p>`;
  if (e.vivo?.error) html += `<p class="nota">${esc(tr("No sé cómo va cada sesión: {e}", { e: delPc(e.vivo.error) }))}</p>`;
  hilo.innerHTML = html;
  hilo.querySelectorAll(".tarjeta").forEach((b) => b.addEventListener("click", () => abrirSesion(b.dataset.clave)));
  const re = document.getElementById("reintentar");
  if (re) re.addEventListener("click", () => enviar(e.enCurso.texto));
  if (abajo) hilo.scrollTop = hilo.scrollHeight;
}

function pintarCaja() {
  const caja = document.getElementById("caja");
  if (!caja) return;
  const texto = document.getElementById("texto");
  const pensando = !!e.enCurso?.pensando;
  caja.dataset.mejorado = String(e.antes != null);
  document.getElementById("aviso-mejora").hidden = e.antes == null;
  const enviarB = document.getElementById("enviar");
  enviarB.innerHTML = pensando ? ICONO.parar : ICONO.subir;
  enviarB.setAttribute("aria-label", pensando ? tr("Parar") : tr("Enviar"));
  enviarB.disabled = !pensando && ((!texto.value.trim() && !e.adj?.rutas().length) || !!e.adj?.subiendo());
  const mejorarB = document.getElementById("mejorar");
  mejorarB.innerHTML = e.antes != null ? `${ICONO.deshacer}<span>${tr("Deshacer")}</span>` : `${ICONO.chispa}<span>${e.mejorando ? tr("Mejorando…") : tr("Mejorar")}</span>`;
  mejorarB.disabled = !!e.mejorando || (e.antes == null && !texto.value.trim());
  const cerebro = document.getElementById("cerebro");
  const elegido = ["haiku", "sonnet", "opus"].includes(e.conv?.cerebro) ? e.conv.cerebro : "sonnet";
  if (document.activeElement !== cerebro) cerebro.value = elegido;
  const routerB = document.getElementById("router");
  const on = e.conv ? e.conv.router : true;
  routerB.dataset.on = String(on);
  routerB.innerHTML = `${ICONO.diana}<span>${on ? tr("Router: automático") : tr("Router: apagado")}</span>`;
  // Con el router apagado, qué modelo llevan las sesiones: el fijado en la
  // conversación (en el PC o aquí), y si no Sonnet.
  const fijoCaja = document.getElementById("fijo-caja");
  const fijo = document.getElementById("fijo");
  fijoCaja.hidden = on;
  const fijado = ["haiku", "sonnet", "opus"].includes(e.conv?.fijo) ? e.conv.fijo : "sonnet";
  if (document.activeElement !== fijo) fijo.value = fijado;
}

function mostrarFallo(mensaje) {
  e.fallo = mensaje;
  pintarHilo();
}

async function enviar(repetir) {
  const texto = document.getElementById("texto");
  const escrito = (repetir ?? texto.value).trim();
  const txt = repetir === undefined ? conRutas(escrito, e.adj?.rutas() || []) : escrito;
  if (!txt || (repetir === undefined && e.adj?.subiendo())) return;
  if (repetir === undefined) { texto.value = ""; e.antes = null; e.crecer?.(); e.guardarBorrador?.(); e.adj?.vaciar(); }
  e.pendiente = txt;
  e.fallo = null;
  e.enCurso = { pensando: true, paso: tr("Mandándolo a tu PC…") };
  pintarHilo();
  reaccionaMascota("hilo", "enviado");
  pintarCaja();
  try {
    await api("POST", "/api/enviar", { id: e.id, texto: txt });
  } catch (err) {
    e.enCurso = null;
    e.pendiente = null;
    if (repetir === undefined) { texto.value = txt; e.crecer?.(); }
    mostrarFallo(err.message);
    pintarCaja();
    return;
  }
  cargarHilo().catch((err) => mostrarFallo(err.message));
}

async function parar() {
  await api("POST", "/api/parar", { id: e.id }).catch(() => {});
  cargarHilo().catch(() => {});
}

async function mejorar() {
  const texto = document.getElementById("texto");
  if (e.antes != null) {
    texto.value = e.antes;
    e.antes = null;
    e.crecer?.();
    e.guardarBorrador?.();
    pintarCaja();
    return;
  }
  const original = texto.value;
  if (!original.trim()) return;
  e.mejorando = true;
  pintarCaja();
  try {
    const v = await api("POST", "/api/mejorar", { texto: original });
    texto.value = v.texto;
    e.antes = original;
    e.crecer?.();
    e.guardarBorrador?.();
  } catch (err) {
    mostrarFallo(err.message);
  } finally {
    e.mejorando = false;
    pintarCaja();
  }
}

async function elegirCerebro(cerebro) {
  try {
    await api("POST", "/api/cerebro", { id: e.id, cerebro });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

async function elegirFijo(modelo) {
  try {
    await api("POST", "/api/fijo", { id: e.id, modelo });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

async function alternarRouter() {
  const on = e.conv ? e.conv.router : true;
  try {
    await api("POST", "/api/router", { id: e.id, encendido: !on });
    await cargarHilo();
  } catch (err) {
    mostrarFallo(err.message);
  }
}

// ─── Las terminales (decisión E3) ───────────────────────────────────────────
// Munir, 2026-10-07: texto libre desde el móvil a cualquier terminal, sabiendo
// que es lo más cómodo y lo más peligroso. La red que queda es la de siempre
// (solo un móvil emparejado, por Tailscale) y ninguna más: lo que se escribe
// aquí va directo al PTY del PC, sin pasar por el conserje ni por su reja.

async function pintarTerminales() {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">
        ${botonCajon()}
        <h1>${tr("Terminales")}<small>${tr("las que tienes abiertas en el PC")}</small></h1>
      </header>
      <main class="cuerpo" id="terminales"></main>
    </div>`;
  montarBotonCajon();
  const cargar = async () => {
    const v = await api("GET", "/api/terminales");
    const aqui = document.getElementById("terminales");
    if (!aqui) return;
    // Los agentes primero; las consolas al final.
    const lista = (v.terminales || []).slice().sort((a, b) => Number(b.agente) - Number(a.agente) || a.panel - b.panel);
    /* Por estado (Munir eligió «la 2» de tres el 2026-10-15; las tarjetas de
       antes le parecían «muy cutres»): un apartado por cómo están, de lo que
       te reclama a lo que descansa, y en cada fila el icono de su programa,
       el proyecto y el modelo debajo, y el punto de su estado. */
    const apartados = [
      ["pregunta", tr("Te preguntan")],
      ["trabajando", tr("Trabajando")],
      ["termino", tr("Terminaron")],
      ["cerrada", tr("En reposo")],
    ];
    const fila = (t) => {
      const [palabra, tono] = estadoTerminal(t);
      const debajo = [hoja(t.carpeta), t.agente ? t.modelo || tr("agente") : tr("consola")].filter(Boolean).join(" · ");
      return `<button class="fila fila-term${tono === "trabajando" ? " hilo" : ""}" data-panel="${t.panel}" data-estado="${tono}" aria-label="${esc(`${t.nombre} · ${debajo} · ${palabra}`)}">
        <span class="avatar${t.agente ? "" : " consola"}">${t.agente ? ICONO.chat : ICONO.terminal}</span>
        <span class="quien"><b>${esc(t.nombre)}</b><small>${esc(debajo)}</small></span>
        <i class="punto" data-tono="${tono}"></i>
      </button>`;
    };
    aqui.innerHTML = lista.length
      ? apartados.map(([tono, titulo]) => {
        const de = lista.filter((t) => estadoTerminal(t)[1] === tono);
        return de.length ? `<h2 class="seccion"><span>${titulo}</span></h2><div class="grupo">${de.map(fila).join("")}</div>` : "";
      }).join("")
      : `<p class="vacio">${tr("No hay ninguna terminal abierta en Adeorq.")}</p>`;
    aqui.querySelectorAll(".fila[data-panel]").forEach((b) => b.addEventListener("click", () => ir({ vista: "terminal", panel: Number(b.dataset.panel), arranque: v.arranque })));
  };
  try { await cargar(); } catch (err) {
    // Un 401 ya ha cambiado de vista (`olvidarClave`): entonces no hay dónde pintarlo.
    const aqui = document.getElementById("terminales");
    if (aqui) aqui.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
  }
  sondear(5000, cargar);
}

// ─── Programados y Uso ──────────────────────────────────────────────────────
/* Dos pantallas del cajón que solo se leen: lo que se lanza solo en tu PC (la
   Agenda, `programados.rs`) y lo que le queda a cada cuenta (lo mismo que lee
   el router). Se cambian en el PC; aquí se mira de un vistazo. */
const LETRA_DIA = ["", "L", "M", "X", "J", "V", "S", "D"];
/** Como `cuandoEnTexto` de lib/programados.ts: 1 es lunes y 7 domingo. */
function cuandoProgramado(c) {
  if (!c) return "";
  if (c.tipo === "cada") return c.horas === 1 ? tr("Cada hora") : tr("Cada {n} horas", { n: c.horas });
  const dias = [...new Set(c.dias || [])].filter((d) => d >= 1 && d <= 7).sort((a, b) => a - b);
  if (dias.length === 7) return tr("Cada día a las {h}", { h: c.hora });
  if (dias.join() === "1,2,3,4,5") return tr("De lunes a viernes a las {h}", { h: c.hora });
  return tr("{d} a las {h}", { d: dias.map((d) => tr(LETRA_DIA[d])).join(" "), h: c.hora });
}
/** Una pantalla del cajón: su cabecera y un cuerpo que se rellena y se refresca. */
function pantallaDelCajon(id, titulo, sub, cargar, cada) {
  app.innerHTML = `
    <div class="vista">
      <header class="barra">${botonCajon()}<h1>${titulo}<small>${sub}</small></h1></header>
      <main class="cuerpo" id="${id}"></main>
    </div>`;
  montarBotonCajon();
  const vuelta = async () => {
    try { await cargar(); } catch (err) {
      const aqui = document.getElementById(id);
      if (aqui) aqui.innerHTML = `<p class="nota">${esc(err.message)}</p>`;
    }
  };
  vuelta();
  sondear(cada, vuelta);
}

/* Uso, como baterías (Munir, 2026-10-16, «la 2»): una tarjeta por cuenta con
   la cifra grande, una barra gruesa por ventana (las 5 horas, la semana) y
   cuándo se renueva cada una, la más gastada arriba. Las que no dicen su
   gasto van juntas al final, y las que no están instaladas no salen. */
const NOMBRE_VENTANA = { "sesi\u00f3n": tr("las 5 horas"), semana: tr("la semana"), mes: tr("el mes") };
function cuandoRenueva(ms) {
  const falta = (ms || 0) - Date.now();
  if (!ms || falta <= 0) return "";
  const min = Math.round(falta / 60000);
  if (min < 60) return tr("se renueva en {n} min", { n: Math.max(1, min) });
  const horas = Math.round(falta / 3600000);
  if (horas < 24) return tr("se renueva en {n} h", { n: horas });
  return tr("se renueva el {dia}", { dia: new Intl.DateTimeFormat(INGLES ? "en" : "es", { weekday: "long" }).format(new Date(ms)) });
}
/** El color de un gasto: el naranja desde el 78 %, como en el PC, y rojo al final. */
const tonoDeGasto = (p) => (p >= 90 ? "mal" : p >= 78 ? "alto" : "bien");
function pintarUso() {
  pantallaDelCajon("uso", tr("Uso"), tr("lo que le queda a cada cuenta"), async () => {
    const v = await api("GET", "/api/uso");
    const aqui = document.getElementById("uso");
    if (!aqui) return;
    const cuentas = (v.cuentas || []).filter((c) => c.agente && c.instalada);
    const cifraDe = (c) => (typeof c.gastado === "number" ? c.gastado : c.ventanas?.length ? Math.max(...c.ventanas.map((x) => x.gastado)) : null);
    const conDato = cuentas.filter((c) => c.conectada && cifraDe(c) !== null).sort((a, b) => cifraDe(b) - cifraDe(a));
    const sinDato = cuentas.filter((c) => !conDato.includes(c));
    const bateria = (c) => {
      const cifra = cifraDe(c);
      const ventanas = c.ventanas?.length ? c.ventanas : [{ clave: "", modelo: null, gastado: cifra, renueva: null }];
      return `<div class="bat" data-tono="${tonoDeGasto(cifra)}">
        <div class="bat-cab"><b>${esc(c.nombre)}<small>${esc([c.programa, c.plan].filter(Boolean).join(" · "))}</small></b><span class="cifra">${tr("{p} %", { p: cifra })}</span></div>
        ${ventanas.map((x) => `<div class="bat-v" data-tono="${tonoDeGasto(x.gastado)}">
          <span class="barra-g"><i style="--p:${Math.min(100, Math.max(0, x.gastado))}%"></i></span>
          <small><span>${esc([NOMBRE_VENTANA[x.clave] ?? x.clave, x.modelo].filter(Boolean).join(" · "))}${x.clave ? ` · ${tr("{p} %", { p: x.gastado })}` : ""}</span><span>${esc(cuandoRenueva(x.renueva))}</span></small>
        </div>`).join("")}
      </div>`;
    };
    const suelta = (c) => `<li><b>${esc(c.nombre)}</b><span${c.conectada ? "" : " data-mal"}>${esc([c.programa, c.conectada ? tr("no dice cuánto lleva") : tr("sin sesión")].join(" · "))}</span></li>`;
    aqui.innerHTML = cuentas.length
      ? `${conDato.map(bateria).join("")}${sinDato.length ? `<h2 class="seccion"><span>${tr("Sin datos de gasto")}</span></h2><ul class="sin-dato">${sinDato.map(suelta).join("")}</ul>` : ""}`
      : `<p class="vacio">${tr("No hay cuentas en Adeorq.")}</p>`;
  }, 30000);
}

/* Lo que se elige para ESTE móvil (Munir, 2026-10-16: «hazlo más
   customizable»): la foto de detrás del cristal, los colores, la letra, Adeo,
   el inicio y los avisos. Se guarda en el propio móvil (`AJUSTES`, en el
   <head>) salvo qué avisos quiere, que lo tiene que saber el PC para no
   mandárselos (`/api/avisos`). De entrada, la foto y el acento son los del PC. */
const FOTO_PC = "adeorq-movil-foto-pc";
const FOTO_PROPIA = "adeorq-movil-foto-propia";
const ACENTOS = [["#4d9fff", tr("Azul")], ["#22d3ee", tr("Cian")], ["#46c99a", tr("Verde")], ["#f5c542", tr("Amarillo")],
  ["#ff9a3c", tr("Naranja")], ["#ff4b6e", tr("Rojo")], ["#ff7ac6", tr("Rosa")], ["#a877ff", tr("Violeta")]];
const SECCIONES = { saludo: tr("Adeo y el saludo"), reclaman: tr("Te esperan"), marcha: tr("En marcha"), conversaciones: tr("Conversaciones") };
const NOMBRES_LETRA = [tr("Pequeña"), tr("Normal"), tr("Grande"), tr("Muy grande")];
const entre = (v, si, min, max) => Math.min(max, Math.max(min, Number.isFinite(Number(v)) && v !== null ? Number(v) : si));

function guardarAjustes(cambio) {
  const a = { ...misAjustes(), ...cambio };
  try { localStorage.setItem(AJUSTES, JSON.stringify(a)); } catch (_) {}
  aplicarAspecto();
  aplicarFoto();
  return a;
}

/* Una foto para guardar en el móvil: JPEG de 1600 px de lado como mucho, que
   el almacén de una página es de unos 5 MB y caben las dos (la del PC y la tuya). */
async function fotoParaGuardar(blob) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const lienzo = document.createElement("canvas");
  lienzo.width = Math.round(bmp.width * k);
  lienzo.height = Math.round(bmp.height * k);
  lienzo.getContext("2d").drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
  bmp.close?.();
  return lienzo.toDataURL("image/jpeg", 0.82);
}
function guardarFoto(k, version, datos) {
  try {
    localStorage.setItem(k, JSON.stringify({ version, datos }));
    return true;
  } catch (_) {
    return false;
  }
}
// A mano y no con `fetch(datos)`: la página solo puede pedir a su PC (`connect-src`).
function aBlob(datos) {
  const [cab, b64] = datos.split(",");
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: /data:([^;]+)/.exec(cab)?.[1] || "image/jpeg" });
}
/* Una dirección por foto guardada, hecha una vez: rehacerla con cada ajuste
   que se toca haría parpadear el fondo. */
const urlsDeFoto = new Map();
function urlDeFoto(k) {
  const f = leerGuardado(k);
  if (typeof f.datos !== "string" || !f.datos.startsWith("data:image/")) return null;
  const marca = `${f.version}:${f.datos.length}`;
  const hecha = urlsDeFoto.get(k);
  if (hecha?.marca === marca) return hecha.url;
  if (hecha) URL.revokeObjectURL(hecha.url);
  try {
    const url = URL.createObjectURL(aBlob(f.datos));
    urlsDeFoto.set(k, { marca, url });
    return url;
  } catch (_) {
    return null;
  }
}
/** La foto de detrás del cristal, con su velo y su desenfoque. */
function aplicarFoto() {
  const a = misAjustes();
  const pc = leerGuardado(GUARDADO_PC);
  const url = a.fondo === "nada" ? null : urlDeFoto(a.fondo === "propia" ? FOTO_PROPIA : FOTO_PC);
  const b = document.body;
  if (!url) {
    delete b.dataset.foto;
    b.style.removeProperty("--foto");
    return;
  }
  const comoPc = a.cristal === "pc";
  const ve = comoPc ? entre(pc.opacidad, 60, 5, 100) : entre(a.ve, 60, 5, 100);
  const desenfoque = comoPc ? entre(pc.desenfoque, 0, 0, 24) : entre(a.desenfoque, 0, 0, 24);
  b.dataset.foto = "";
  b.style.setProperty("--foto", `url("${url}")`);
  b.style.setProperty("--foto-velo", String((100 - ve) / 100));
  b.style.setProperty("--foto-desenfoque", `${desenfoque}px`);
}
aplicarFoto();

/** Lo que dice el PC de su aspecto, y su foto si cambió desde la última vez. */
async function traerDelPc() {
  const v = await api("GET", "/api/apariencia");
  try {
    localStorage.setItem(GUARDADO_PC, JSON.stringify({ acento: v.acento ?? null, opacidad: v.opacidad ?? null, desenfoque: v.desenfoque ?? null, fondo: v.fondo ?? null }));
  } catch (_) {}
  const version = v.fondo && !v.fondo.video ? v.fondo.version : null;
  if (version !== (leerGuardado(FOTO_PC).version ?? null)) {
    if (!version) {
      try { localStorage.removeItem(FOTO_PC); } catch (_) {}
    } else {
      const r = await fetch("/api/fondo", { headers: { Authorization: `Bearer ${clave || ""}` }, cache: "no-store" });
      if (r.ok) guardarFoto(FOTO_PC, version, await fotoParaGuardar(await r.blob()));
    }
  }
  aplicarAspecto();
  aplicarFoto();
}
