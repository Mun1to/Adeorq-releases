<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="Descárgala y ábrela.: No hay cuenta que crear ni clave que pegar. Dile dónde viven tus proyectos.: Cada carpeta de ahí dentro pasa a ser un proyecto en la barra lateral, con las sesiones que ya tenías en cada uno. Haz clic en un proyecto.: Se abre una sesión de tu CLI de siempre en una terminal de verdad, en esa carpeta (Claude Code, de fábrica). Haz clic en otro y ya tienes dos."><g transform="translate(134 8) scale(2.1667)"><g fill="none" stroke="#3f7de3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></g></g><text x="160" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Descárgala y ábrela.</text><text x="160" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">No hay cuenta que crear ni clave</text><text x="160" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">que pegar.</text><path d="M206 34 H432" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M425 28 L434 34 L425 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(454 8) scale(2.1667)"><path fill="none" stroke="#3f7de3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g><text x="480" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Aria